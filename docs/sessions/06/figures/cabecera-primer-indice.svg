<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-label="Origen y recuperación del primer índice: transmisor y receptor separados"><title>Origen y recuperación del primer índice: transmisor y receptor separados</title><rect width="1000" height="735" fill="white" /><text x="30" y="35" font-size="24" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Primer índice: separar transmisión y recepción</text><rect x="30" y="55" width="940" height="355" rx="9" fill="#f6f8fb" stroke="#a0b3d4" /><text x="50" y="88" font-size="20" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">TRANSMISOR · Explica de dónde sale el índice recibido</text><text x="50" y="120" font-size="21" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Fila del entrelazador   11101</text><text x="50" y="151" font-size="20" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Paridad XOR = 0; cero fijo = 0 → 11101 | 0 | 0 = 1110100</text><text x="50" y="184" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Inversa Gray: copiar el primer bit y acumular XOR de izquierda a derecha</text><text x="330" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">1</text><rect x="304" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="330" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="304" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="330" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><text x="401" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">2</text><rect x="375" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="401" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="375" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="401" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><text x="472" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">3</text><rect x="446" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="472" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="446" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="472" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><text x="543" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">4</text><rect x="517" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="543" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><rect x="517" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="543" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><text x="614" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">5</text><rect x="588" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="614" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="588" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="614" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><text x="685" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">6</text><rect x="659" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="685" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><rect x="659" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="685" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><text x="756" y="216" font-size="16" fill="#60748a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">7</text><rect x="730" y="228" width="52" height="40" rx="9" fill="#e8eefb" stroke="#a0b3d4" /><text x="756" y="256" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><rect x="730" y="280" width="52" height="40" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><text x="756" y="308" font-size="23" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><text x="50" y="255" font-size="19" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Entrada Gray</text><text x="50" y="307" font-size="19" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Binario acumulado</text><text x="50" y="356" font-size="21" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1110100 → 1011000 = 88; sumar 1 → 1011001 = 89</text><text x="50" y="388" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Las dos posiciones adicionales son paridad y cero antes de este mapeo.</text><rect x="30" y="430" width="940" height="275" rx="9" fill="#f0f8f4" stroke="#92bfa8" /><text x="50" y="465" font-size="20" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">RECEPTOR · Recorrido que seguimos en la práctica</text><text x="50" y="504" font-size="21" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Índice 1011001 (89) − 1 = 1011000 (88)</text><text x="50" y="543" font-size="21" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Dividir entre 4: 1011000 &gt;&gt; 2 = 0010110 = 10110</text><text x="50" y="582" font-size="21" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Gray: u XOR (u &gt;&gt; 1) = 10110 XOR 01011 = 11101</text><text x="50" y="638" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">El desplazamiento quita los dos ceros de la derecha del índice ajustado.</text><text x="50" y="671" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">0010110 y 10110 representan el mismo valor: 22; los ceros de la izquierda son formato.</text></svg>