<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="title desc"><title id="title">Conversión de dos bytes por complejo</title><desc id="desc">Cuatro bytes de entrada se convierten en dos complejos, cada uno con dos flotantes de 32 bits.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="445" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">Decimación de elementos 2:1 sin perder muestras I/Q</text><rect x="45" y="85" width="180" height="80" rx="8" class="i"/><text x="135.0" y="113" class="" text-anchor="middle">I₀</text><text x="135.0" y="138" class="" text-anchor="middle">255</text><rect x="255" y="85" width="180" height="80" rx="8" class="q"/><text x="345.0" y="113" class="" text-anchor="middle">Q₀</text><text x="345.0" y="138" class="" text-anchor="middle">0</text><rect x="465" y="85" width="180" height="80" rx="8" class="i"/><text x="555.0" y="113" class="" text-anchor="middle">I₁</text><text x="555.0" y="138" class="" text-anchor="middle">0</text><rect x="675" y="85" width="180" height="80" rx="8" class="q"/><text x="765.0" y="113" class="" text-anchor="middle">Q₁</text><text x="765.0" y="138" class="" text-anchor="middle">255</text><path d="M230 180 L230 235" class="arrow"/><path d="M650 180 L650 235" class="arrow"/><rect x="95" y="245" width="280" height="90" rx="8" class="out"/><text x="235.0" y="273" class="" text-anchor="middle">x₀ = 1 − j</text><text x="235.0" y="298" class="" text-anchor="middle">np.complex64</text><rect x="515" y="245" width="280" height="90" rx="8" class="out"/><text x="655.0" y="273" class="" text-anchor="middle">x₁ = −1 + j</text><text x="655.0" y="298" class="" text-anchor="middle">np.complex64</text><text x="450" y="385" class="small" text-anchor="middle">Entrada: 4 elementos uint8 (4 bytes) → salida: 2 complejos (16 bytes)</text><text x="450" y="415" class="small" text-anchor="middle">Se reduce el número de elementos, no el de muestras físicas representadas.</text></svg>
