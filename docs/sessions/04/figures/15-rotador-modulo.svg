<svg xmlns="http://www.w3.org/2000/svg" width="900" height="535" viewBox="0 0 900 535" role="img" aria-labelledby="title desc"><title id="title">Módulo de fase y dirección equivalente</title><desc id="desc">Una fase de cuatrocientos veinte grados se guarda como sesenta; el oscilador complejo conserva el mismo punto.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.blue{fill:#deebff;stroke:#638dcc}.green{fill:#e1f2e9;stroke:#6d9c81}.bad{fill:#fff0ed;stroke:#c78d81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#arrow)}.axis{stroke:#8a9eb6;stroke-width:1.3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="535" fill="white"/><text x="30" y="42" class="title" text-anchor="start">Módulo 2π: cambiar el número sin cambiar la dirección</text><rect x="35" y="85" width="365" height="90" rx="8" class="blue"/><text x="217.5" y="113" class="" text-anchor="middle">420° = 360° + 60°</text><text x="217.5" y="138" class="" text-anchor="middle">Fase equivalente: 60°</text><path d="M415 130 L485 130" class="arrow"/><rect x="500" y="85" width="365" height="90" rx="8" class="green"/><text x="682.5" y="113" class="" text-anchor="middle">exp(j · 420°) = exp(j · 60°)</text><text x="682.5" y="138" class="" text-anchor="middle">cos 60° + j · sen 60°</text><circle cx="250" cy="340" r="85" fill="none" stroke="#a7b5c8"/><path d="M135 340 H365 M250 225 V455" class="axis"/><path d="M250 340 L292.5 266.38784067832273" class="arrow"/><text x="250" y="225" class="small" text-anchor="middle">60° y 420°: mismo punto</text><rect x="455" y="245" width="395" height="100" rx="8" class="box"/><text x="652.5" y="273" class="" text-anchor="middle">Python: fase % (2*np.pi)</text><text x="652.5" y="298" class="" text-anchor="middle">Conserva un ángulo en [0, 2π)</text><text x="652.5" y="323" class="" text-anchor="middle">También: −60° % 360° = 300°</text><rect x="455" y="375" width="395" height="80" rx="8" class="green"/><text x="652.5" y="403" class="" text-anchor="middle">No fija la fase a cero.</text><text x="652.5" y="428" class="" text-anchor="middle">Retira solo vueltas completas.</text><text x="450" y="505" class="small" text-anchor="middle">360° y 0° son números diferentes, pero exp(j · 360°) = exp(j · 0°).</text></svg>
