<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="title desc"><title id="title">Sintaxis, parámetros y puertos</title><desc id="desc">Tres responsabilidades distintas: lenguaje Python, parámetro configurable y firma GNU Radio.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="435" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">Python define la clase; GNU Radio organiza sus puertos</text><rect x="30" y="75" width="270" height="125" rx="8" class="box"/><text x="165.0" y="103" class="" text-anchor="middle">Python</text><text x="165.0" y="128" class="" text-anchor="middle">class, def, __init__, self</text><text x="165.0" y="153" class="" text-anchor="middle">Atributos de la instancia</text><rect x="330" y="75" width="260" height="125" rx="8" class="box"/><text x="460.0" y="103" class="" text-anchor="middle">Configuración GRC</text><text x="460.0" y="128" class="" text-anchor="middle">escala = 127.5</text><text x="460.0" y="153" class="" text-anchor="middle">Argumento al crear blk</text><rect x="620" y="75" width="250" height="125" rx="8" class="box"/><text x="745.0" y="103" class="" text-anchor="middle">GNU Radio</text><text x="745.0" y="128" class="" text-anchor="middle">gr.decim_block</text><text x="745.0" y="153" class="" text-anchor="middle">Puertos y relación 2:1</text><path d="M165 205 L165 245" class="arrow"/><path d="M460 205 L460 245" class="arrow"/><path d="M745 205 L745 245" class="arrow"/><rect x="55" y="250" width="790" height="110" rx="8" class="out"/><text x="450.0" y="278" class="" text-anchor="middle">Instancia: blk(escala=127.5)</text><text x="450.0" y="303" class="small" text-anchor="middle">self.escala guarda el valor; in_sig y out_sig definen tipos.</text><text x="450.0" y="328" class="small" text-anchor="middle">work recibe buffers; calcula valores y los escribe en la salida.</text><text x="450" y="405" class="small" text-anchor="middle">Un parámetro es configuración; un puerto transporta elementos del stream.</text></svg>
