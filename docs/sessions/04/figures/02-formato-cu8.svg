<svg xmlns="http://www.w3.org/2000/svg" width="900" height="395" viewBox="0 0 900 395" role="img" aria-labelledby="title desc"><title id="title">Bytes intercalados I Q</title><desc id="desc">Cuatro pares de bytes I Q y sus índices; la conversión conserva cada par.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="395" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">Cada muestra ocupa dos bytes: primero I, después Q</text><rect x="38" y="85" width="92" height="65" rx="8" class="i"/><text x="84.0" y="113" class="" text-anchor="middle">I₀</text><text x="84" y="180" class="small" text-anchor="middle">byte 0</text><rect x="142" y="85" width="92" height="65" rx="8" class="q"/><text x="188.0" y="113" class="" text-anchor="middle">Q₀</text><text x="188" y="180" class="small" text-anchor="middle">byte 1</text><rect x="246" y="85" width="92" height="65" rx="8" class="i"/><text x="292.0" y="113" class="" text-anchor="middle">I₁</text><text x="292" y="180" class="small" text-anchor="middle">byte 2</text><rect x="350" y="85" width="92" height="65" rx="8" class="q"/><text x="396.0" y="113" class="" text-anchor="middle">Q₁</text><text x="396" y="180" class="small" text-anchor="middle">byte 3</text><rect x="454" y="85" width="92" height="65" rx="8" class="i"/><text x="500.0" y="113" class="" text-anchor="middle">I₂</text><text x="500" y="180" class="small" text-anchor="middle">byte 4</text><rect x="558" y="85" width="92" height="65" rx="8" class="q"/><text x="604.0" y="113" class="" text-anchor="middle">Q₂</text><text x="604" y="180" class="small" text-anchor="middle">byte 5</text><rect x="662" y="85" width="92" height="65" rx="8" class="i"/><text x="708.0" y="113" class="" text-anchor="middle">I₃</text><text x="708" y="180" class="small" text-anchor="middle">byte 6</text><rect x="766" y="85" width="92" height="65" rx="8" class="q"/><text x="812.0" y="113" class="" text-anchor="middle">Q₃</text><text x="812" y="180" class="small" text-anchor="middle">byte 7</text><text x="136" y="220" class="" text-anchor="middle">Muestra 0</text><text x="344" y="220" class="" text-anchor="middle">Muestra 1</text><text x="552" y="220" class="" text-anchor="middle">Muestra 2</text><text x="760" y="220" class="" text-anchor="middle">Muestra 3</text><rect x="90" y="255" width="320" height="75" rx="8" class="i"/><text x="250.0" y="283" class="" text-anchor="middle">uint8 por componente</text><text x="250.0" y="308" class="" text-anchor="middle">Valores enteros: 0 a 255</text><rect x="490" y="255" width="320" height="75" rx="8" class="out"/><text x="650.0" y="283" class="" text-anchor="middle">complex64 al convertir</text><text x="650.0" y="308" class="" text-anchor="middle">I float32 + j · Q float32</text><path d="M420 290 L480 290" class="arrow"/><text x="450" y="370" class="small" text-anchor="middle">8 bits de I + 8 bits de Q → un número complejo (misma muestra)</text></svg>
