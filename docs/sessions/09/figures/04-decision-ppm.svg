<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 505" role="img"><title>PPM: elegir la posición del pulso dentro de un símbolo</title><rect width="1120" height="505" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">PPM: elegir la posición del pulso dentro de un símbolo</text><text x="50" y="81" font-size="21" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Esquema ideal · símbolo que representa 1</text><rect x="50" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="74" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="103" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="127" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="156" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="180" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="209" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="233" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="262" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="286" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="315" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="339" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="368" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="392" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="421" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="445" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><text x="50" y="207" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">0 µs</text><text x="262" y="207" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">0.5 µs</text><text x="474" y="207" font-size="17" fill="#17314a" font-weight="normal" text-anchor="end" font-family="DejaVu Sans, sans-serif">1 µs</text><text x="156" y="242" font-size="18" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">H1: 4 muestras</text><text x="368" y="242" font-size="18" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">H2: 4 muestras</text><text x="585" y="81" font-size="21" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Esquema ideal · símbolo que representa 0</text><rect x="585" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="609" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="638" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="662" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="691" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="715" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="744" y="100" width="48" height="77" rx="8" fill="#f2f5f8" stroke="#a9bccf" /><text x="768" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><rect x="797" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="821" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="850" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="874" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="903" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="927" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><rect x="956" y="100" width="48" height="77" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="980" y="145" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><text x="585" y="207" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">0 µs</text><text x="797" y="207" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">0.5 µs</text><text x="1009" y="207" font-size="17" fill="#17314a" font-weight="normal" text-anchor="end" font-family="DejaVu Sans, sans-serif">1 µs</text><text x="691" y="242" font-size="18" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">H1: 4 muestras</text><text x="903" y="242" font-size="18" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">H2: 4 muestras</text><rect x="35" y="272" width="1050" height="66" rx="8" fill="#edf3fa" stroke="#a9bccf" /><text x="55" y="301" font-size="22" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">P1 = promedio(p[n:n+4]);    P2 = promedio(p[n+4:n+8])</text><text x="55" y="325" font-size="18" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Decisión: bit = 1 si P1 &gt; P2; bit = 0 en otro caso. A=alto, b=bajo.</text><text x="35" y="376" font-size="21" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Ejemplos observados, no pulsos ideales:</text><text x="55" y="411" font-size="21" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">S001: P1=1.182851 | P2=0.984558 | bit=1</text><text x="55" y="444" font-size="21" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">S002: P1=0.146637 | P2=1.462212 | bit=0</text><text x="35" y="485" font-size="18" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Remuestrear a 8 Msps facilita la cuadrícula; no añade información a la captura original.</text></svg>