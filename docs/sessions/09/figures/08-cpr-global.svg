<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img"><title>CPR global: dos mensajes compatibles permiten recuperar una posición</title><rect width="1120" height="600" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">CPR global: dos mensajes compatibles permiten recuperar una posición</text><rect x="30" y="75" width="520" height="152" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="47" y="108" font-size="19" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Mensaje par · F=0 · ICAO 4402f2</text><text x="47" y="140" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">8d4402f258b9f270bbcdb62b2397</text><text x="47" y="172" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">LAT-CPR=79965 · LON-CPR=118198</text><text x="47" y="204" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">t_archivo=0.91411750 s</text><rect x="580" y="75" width="520" height="152" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="597" y="108" font-size="19" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Mensaje impar · F=1 · ICAO 4402f2</text><text x="597" y="140" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">8d4402f258bb25dcdbcf62e6e969</text><text x="597" y="172" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">LAT-CPR=61037 · LON-CPR=118626</text><text x="597" y="204" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">t_archivo=2.17346625 s</text><text x="30" y="271" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">1. Normalizar los enteros: dividir cada coordenada CPR por 2¹⁷ = 131072.</text><text x="30" y="309" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">2. Combinar rejillas de latitud de 6° y 360/59°: j=8.</text><text x="30" y="347" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">3. Candidatas: par 51.660507°; impar 51.654968°. NL=37 en ambas.</text><text x="30" y="385" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">4. El mensaje más reciente es impar: elegir su latitud; ni=37−1=36 para longitud.</text><rect x="30" y="416" width="1050" height="75" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="55" y="448" font-size="25" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">LATITUD 51.654968262°     LONGITUD -0.949554443°</text><text x="55" y="477" font-size="18" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Posición correspondiente al mensaje impar; no es el promedio de las dos latitudes.</text><text x="30" y="533" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Mismo ICAO · CRC válidos · F opuestos · separación de archivo 1.259349 s ≤ 10 s</text><text x="30" y="572" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">No se introduce una ubicación conocida. La comparación con pyModeS verifica el cálculo.</text></svg>