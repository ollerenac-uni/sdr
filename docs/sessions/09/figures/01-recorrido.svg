<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img"><title>De la señal de radio a la posición en el mapa</title><rect width="1120" height="340" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">De la señal de radio a la posición en el mapa</text><rect x="25" y="85" width="165" height="130" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="107" y="119" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">I + jQ</text><text x="107" y="150" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">2.4 Msps</text><text x="107" y="181" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Muestras reales</text><line x1="191" y1="151" x2="206" y2="151" stroke="#47617d" stroke-width="2" /><path d="M198,145 L206,151 L198,157" fill="none" stroke="#47617d" stroke-width="2" /><rect x="208" y="85" width="165" height="130" rx="8" fill="#eadff9" stroke="#a9bccf" /><text x="290" y="119" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">|x[n]|²</text><text x="290" y="150" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">8 Msps</text><text x="290" y="181" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Potencia</text><line x1="374" y1="151" x2="389" y2="151" stroke="#47617d" stroke-width="2" /><path d="M381,145 L389,151 L381,157" fill="none" stroke="#47617d" stroke-width="2" /><rect x="391" y="85" width="165" height="130" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="473" y="119" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Preámbulo</text><text x="473" y="150" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">8 µs</text><text x="473" y="181" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Alinear tiempos</text><line x1="557" y1="151" x2="572" y2="151" stroke="#47617d" stroke-width="2" /><path d="M564,145 L572,151 L564,157" fill="none" stroke="#47617d" stroke-width="2" /><rect x="574" y="85" width="165" height="130" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="656" y="119" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">PPM</text><text x="656" y="150" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">112 símbolos</text><text x="656" y="181" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">112 bits</text><line x1="740" y1="151" x2="755" y2="151" stroke="#47617d" stroke-width="2" /><path d="M747,145 L755,151 L747,157" fill="none" stroke="#47617d" stroke-width="2" /><rect x="757" y="85" width="165" height="130" rx="8" fill="#f9dfe5" stroke="#a9bccf" /><text x="839" y="119" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">DF17 + CRC</text><text x="839" y="150" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">14 bytes</text><text x="839" y="181" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Campos válidos</text><line x1="923" y1="151" x2="938" y2="151" stroke="#47617d" stroke-width="2" /><path d="M930,145 L938,151 L930,157" fill="none" stroke="#47617d" stroke-width="2" /><rect x="940" y="85" width="165" height="130" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="1022" y="119" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CPR global</text><text x="1022" y="150" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Par + impar</text><text x="1022" y="181" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Latitud / longitud</text><text x="30" y="257" font-size="21" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">GNU Radio: remuestreo 10/3 y potencia. Python: sincronismo, PPM, CRC y CPR.</text><text x="30" y="294" font-size="21" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">8 muestras por símbolo ≠ 8 bits: las muestras permiten decidir un único bit.</text></svg>