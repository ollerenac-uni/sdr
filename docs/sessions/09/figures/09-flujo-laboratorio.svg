<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img"><title>Laboratorio 6: del recorte real al mapa con evidencia</title><rect width="1120" height="340" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Laboratorio 6: del recorte real al mapa con evidencia</text><rect x="25" y="90" width="195" height="130" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="122" y="124" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Muestras I/Q</text><text x="122" y="155" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Recorte 14–27 s</text><text x="122" y="186" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">2.4 Msps</text><line x1="221" y1="155" x2="241" y2="155" stroke="#47617d" stroke-width="2" /><path d="M233,149 L241,155 L233,161" fill="none" stroke="#47617d" stroke-width="2" /><rect x="245" y="90" width="195" height="130" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="342" y="124" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Recepción</text><text x="342" y="155" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">PPM + CRC</text><text x="342" y="186" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Facilitada</text><line x1="441" y1="155" x2="461" y2="155" stroke="#47617d" stroke-width="2" /><path d="M453,149 L461,155 L453,161" fill="none" stroke="#47617d" stroke-width="2" /><rect x="465" y="90" width="195" height="130" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="562" y="124" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">112 bits / trama</text><text x="562" y="155" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">extraer_campos</text><text x="562" y="186" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Código del alumno</text><line x1="661" y1="155" x2="681" y2="155" stroke="#47617d" stroke-width="2" /><path d="M673,149 L681,155 L673,161" fill="none" stroke="#47617d" stroke-width="2" /><rect x="685" y="90" width="195" height="130" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="782" y="124" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CPR global</text><text x="782" y="155" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Par + impar</text><text x="782" y="186" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Facilitado</text><line x1="881" y1="155" x2="901" y2="155" stroke="#47617d" stroke-width="2" /><path d="M893,149 L901,155 L893,161" fill="none" stroke="#47617d" stroke-width="2" /><rect x="905" y="90" width="195" height="130" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="1002" y="124" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Mapa</text><text x="1002" y="155" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Tres aeronaves</text><text x="1002" y="186" font-size="17" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Con evidencias</text><text x="30" y="264" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">La función del alumno entrega los campos que se utilizan para calcular las coordenadas.</text><text x="30" y="303" font-size="20" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Los tres casos de CRC se estudian aparte: no se mezclan con la captura I/Q del mapa.</text></svg>