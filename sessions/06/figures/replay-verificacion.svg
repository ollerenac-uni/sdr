<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1000 890" role="img" aria-label="Gateway comprueba CRC; Network Server verifica MIC y FCnt; Application Server descifra"><ns0:title>Gateway comprueba CRC; Network Server verifica MIC y FCnt; Application Server descifra</ns0:title><ns0:rect width="1000" height="890" fill="white" /><ns0:text x="30" y="35" font-size="24" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Mismo replay de A · FCnt recibido=4 · último válido=5</ns0:text><ns0:text x="30" y="68" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">El control que cambia está en el servidor de red; el cifrado es el mismo en ambos caminos.</ns0:text><ns0:rect x="150" y="90" width="700" height="88" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="500" y="118" font-size="22" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">GATEWAY</ns0:text><ns0:text x="500" y="145" font-size="18" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Comprueba CRC físico: válido → reenvía la trama</ns0:text><ns0:text x="500" y="168" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">No verifica el MIC ni controla FCnt</ns0:text><ns0:line x1="350" y1="180" x2="255" y2="232" stroke="#47617d" stroke-width="2" /><ns0:path d="M 259.6167835215013,223.77289176468466 L 255,232 L 264.41823838386273,232.54478045553716" fill="none" stroke="#47617d" stroke-width="2" /><ns0:line x1="650" y1="180" x2="745" y2="232" stroke="#47617d" stroke-width="2" /><ns0:path d="M 735.5817616161373,232.54478045553716 L 745,232 L 740.3832164784988,223.77289176468466" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="30" y="235" width="450" height="365" rx="9" fill="#f6f8fb" stroke="#d1dce7" /><ns0:text x="255" y="268" font-size="21" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server vulnerable</ns0:text><ns0:rect x="50" y="285" width="410" height="75" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="255" y="314" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">1. Verifica MIC con NwkSKey</ns0:text><ns0:text x="255" y="343" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Válido: la trama sigue siendo auténtica</ns0:text><ns0:line x1="255" y1="362" x2="255" y2="392" stroke="#47617d" stroke-width="2" /><ns0:path d="M 250.0,384.0 L 255,392 L 260.0,384.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="395" width="410" height="80" rx="9" fill="#fff0ea" stroke="#a0b3d4" /><ns0:text x="255" y="425" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">No consulta el historial de FCnt</ns0:text><ns0:text x="255" y="454" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Trata la trama como un dato nuevo</ns0:text><ns0:line x1="255" y1="477" x2="255" y2="512" stroke="#47617d" stroke-width="2" /><ns0:path d="M 250.0,504.0 L 255,512 L 260.0,504.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="515" width="410" height="62" rx="9" fill="#fff0ea" stroke="#a0b3d4" /><ns0:text x="255" y="541" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">REENVÍA A OTRA VEZ</ns0:text><ns0:text x="255" y="565" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Contenido de aplicación aún cifrado</ns0:text><ns0:line x1="255" y1="602" x2="255" y2="658" stroke="#47617d" stroke-width="2" /><ns0:path d="M 250.0,650.0 L 255,658 L 260.0,650.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="660" width="410" height="100" rx="9" fill="#fff0ea" stroke="#a0b3d4" /><ns0:text x="255" y="688" font-size="20" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">APPLICATION SERVER</ns0:text><ns0:text x="255" y="717" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Descifra A con AppSKey</ns0:text><ns0:text x="255" y="746" font-size="18" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Estado de la aplicación: temp=25</ns0:text><ns0:rect x="520" y="235" width="450" height="365" rx="9" fill="#f6f8fb" stroke="#d1dce7" /><ns0:text x="745" y="268" font-size="21" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server con FCnt</ns0:text><ns0:rect x="540" y="285" width="410" height="75" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="745" y="314" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">1. Verifica MIC con NwkSKey</ns0:text><ns0:text x="745" y="343" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Válido: la trama sigue siendo auténtica</ns0:text><ns0:line x1="745" y1="362" x2="745" y2="392" stroke="#47617d" stroke-width="2" /><ns0:path d="M 740.0,384.0 L 745,392 L 750.0,384.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="540" y="395" width="410" height="80" rx="9" fill="#fff2cf" stroke="#a0b3d4" /><ns0:text x="745" y="425" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">2. ¿FCnt recibido &gt; último válido?</ns0:text><ns0:text x="745" y="454" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">4 &gt; 5 es falso → bloquea el reenvío</ns0:text><ns0:line x1="745" y1="477" x2="745" y2="512" stroke="#47617d" stroke-width="2" /><ns0:path d="M 740.0,504.0 L 745,512 L 750.0,504.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="540" y="515" width="410" height="62" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="745" y="541" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">NO REENVÍA A LA APLICACIÓN</ns0:text><ns0:text x="745" y="565" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Conserva último FCnt válido = 5</ns0:text><ns0:line x1="745" y1="602" x2="745" y2="627" stroke="#b04747" stroke-width="2" /><ns0:path d="M 739,622 l 12,12 m -12,0 l 12,-12" fill="none" stroke="#b04747" stroke-width="2" /><ns0:text x="745" y="649" font-size="16" fill="#b04747" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Sin nueva entrega</ns0:text><ns0:rect x="540" y="660" width="410" height="100" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="745" y="688" font-size="20" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">APPLICATION SERVER</ns0:text><ns0:text x="745" y="717" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">No recibe A: no actualiza la lectura</ns0:text><ns0:text x="745" y="746" font-size="18" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Estado de la aplicación: temp=80</ns0:text><ns0:rect x="30" y="792" width="940" height="72" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="50" y="822" font-size="19" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Si el MIC falla, el Network Server no reenvía ni avanza el contador.</ns0:text><ns0:text x="50" y="849" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">La aplicación solo puede actualizar su estado cuando el servidor de red le entrega un dato.</ns0:text></ns0:svg>