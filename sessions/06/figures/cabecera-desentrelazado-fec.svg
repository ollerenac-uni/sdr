45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="208" y="393" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="229" y="416" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><rect x="255" y="393" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="276" y="416" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="302" y="393" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="323" y="416" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><text x="400" y="417" font-size="19" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">S8, bit 2 → 1</text><rect x="650" y="156" width="315" height="195" rx="9" fill="#fff4df" stroke="#cb8b34" /><text x="675" y="193" font-size="20" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Leer de S1 a S8</text><text x="675" y="239" font-size="31" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">10001011</text><text x="675" y="279" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Ocho bits, una palabra</text><text x="675" y="314" font-size="17" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">De S1 se toma su bit 5</text><text x="30" y="463" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">S1 reparte sus cinco bits entre cinco palabras: no se convierte sola en una palabra.</text><rect x="30" y="490" width="940" height="285" rx="9" fill="#f0f8f4" stroke="#92bfa8" /><text x="50" y="526" font-size="20" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">FEC 4/8 · Comprobar paridad y recuperar el orden de los datos</text><text x="50" y="569" font-size="20" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Palabra: 1000 | 1011 = cuatro bits de datos | cuatro de paridad</text><text x="50" y="610" font-size="20" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Datos: 1000; paridad calculada: 1011; recibida: 1011</text><text x="50" y="648" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">La palabra de esta muestra es válida: no requiere corregir bits.</text><text x="50" y="690" font-size="20" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Datos en orden del codificador: 1000 → orden original: 0001</text><text x="50" y="736" font-size="22" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Resultado del decodificador: 0001</text></svg>