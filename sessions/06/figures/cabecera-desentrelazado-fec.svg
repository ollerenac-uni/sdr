76" width="42" height="31" rx="9" fill="#ffdfad" stroke="#cb8b34" /><text x="276" y="299" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="302" y="276" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="323" y="299" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><text x="400" y="300" font-size="19" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">S5, bit 4 → 1</text><text x="45" y="340" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">S6</text><rect x="114" y="315" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="135" y="338" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><rect x="161" y="315" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="182" y="338" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><rect x="208" y="315" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="229" y="338" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="255" y="315" width="42" height="31" rx="9" fill="#f0f3f8" stroke="#c4cfdb" /><text x="276" y="338" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">1</text><rect x="302" y="315" width="42" height="31" rx="9" fill="#ffdfad" stroke="#cb8b34" /><text x="323" y="338" font-size="20" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><text x="400" y="339" font-size="19" fill="#172d45" font-weight="normal" text-anchor="start" font-family="Deja