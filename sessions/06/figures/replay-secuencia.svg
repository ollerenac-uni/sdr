<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-label="Replay: gateway, Network Server y Application Server en dos caminos simulados"><ns0:title>Replay: gateway, Network Server y Application Server en dos caminos simulados</ns0:title><ns0:rect width="1000" height="920" fill="white" /><ns0:text x="30" y="35" font-size="25" fill="#172d45" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Una lectura antigua puede ocultar la alarma</ns0:text><ns0:text x="30" y="65" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Mismo tráfico; dos políticas de Network Server y sus aplicaciones independientes.</ns0:text><ns0:rect x="30" y="85" width="940" height="245" rx="9" fill="#f6f8fb" stroke="#d1dce7" /><ns0:rect x="50" y="95" width="325" height="44" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="212" y="114" font-size="17" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">t1 · Sensor: trama A</ns0:text><ns0:text x="212" y="132" font-size="15" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">FCnt=4 · contenido cifrado</ns0:text><ns0:line x1="377" y1="117" x2="413" y2="117" stroke="#47617d" stroke-width="2" /><ns0:path d="M 405.0,122.0 L 413,117 L 405.0,112.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="415" y="95" width="535" height="44" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="682" y="114" font-size="17" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Gateway: comprueba CRC físico</ns0:text><ns0:text x="682" y="132" font-size="15" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CRC válido → reenvía el PHYPayload cifrado</ns0:text><ns0:line x1="580" y1="140" x2="265" y2="167" stroke="#47617d" stroke-width="2" /><ns0:path d="M 272.54376748560185,161.33505762401978 L 265,167 L 273.3977788990662,171.29852411443727" fill="none" stroke="#47617d" stroke-width="2" /><ns0:line x1="785" y1="140" x2="735" y2="167" stroke="#47617d" stroke-width="2" /><ns0:path d="M 739.6634986075832,158.79928169383496 L 735,167 L 744.414987754932,167.5983356704069" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="169" width="430" height="64" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="265" y="194" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server vulnerable</ns0:text><ns0:text x="265" y="219" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">MIC válido; omite el control de FCnt</ns0:text><ns0:line x1="265" y1="235" x2="265" y2="261" stroke="#47617d" stroke-width="2" /><ns0:path d="M 260.0,253.0 L 265,261 L 270.0,253.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="263" width="430" height="57" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="265" y="285" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Application Server</ns0:text><ns0:text x="265" y="308" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Descifra → estado temp=25</ns0:text><ns0:rect x="520" y="169" width="430" height="64" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="735" y="194" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server con FCnt</ns0:text><ns0:text x="735" y="219" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">MIC válido; guarda FCnt=4</ns0:text><ns0:line x1="735" y1="235" x2="735" y2="261" stroke="#47617d" stroke-width="2" /><ns0:path d="M 730.0,253.0 L 735,261 L 740.0,253.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="520" y="263" width="430" height="57" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="735" y="285" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Application Server</ns0:text><ns0:text x="735" y="308" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Descifra → estado temp=25</ns0:text><ns0:rect x="30" y="340" width="940" height="245" rx="9" fill="#f6f8fb" stroke="#d1dce7" /><ns0:rect x="50" y="350" width="325" height="44" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="212" y="369" font-size="17" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">t2 · Sensor: trama B</ns0:text><ns0:text x="212" y="387" font-size="15" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">FCnt=5 · contenido cifrado</ns0:text><ns0:line x1="377" y1="372" x2="413" y2="372" stroke="#47617d" stroke-width="2" /><ns0:path d="M 405.0,377.0 L 413,372 L 405.0,367.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="415" y="350" width="535" height="44" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="682" y="369" font-size="17" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Gateway: comprueba CRC físico</ns0:text><ns0:text x="682" y="387" font-size="15" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CRC válido → reenvía el PHYPayload cifrado</ns0:text><ns0:line x1="580" y1="395" x2="265" y2="422" stroke="#47617d" stroke-width="2" /><ns0:path d="M 272.54376748560185,416.3350576240197 L 265,422 L 273.3977788990662,426.29852411443727" fill="none" stroke="#47617d" stroke-width="2" /><ns0:line x1="785" y1="395" x2="735" y2="422" stroke="#47617d" stroke-width="2" /><ns0:path d="M 739.6634986075832,413.799281693835 L 735,422 L 744.414987754932,422.5983356704069" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="424" width="430" height="64" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="265" y="449" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server vulnerable</ns0:text><ns0:text x="265" y="474" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">MIC válido; omite el control de FCnt</ns0:text><ns0:line x1="265" y1="490" x2="265" y2="516" stroke="#47617d" stroke-width="2" /><ns0:path d="M 260.0,508.0 L 265,516 L 270.0,508.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="518" width="430" height="57" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="265" y="540" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Application Server</ns0:text><ns0:text x="265" y="563" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Descifra → estado temp=80</ns0:text><ns0:rect x="520" y="424" width="430" height="64" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="735" y="449" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server con FCnt</ns0:text><ns0:text x="735" y="474" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">MIC válido; guarda FCnt=5</ns0:text><ns0:line x1="735" y1="490" x2="735" y2="516" stroke="#47617d" stroke-width="2" /><ns0:path d="M 730.0,508.0 L 735,516 L 740.0,508.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="520" y="518" width="430" height="57" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="735" y="540" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Application Server</ns0:text><ns0:text x="735" y="563" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Descifra → estado temp=80</ns0:text><ns0:rect x="30" y="595" width="940" height="245" rx="9" fill="#f6f8fb" stroke="#d1dce7" /><ns0:rect x="50" y="605" width="325" height="44" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="212" y="624" font-size="17" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">t3 · Atacante: copia de A</ns0:text><ns0:text x="212" y="642" font-size="15" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">FCnt=4 · contenido cifrado</ns0:text><ns0:line x1="377" y1="627" x2="413" y2="627" stroke="#47617d" stroke-width="2" /><ns0:path d="M 405.0,632.0 L 413,627 L 405.0,622.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="415" y="605" width="535" height="44" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><ns0:text x="682" y="624" font-size="17" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Gateway: comprueba CRC físico</ns0:text><ns0:text x="682" y="642" font-size="15" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CRC válido → reenvía el PHYPayload cifrado</ns0:text><ns0:line x1="580" y1="650" x2="265" y2="677" stroke="#47617d" stroke-width="2" /><ns0:path d="M 272.54376748560185,671.3350576240198 L 265,677 L 273.3977788990662,681.2985241144372" fill="none" stroke="#47617d" stroke-width="2" /><ns0:line x1="785" y1="650" x2="735" y2="677" stroke="#47617d" stroke-width="2" /><ns0:path d="M 739.6634986075832,668.7992816938349 L 735,677 L 744.414987754932,677.5983356704069" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="679" width="430" height="64" rx="9" fill="#fff0ea" stroke="#a0b3d4" /><ns0:text x="265" y="704" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server vulnerable</ns0:text><ns0:text x="265" y="729" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">MIC válido; omite el control de FCnt</ns0:text><ns0:line x1="265" y1="745" x2="265" y2="771" stroke="#47617d" stroke-width="2" /><ns0:path d="M 260.0,763.0 L 265,771 L 270.0,763.0" fill="none" stroke="#47617d" stroke-width="2" /><ns0:rect x="50" y="773" width="430" height="57" rx="9" fill="#fff0ea" stroke="#a0b3d4" /><ns0:text x="265" y="795" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Application Server</ns0:text><ns0:text x="265" y="818" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Descifra → estado temp=25</ns0:text><ns0:rect x="520" y="679" width="430" height="64" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="735" y="704" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Network Server con FCnt</ns0:text><ns0:text x="735" y="729" font-size="16" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">MIC válido; 4 ≤ 5: bloquea el reenvío</ns0:text><ns0:line x1="735" y1="745" x2="735" y2="760" stroke="#b04747" stroke-width="2" /><ns0:path d="M 730,755 l 10,10 m -10,0 l 10,-10" fill="none" stroke="#b04747" stroke-width="2" /><ns0:rect x="520" y="773" width="430" height="57" rx="9" fill="#e5f6ee" stroke="#a0b3d4" /><ns0:text x="735" y="795" font-size="18" fill="#172d45" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Application Server</ns0:text><ns0:text x="735" y="818" font-size="17" fill="#172d45" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Sin entrega; conserva temp=80</ns0:text><ns0:text x="30" y="874" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">MIC y FCnt: Network Server. Descifrado con AppSKey y lectura: Application Server.</ns0:text><ns0:text x="30" y="904" font-size="18" fill="#172d45" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">El atacante solo guarda y reproduce A; no necesita claves ni modificar los bytes.</ns0:text></ns0:svg>