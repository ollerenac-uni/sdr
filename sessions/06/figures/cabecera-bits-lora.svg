<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="titulo descripcion"><title id="titulo">De 56 bits de índices a los campos de la cabecera LoRa</title><desc id="descripcion">Ocho índices de siete bits pasan por ajuste, reducción y Gray. La matriz de ocho filas de cinco bits se desentrelaza en cinco palabras de ocho bits. La decodificación FEC 4/8 recupera veinte bits: longitud, CR, indicador CRC, bits fijos y comprobación.</desc><rect width="1000" height="690" fill="white" /><text x="30" y="33" font-size="21" fill="#172d45" font-weight="bold" font-family="DejaVu Sans, sans-serif" text-anchor="start">Cabecera observada en la señal: 8 índices × 7 = 56 bits</text><rect x="30" y="52" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="42" y="77" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S1  1011001</text><rect x="272" y="52" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="284" y="77" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S2  0110001</text><rect x="514" y="52" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="526" y="77" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S3  1100001</text><rect x="756" y="52" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="768" y="77" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S4  0000001</text><rect x="30" y="99" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="42" y="124" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S5  1101001</text><rect x="272" y="99" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="284" y="124" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S6  0010001</text><rect x="514" y="99" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="526" y="124" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S7  1100001</text><rect x="756" y="99" width="224" height="37" rx="9" fill="#eef3ff" stroke="#a0b3d4" /><text x="768" y="124" font-size="19" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">S8  1001001</text><rect x="30" y="155" width="950" height="64" rx="9" fill="#f6f8fb" stroke="#a0b3d4" /><text x="50" y="180" font-size="18" fill="#172d45" font-weight="bold" font-family="DejaVu Sans, sans-serif" text-anchor="start">Ajustar el índice, reducir el primer bloque y aplicar Gray</text><text x="50" y="204" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="start">u = ((índice − 1) mod 128) // 4;     g = u XOR (u &gt;&gt; 1)</text><text x="30" y="254" font-size="19" fill="#172d45" font-weight="bold" font-family="DejaVu Sans, sans-serif" text-anchor="start">8 filas de 5 bits</text><text x="414" y="254" font-size="19" fill="#172d45" font-weight="bold" font-family="DejaVu Sans, sans-serif" text-anchor="start">5 palabras FEC de 8 bits</text><text x="820" y="254" font-size="18" fill="#172d45" font-weight="bold" font-family="DejaVu Sans, sans-serif" text-anchor="start">5 grupos de 4</text><text x="35" y="290" font-size="16" fill="#60748a" font-weight="normal" font-family="DejaVu Sans, sans-serif" text-anchor="start">S1</text><rect x="84" y="272" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="98" y="290" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">1</text><rect x="116" y="272" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="130" y="290" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">1</text><rect x="148" y="272" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="162" y="290" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">1</text><rect x="180" y="272" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="194" y="290" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">0</text><rect x="212" y="272" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="226" y="290" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">1</text><text x="35" y="317" font-size="16" fill="#60748a" font-weight="normal" font-family="DejaVu Sans, sans-serif" text-anchor="start">S2</text><rect x="84" y="299" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="98" y="317" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">0</text><rect x="116" y="299" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="130" y="317" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">1</text><rect x="148" y="299" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="162" y="317" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">0</text><rect x="180" y="299" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="194" y="317" font-size="17" fill="#172d45" font-weight="normal" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">1</text><rect x="212" y="299" width="29" height="24" rx="9" fill="#edf6fc" stroke="#a0b3d4" /><text x="226" 