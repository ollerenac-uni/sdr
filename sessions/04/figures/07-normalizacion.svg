<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">Centrado y normalización</title><desc id="desc">Correspondencia de cuatro valores de entrada y límites por componente.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="425" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">De enteros sin signo a componentes centradas</text><text x="25" y="128" class="small" text-anchor="start">uint8</text><rect x="220" y="90" width="145" height="65" rx="8" class="i"/><text x="292.5" y="118" class="" text-anchor="middle">0</text><rect x="385" y="90" width="145" height="65" rx="8" class="i"/><text x="457.5" y="118" class="" text-anchor="middle">127</text><rect x="550" y="90" width="145" height="65" rx="8" class="i"/><text x="622.5" y="118" class="" text-anchor="middle">128</text><rect x="715" y="90" width="145" height="65" rx="8" class="i"/><text x="787.5" y="118" class="" text-anchor="middle">255</text><text x="25" y="288" class="small" text-anchor="start">float32 normalizado</text><rect x="220" y="250" width="145" height="65" rx="8" class="out"/><text x="292.5" y="278" class="" text-anchor="middle">−1</text><rect x="385" y="250" width="145" height="65" rx="8" class="out"/><text x="457.5" y="278" class="" text-anchor="middle">−0.00392</text><rect x="550" y="250" width="145" height="65" rx="8" class="out"/><text x="622.5" y="278" class="" text-anchor="middle">+0.00392</text><rect x="715" y="250" width="145" height="65" rx="8" class="out"/><text x="787.5" y="278" class="" text-anchor="middle">+1</text><line x1="292" y1="165" x2="292" y2="183" stroke="#43566d"/><path d="M292 223 L292 240" class="arrow"/><line x1="457" y1="165" x2="457" y2="183" stroke="#43566d"/><path d="M457 223 L457 240" class="arrow"/><line x1="622" y1="165" x2="622" y2="183" stroke="#43566d"/><path d="M622 223 L622 240" class="arrow"/><line x1="787" y1="165" x2="787" y2="183" stroke="#43566d"/><path d="M787 223 L787 240" class="arrow"/><text x="450" y="207" class="" text-anchor="middle">Convertir a float32 → restar 127.5 → dividir por 127.5</text><text x="450" y="365" class="small" text-anchor="middle">x = I normalizada + j · Q normalizada; cada componente está entre −1 y +1.</text><text x="450" y="395" class="small" text-anchor="middle">La magnitud de x puede llegar a √2; no se normaliza cada muestra a módulo uno.</text></svg>
