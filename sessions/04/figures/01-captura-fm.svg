<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Captura FM y banda observada</title><desc id="desc">Relación entre nombre de archivo, bytes y frecuencias relativas a 99.1 MHz.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="380" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">Una captura conserva una banda alrededor de la sintonía</text><rect x="35" y="70" width="350" height="100" rx="8" class="box"/><text x="210.0" y="98" class="" text-anchor="middle">fm_99p1MHz_2p4Msps_g30.cu8</text><text x="210.0" y="123" class="" text-anchor="middle">Centro RF: 99.1 MHz</text><text x="210.0" y="148" class="" text-anchor="middle">Tasa: 2.4 M complejos/s</text><path d="M395 120 L470 120" class="arrow"/><rect x="485" y="70" width="365" height="100" rx="8" class="box"/><text x="667.5" y="98" class="small" text-anchor="middle">Archivo: secuencia de bytes I/Q</text><text x="667.5" y="123" class="" text-anchor="middle">2 bytes por muestra compleja</text><text x="667.5" y="148" class="" text-anchor="middle">Flujo de datos: 4.8 MB/s</text><line x1="100" y1="245" x2="800" y2="245" stroke="#43566d" stroke-width="2"/><line x1="100" y1="215" x2="100" y2="257" stroke="#43566d"/><text x="100" y="287" class="" text-anchor="middle">97.9 MHz</text><text x="100" y="315" class="small" text-anchor="middle">−1.2 MHz</text><line x1="450" y1="215" x2="450" y2="257" stroke="#43566d"/><text x="450" y="287" class="" text-anchor="middle">99.1 MHz</text><text x="450" y="315" class="small" text-anchor="middle">0 MHz</text><line x1="800" y1="215" x2="800" y2="257" stroke="#43566d"/><text x="800" y="287" class="" text-anchor="middle">100.3 MHz</text><text x="800" y="315" class="small" text-anchor="middle">+1.2 MHz</text><text x="450" y="210" class="" text-anchor="middle">Banda compleja de 2.4 MHz (esquema)</text><text x="450" y="355" class="small" text-anchor="middle">Frecuencia RF = centro de captura + frecuencia de banda base</text></svg>
