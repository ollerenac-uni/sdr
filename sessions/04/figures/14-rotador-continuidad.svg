<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="title desc"><title id="title">Continuidad de fase entre lotes</title><desc id="desc">Se comparan dos llamadas con fase acumulada y un reinicio incorrecto; se guarda la fase de la siguiente muestra.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.blue{fill:#deebff;stroke:#638dcc}.green{fill:#e1f2e9;stroke:#6d9c81}.bad{fill:#fff0ed;stroke:#c78d81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#arrow)}.axis{stroke:#8a9eb6;stroke-width:1.3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="630" fill="white"/><text x="30" y="42" class="title" text-anchor="start">El lote termina; el giro del oscilador no debe reiniciarse</text><text x="30" y="78" class="small" text-anchor="start">Ejemplo independiente: Δφ = 60° y cuatro muestras por llamada.</text><text x="30" y="130" class="" text-anchor="start">Continuidad correcta</text><rect x="35" y="150" width="95" height="55" rx="8" class="green"/><text x="82.5" y="178" class="" text-anchor="middle">0°</text><rect x="140" y="150" width="95" height="55" rx="8" class="green"/><text x="187.5" y="178" class="" text-anchor="middle">60°</text><rect x="245" y="150" width="95" height="55" rx="8" class="green"/><text x="292.5" y="178" class="" text-anchor="middle">120°</text><rect x="350" y="150" width="95" height="55" rx="8" class="green"/><text x="397.5" y="178" class="" text-anchor="middle">180°</text><rect x="455" y="150" width="95" height="55" rx="8" class="green"/><text x="502.5" y="178" class="" text-anchor="middle">240°</text><rect x="560" y="150" width="95" height="55" rx="8" class="green"/><text x="607.5" y="178" class="" text-anchor="middle">300°</text><rect x="665" y="150" width="95" height="55" rx="8" class="green"/><text x="712.5" y="178" class="" text-anchor="middle">360°</text><rect x="770" y="150" width="95" height="55" rx="8" class="green"/><text x="817.5" y="178" class="" text-anchor="middle">420°</text><path d="M450 135 V220" stroke="#43566d" stroke-dasharray="4 3"/><text x="30" y="280" class="" text-anchor="start">Reinicio incorrecto</text><rect x="35" y="300" width="95" height="55" rx="8" class="bad"/><text x="82.5" y="328" class="" text-anchor="middle">0°</text><rect x="140" y="300" width="95" height="55" rx="8" class="bad"/><text x="187.5" y="328" class="" text-anchor="middle">60°</text><rect x="245" y="300" width="95" height="55" rx="8" class="bad"/><text x="292.5" y="328" class="" text-anchor="middle">120°</text><rect x="350" y="300" width="95" height="55" rx="8" class="bad"/><text x="397.5" y="328" class="" text-anchor="middle">180°</text><rect x="455" y="300" width="95" height="55" rx="8" class="bad"/><text x="502.5" y="328" class="" text-anchor="middle">0°</text><rect x="560" y="300" width="95" height="55" rx="8" class="bad"/><text x="607.5" y="328" class="" text-anchor="middle">60°</text><rect x="665" y="300" width="95" height="55" rx="8" class="bad"/><text x="712.5" y="328" class="" text-anchor="middle">120°</text><rect x="770" y="300" width="95" height="55" rx="8" class="bad"/><text x="817.5" y="328" class="" text-anchor="middle">180°</text><path d="M450 285 V370" stroke="#43566d" stroke-dasharray="4 3"/><text x="240" y="435" class="small" text-anchor="middle">Llamada 1 · índices locales 0, 1, 2, 3</text><text x="660" y="435" class="small" text-anchor="middle">Llamada 2 · índices locales 0, 1, 2, 3</text><rect x="105" y="470" width="690" height="90" rx="8" class="blue"/><text x="450.0" y="498" class="small" text-anchor="middle">Después del primer lote: guardar 240°, no 180°.</text><text x="450.0" y="523" class="small" text-anchor="middle">Tras el segundo: 480° % 360° = 120° para el siguiente lote.</text><text x="450" y="603" class="small" text-anchor="middle">Los límites de los buffers no son límites físicos de la señal.</text></svg>
