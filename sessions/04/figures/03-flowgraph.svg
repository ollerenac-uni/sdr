<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405" role="img" aria-labelledby="title desc"><title id="title">Flowgraph de reproducción y observación</title><desc id="desc">El control de ritmo se sitúa después del conversor y alimenta tres visores complejos.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="405" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">Construcción gradual: leer → convertir → regular → observar</text><rect x="30" y="100" width="180" height="90" rx="8" class="box"/><text x="120.0" y="128" class="" text-anchor="middle">File Source</text><text x="120.0" y="153" class="" text-anchor="middle">Byte</text><text x="120.0" y="178" class="" text-anchor="middle">2 × fs bytes/s</text><path d="M215 145 L250 145" class="arrow"/><rect x="255" y="100" width="205" height="90" rx="8" class="box"/><text x="357.5" y="128" class="" text-anchor="middle">Conversor I/Q</text><text x="357.5" y="153" class="" text-anchor="middle">uint8 → complex64</text><text x="357.5" y="178" class="" text-anchor="middle">2 entradas : 1 salida</text><path d="M465 145 L500 145" class="arrow"/><rect x="505" y="100" width="160" height="90" rx="8" class="box"/><text x="585.0" y="128" class="" text-anchor="middle">Throttle</text><text x="585.0" y="153" class="" text-anchor="middle">Complex</text><text x="585.0" y="178" class="" text-anchor="middle">fs complejos/s</text><path d="M665 145 L690 145 L690 105 L715 105" class="arrow"/><rect x="720" y="75" width="165" height="65" rx="8" class="out"/><text x="802.5" y="103" class="" text-anchor="middle">Time Sink</text><path d="M665 145 L690 145 L690 220 L715 220" class="arrow"/><rect x="720" y="190" width="165" height="65" rx="8" class="out"/><text x="802.5" y="218" class="" text-anchor="middle">Frequency Sink</text><path d="M665 145 L690 145 L690 335 L715 335" class="arrow"/><rect x="720" y="305" width="165" height="65" rx="8" class="out"/><text x="802.5" y="333" class="" text-anchor="middle">Waterfall Sink</text><text x="35" y="300" class="" text-anchor="start">fs = 2.4e6 muestras complejas/s</text><text x="35" y="332" class="small" text-anchor="start">Alternativa: Throttle Byte antes del conversor, a 2 × fs.</text><text x="35" y="364" class="small" text-anchor="start">Un solo Throttle en esta cadena de reproducción.</text></svg>
