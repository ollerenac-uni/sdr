<svg xmlns="http://www.w3.org/2000/svg" width="900" height="395" viewBox="0 0 900 395" role="img" aria-labelledby="title desc"><title id="title">Buffers y extracción de componentes</title><desc id="desc">Un puerto contiene un arreglo de elementos; las posiciones pares e impares conservan tres parejas.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="395" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">work procesa un lote y respeta las parejas</text><rect x="35" y="80" width="380" height="90" rx="8" class="box"/><text x="225.0" y="108" class="" text-anchor="middle">input_items[0] = primer puerto</text><text x="225.0" y="133" class="" text-anchor="middle">[I₀, Q₀, I₁, Q₁, I₂, Q₂]</text><text x="225.0" y="158" class="" text-anchor="middle">[0][0] = I₀; [0][1] = Q₀</text><rect x="485" y="80" width="380" height="90" rx="8" class="out"/><text x="675.0" y="108" class="small" text-anchor="middle">output_items[0] = primer puerto</text><text x="675.0" y="133" class="" text-anchor="middle">Espacio para n = 3 complejos</text><text x="675.0" y="158" class="" text-anchor="middle">Se necesitan 2 × n = 6 bytes</text><path d="M425 125 L475 125" class="arrow"/><rect x="65" y="220" width="330" height="85" rx="8" class="i"/><text x="230.0" y="248" class="" text-anchor="middle">datos[0::2] → I₀, I₁, I₂</text><text x="230.0" y="273" class="" text-anchor="middle">astype(float32)</text><rect x="505" y="220" width="330" height="85" rx="8" class="q"/><text x="670.0" y="248" class="" text-anchor="middle">datos[1::2] → Q₀, Q₁, Q₂</text><text x="670.0" y="273" class="" text-anchor="middle">astype(float32)</text><text x="450" y="365" class="" text-anchor="middle">return n → se producen n complejos y se consumen 2n bytes</text></svg>
