<svg xmlns="http://www.w3.org/2000/svg" width="900" height="575" viewBox="0 0 900 575" role="img" aria-labelledby="title desc"><title id="title">Flujo de datos y estado del rotador</title><desc id="desc">El oscilador multiplica las muestras y actualiza un atributo que se conserva entre llamadas a work.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.blue{fill:#deebff;stroke:#638dcc}.green{fill:#e1f2e9;stroke:#6d9c81}.bad{fill:#fff0ed;stroke:#c78d81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#arrow)}.axis{stroke:#8a9eb6;stroke-width:1.3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="575" fill="white"/><text x="30" y="42" class="title" text-anchor="start">Dos caminos: los datos pasan; la fase queda guardada</text><rect x="30" y="95" width="220" height="90" rx="8" class="box"/><text x="140.0" y="123" class="" text-anchor="middle">Lote x[0:N]</text><text x="140.0" y="148" class="" text-anchor="middle">np.complex64</text><text x="140.0" y="173" class="" text-anchor="middle">N entradas</text><path d="M260 140 L330 140" class="arrow"/><rect x="340" y="95" width="225" height="90" rx="8" class="box"/><text x="452.5" y="123" class="" text-anchor="middle">Multiplicación</text><text x="452.5" y="148" class="" text-anchor="middle">x · exp(j · fases)</text><path d="M575 140 L645 140" class="arrow"/><rect x="655" y="95" width="215" height="90" rx="8" class="green"/><text x="762.5" y="123" class="" text-anchor="middle">Lote y[0:N]</text><text x="762.5" y="148" class="" text-anchor="middle">np.complex64</text><text x="762.5" y="173" class="" text-anchor="middle">N salidas</text><rect x="35" y="260" width="250" height="90" rx="8" class="blue"/><text x="160.0" y="288" class="" text-anchor="middle">Estado previo</text><text x="160.0" y="313" class="" text-anchor="middle">self.fase = φ₀</text><path d="M295 305 L340 305" class="arrow"/><rect x="350" y="250" width="310" height="110" rx="8" class="box"/><text x="505.0" y="278" class="" text-anchor="middle">Índices = 0, 1, …, N−1</text><text x="505.0" y="303" class="" text-anchor="middle">fases = φ₀ + Δφ · índices</text><text x="505.0" y="328" class="" text-anchor="middle">Un ángulo por muestra</text><path d="M500 240 L500 195" class="arrow"/><rect x="355" y="415" width="420" height="90" rx="8" class="blue"/><text x="565.0" y="443" class="" text-anchor="middle">Fase de la próxima muestra</text><text x="565.0" y="468" class="small" text-anchor="middle">self.fase = (φ₀ + N · Δφ) % (2π)</text><path d="M665 305 H825 V460 H785" class="arrow"/><path d="M345 460 H155 V360" class="arrow"/><text x="155" y="403" class="small" text-anchor="middle">Próxima llamada</text><text x="450" y="550" class="small" text-anchor="middle">sync_block: producir N complejos implica consumir N complejos.</text></svg>
