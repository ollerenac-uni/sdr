<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Configuración de terminal</title><desc id="desc">Se separa el aviso de terminal de los problemas de lectura de archivos de muestras.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.i{fill:#deebff;stroke:#638dcc}.q{fill:#ffead7;stroke:#ca8c56}.out{fill:#e1f2e9;stroke:#6d9c81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="320" fill="#fff"/><text x="30" y="40" class="title" text-anchor="start">El aviso de terminal pertenece a la ejecución, no al formato I/Q</text><rect x="45" y="100" width="310" height="100" rx="8" class="box"/><text x="200.0" y="128" class="" text-anchor="middle">GRC busca una terminal</text><text x="200.0" y="153" class="" text-anchor="middle">x-terminal-emulator</text><text x="200.0" y="178" class="" text-anchor="middle">Ruta relativa configurada</text><path d="M365 150 L435 150" class="arrow"/><rect x="445" y="100" width="410" height="100" rx="8" class="out"/><text x="650.0" y="128" class="" text-anchor="middle">[grc] en config.conf</text><text x="650.0" y="153" class="" text-anchor="middle">xterm_executable =</text><text x="650.0" y="178" class="" text-anchor="middle">/usr/bin/x-terminal-emulator</text><text x="450" y="275" class="small" text-anchor="middle">Usar una ruta existente y reiniciar GRC; después revisar cualquier error de ejecución.</text></svg>
