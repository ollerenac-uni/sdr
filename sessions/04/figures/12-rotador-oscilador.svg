<svg xmlns="http://www.w3.org/2000/svg" width="900" height="495" viewBox="0 0 900 495" role="img" aria-labelledby="title desc"><title id="title">Oscilador complejo y giro por muestra</title><desc id="desc">Cuatro fases sobre un círculo unitario y ejemplo de avance de noventa grados por muestra.</desc><style>text{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#182537}.title{font-size:24px;font-weight:bold}.small{font-size:16px}.box{fill:#edf3fb;stroke:#8a9eb6;stroke-width:1.5}.blue{fill:#deebff;stroke:#638dcc}.green{fill:#e1f2e9;stroke:#6d9c81}.bad{fill:#fff0ed;stroke:#c78d81}.arrow{stroke:#43566d;stroke-width:2;fill:none;marker-end:url(#arrow)}.axis{stroke:#8a9eb6;stroke-width:1.3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#43566d"/></marker></defs><rect width="900" height="495" fill="white"/><text x="30" y="42" class="title" text-anchor="start">Frecuencia de mezcla = giro adicional por cada muestra</text><circle cx="220" cy="215" r="95" fill="none" stroke="#a7b5c8"/><path d="M85 215 H355 M220 85 V345" class="axis"/><circle cx="315.0" cy="215.0" r="5" fill="#255dc4"/><text x="340.0" y="221.0" class="small" text-anchor="start">1 · 0°</text><circle cx="220.0" cy="120.0" r="5" fill="#255dc4"/><text x="220.0" y="100.0" class="small" text-anchor="middle">j · 90°</text><circle cx="125.0" cy="215.0" r="5" fill="#255dc4"/><text x="105.0" y="221.0" class="small" text-anchor="end">−1 · 180°</text><circle cx="219.99999999999997" cy="310.0" r="5" fill="#255dc4"/><text x="219.99999999999997" y="338.0" class="small" text-anchor="middle">−j · 270°</text><path d="M220 215 L310 215" class="arrow"/><path d="M329 215 A109 109 0 0 0 220 106" class="arrow"/><rect x="440" y="100" width="410" height="115" rx="8" class="box"/><text x="645.0" y="128" class="small" text-anchor="middle">fs = 2.4 millones de muestras/s</text><text x="645.0" y="153" class="" text-anchor="middle">fmezcla = +600 000 vueltas/s</text><text x="645.0" y="178" class="" text-anchor="middle">Δφ = 2π · fmezcla / fs = π/2</text><rect x="440" y="245" width="410" height="95" rx="8" class="green"/><text x="645.0" y="273" class="small" text-anchor="middle">Oscilador: p[n] = exp(j · φ[n])</text><text x="645.0" y="298" class="" text-anchor="middle">Salida: y[n] = x[n] · p[n]</text><text x="35" y="402" class="small" text-anchor="start">Índice global n</text><rect x="170" y="372" width="122" height="58" rx="8" class="blue"/><text x="231.0" y="400" class="" text-anchor="middle">0 → 1</text><rect x="307" y="372" width="122" height="58" rx="8" class="blue"/><text x="368.0" y="400" class="" text-anchor="middle">1 → j</text><rect x="444" y="372" width="122" height="58" rx="8" class="blue"/><text x="505.0" y="400" class="" text-anchor="middle">2 → −1</text><rect x="581" y="372" width="122" height="58" rx="8" class="blue"/><text x="642.0" y="400" class="" text-anchor="middle">3 → −j</text><rect x="718" y="372" width="122" height="58" rx="8" class="blue"/><text x="779.0" y="400" class="" text-anchor="middle">4 → 1</text><text x="450" y="470" class="small" text-anchor="middle">Una vuelta completa no cambia el fasor: exp(j · 2π) = 1.</text></svg>
