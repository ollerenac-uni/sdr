<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img"><title>ADS-B: el avión transmite y la estación muestra sus datos</title><rect width="1120" height="770" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">ADS-B: el avión transmite y la estación muestra sus datos</text><text x="30" y="72" font-size="18" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">1090ES · Difusión automática por radio · Esquema conceptual, sin escala</text><defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#edf6ff" /><stop offset="100%" stop-color="#ffffff" /></linearGradient></defs><rect x="20" y="92" width="1080" height="487" rx="16" fill="url(#cielo)" /><path d="M 20,550 Q 180,515 340,549 T 660,548 L 695,579 L 20,579 Z" fill="#e1ede7" /><path d="M 108,227 L 235,227 L 180,165 L 207,165 L 285,227 L 336,227 Q 360,229 378,241 Q 360,253 336,255 L 285,255 L 207,316 L 180,316 L 235,255 L 137,255 L 110,276 L 87,276 L 105,241 L 87,205 L 110,205 L 137,227 Z" fill="#e7edf4" stroke="#45667f" stroke-width="2.5" stroke-linejoin="round" /><path d="M 330,230 L 347,233 L 355,241 L 334,241 Z" fill="#3f6e8d" /><line x1="151" y1="241" x2="314" y2="241" stroke="#93a9ba" stroke-width="2" /><rect x="55" y="108" width="326" height="55" rx="8" fill="#ffffff" stroke="#a9bccf" /><text x="72" y="132" font-size="19" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Datos calculados a bordo</text><text x="72" y="151" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Posición GNSS · altitud · velocidad</text><text x="70" y="355" font-size="22" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Aeronave con ADS-B Out</text><text x="70" y="385" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Transmite sin una interrogación previa</text><text x="70" y="411" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">del receptor en tierra.</text><path d="M 396,217 Q 424,241 396,265" fill="none" stroke="#2e927c" stroke-width="4" stroke-linecap="round" /><path d="M 421,201 Q 467,241 421,281" fill="none" stroke="#2e927c" stroke-width="4" stroke-linecap="round" /><path d="M 451,185 Q 515,241 451,297" fill="none" stroke="#2e927c" stroke-width="4" stroke-linecap="round" /><text x="401" y="160" font-size="20" fill="#267968" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">1090 MHz</text><line x1="578" y1="221" x2="578" y2="284" stroke="#45667f" stroke-width="4" /><circle cx="578" cy="219" r="6" fill="#2e927c" /><path d="M 564,210 Q 551,222 564,234 M 592,210 Q 605,222 592,234" fill="none" stroke="#2e927c" stroke-width="3" /><path d="M 512,286 L 644,286 L 630,330 L 526,330 Z" fill="#a8c8df" stroke="#45667f" stroke-width="2" /><line x1="542" y1="289" x2="542" y2="327" stroke="#45667f" stroke-width="2" /><line x1="578" y1="289" x2="578" y2="327" stroke="#45667f" stroke-width="2" /><line x1="614" y1="289" x2="614" y2="327" stroke="#45667f" stroke-width="2" /><rect x="550" y="330" width="57" height="206" fill="#d2e0ea" stroke="#45667f" stroke-width="2" /><rect x="569" y="363" width="18" height="26" rx="2" fill="#82a9c4" /><rect x="569" y="411" width="18" height="26" rx="2" fill="#82a9c4" /><rect x="569" y="459" width="18" height="26" rx="2" fill="#82a9c4" /><rect x="514" y="536" width="130" height="15" rx="3" fill="#66859c" /><text x="578" y="185" font-size="18" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Antena receptora</text><path d="M 625,360 L 681,360" fill="none" stroke="#426a8b" stroke-width="3" /><path d="M 672,352 L 681,360 L 672,368" fill="none" stroke="#426a8b" stroke-width="3" /><text x="578" y="572" font-size="19" fill="#17314a" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Estación en tierra</text><rect x="702" y="110" width="380" height="424" rx="15" fill="#17314a" /><rect x="716" y="154" width="352" height="365" rx="5" fill="#ffffff" /><text x="892" y="139" font-size="19" fill="white" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Visualización del tráfico aéreo</text><rect x="728" y="165" width="328" height="128" rx="5" fill="#eaf4f7" /><path d="M 731,208 L 792,176 L 851,205 L 840,250 L 785,283 L 741,258 Z M 908,169 L 984,188 L 1039,238 L 1002,286 L 936,264 Z" fill="#d2e4d5" /><line x1="780" y1="166" x2="780" y2="292" stroke="#cadde8" stroke-width="1" /><line x1="834" y1="166" x2="834" y2="292" stroke="#cadde8" stroke-width="1" /><line x1="888" y1="166" x2="888" y2="292" stroke="#cadde8" stroke-width="1" /><line x1="942" y1="166" x2="942" y2="292" stroke="#cadde8" stroke-width="1" /><line x1="996" y1="166" x2="996" y2="292" stroke="#cadde8" stroke-width="1" /><line x1="729" y1="195" x2="1056" y2="195" stroke="#cadde8" stroke-width="1" /><line x1="729" y1="229" x2="1056" y2="229" stroke="#cadde8" stroke-width="1" /><line x1="729" y1="263" x2="1056" y2="263" stroke="#cadde8" stroke-width="1" /><path d="M 815,214 L 842,228 L 867,238 L 885,245" fill="none" stroke="#328c78" stroke-width="2" stroke-dasharray="5 4" /><circle cx="885" cy="245" r="8" fill="#dc8a32" stroke="white" stroke-width="3" /><text x="902" y="243" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">4402F2</text><text x="902" y="264" font-size="12" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Mapa esquemático</text><text x="736" y="321" font-size="16" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">ICAO</text><text x="1049" y="321" font-size="18" fill="#17314a" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">4402F2</text><text x="736" y="354" font-size="16" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Indicativo</text><text x="1049" y="354" font-size="18" fill="#17314a" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">EJU46DN</text><text x="736" y="387" font-size="16" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Latitud</text><text x="1049" y="387" font-size="18" fill="#17314a" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">51.654968°</text><text x="736" y="420" font-size="16" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Longitud</text><text x="1049" y="420" font-size="18" fill="#17314a" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">-0.949554°</text><text x="736" y="453" font-size="16" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Altitud barométrica</text><text x="1049" y="453" font-size="18" fill="#17314a" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">36 250 ft</text><text x="736" y="486" font-size="16" fill="#526b81" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Velocidad TC19</text><text x="1049" y="486" font-size="18" fill="#17314a" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">509.8 kt</text><rect x="862" y="534" width="59" height="19" fill="#45667f" /><rect x="811" y="552" width="160" height="10" rx="4" fill="#45667f" /><rect x="25" y="598" width="345" height="105" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="39" y="628" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">1. TRANSMITIR</text><text x="39" y="657" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">El avión difunde mensajes</text><text x="39" y="682" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">de distintos tipos por radio.</text><rect x="390" y="598" width="345" height="105" rx="8" fill="#eadff9" stroke="#a9bccf" /><text x="404" y="628" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">2. RECIBIR Y DECODIFICAR</text><text x="404" y="657" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">La estación recupera bits,</text><text x="404" y="682" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">comprueba CRC y lee campos.</text><rect x="755" y="598" width="345" height="105" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="769" y="628" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">3. ASOCIAR Y REPRESENTAR</text><text x="769" y="657" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">El software reúne mensajes</text><text x="769" y="682" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">con la misma dirección ICAO.</text><text x="30" y="736" font-size="18" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">La pantalla reúne varios mensajes de la captura de 2021; no todos los campos viajan en una sola trama.</text></svg>