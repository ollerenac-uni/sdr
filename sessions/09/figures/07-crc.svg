<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img"><title>CRC: comprobar los campos recibidos sin corregir los bits</title><rect width="1120" height="390" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">CRC: comprobar los campos recibidos sin corregir los bits</text><rect x="30" y="80" width="690" height="70" rx="8" fill="#fff0d4" stroke="#a9bccf" /><rect x="750" y="80" width="335" height="70" rx="8" fill="#f9dfe5" stroke="#a9bccf" /><text x="50" y="108" font-size="22" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Bits 1–88: DF, CA, ICAO y ME</text><text x="50" y="137" font-size="23" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">8d4402f258b9f270bbcdb6</text><text x="770" y="108" font-size="21" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Bits 89–112: CRC RX</text><text x="770" y="137" font-size="23" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2b2397</text><text x="30" y="196" font-size="23" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">88 bits + 24 ceros → división XOR por 0x1FFF409</text><line x1="640" y1="188" x2="755" y2="188" stroke="#47617d" stroke-width="2" /><path d="M747,182 L755,188 L747,194" fill="none" stroke="#47617d" stroke-width="2" /><text x="778" y="196" font-size="23" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2b2397 = CRC RX</text><text x="30" y="246" font-size="23" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">También: dividir los 112 bits recibidos → resto 0x000000 → aceptar.</text><text x="30" y="292" font-size="22" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Cambiar el bit 41 → resto 0x91C77F → rechazar esta trama alterada.</text><text x="30" y="346" font-size="21" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">El CRC comprueba errores; no prueba quién transmitió ni cifra el mensaje.</text></svg>