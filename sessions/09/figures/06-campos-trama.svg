<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img"><title>Segmentar la trama: campos generales y contenido ME de posición</title><rect width="1120" height="690" fill="white" /><text x="30" y="37" font-size="24" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Segmentar la trama: campos generales y contenido ME de posición</text><text x="30" y="75" font-size="26" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">8D4402F258B9F270BBCDB62B2397</text><rect x="30" y="101" width="47.0" height="56" rx="8" fill="#dceafa" stroke="#a9bccf" /><text x="53.5" y="135" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">DF</text><rect x="77.0" y="101" width="28.200000000000003" height="56" rx="8" fill="#eadff9" stroke="#a9bccf" /><text x="91.1" y="135" font-size="14" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CA</text><rect x="105.2" y="101" width="225.60000000000002" height="56" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="218.0" y="135" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">ICAO</text><rect x="330.8" y="101" width="526.4" height="56" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="594.0" y="135" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">ME</text><rect x="857.2" y="101" width="225.60000000000002" height="56" rx="8" fill="#f9dfe5" stroke="#a9bccf" /><text x="970.0" y="135" font-size="20" fill="#17314a" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">CRC</text><text x="30" y="191" font-size="23" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">DF 5 + CA 3 + ICAO 24 + ME 56 + CRC 24 = 112 bits</text><text x="30" y="230" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">ME ocupa los bits 33–88. Su Type Code determina cómo leer el resto.</text><rect x="30" y="255" width="255" height="108" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="42" y="280" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">TC · bits 33–37</text><text x="42" y="310" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">01011</text><text x="42" y="339" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 11</text><rect x="305" y="255" width="255" height="108" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="317" y="280" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">SS · bits 38–39</text><text x="317" y="310" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">00</text><text x="317" y="339" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 0</text><rect x="580" y="255" width="255" height="108" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="592" y="280" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">SAF/NICsb · bits 40–40</text><text x="592" y="310" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0</text><text x="592" y="339" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 0</text><rect x="855" y="255" width="255" height="108" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="867" y="280" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">ALT · bits 41–52</text><text x="867" y="310" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">101110011111</text><text x="867" y="339" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 2975</text><rect x="30" y="383" width="255" height="108" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="42" y="408" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">T · bits 53–53</text><text x="42" y="438" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0</text><text x="42" y="467" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 0</text><rect x="305" y="383" width="255" height="108" rx="8" fill="#fff0d4" stroke="#a9bccf" /><text x="317" y="408" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">F · bits 54–54</text><text x="317" y="438" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0</text><text x="317" y="467" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 0</text><rect x="580" y="383" width="255" height="108" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="592" y="408" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">LAT-CPR · bits 55–71</text><text x="592" y="438" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">10011100001011101</text><text x="592" y="467" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 79965</text><rect x="855" y="383" width="255" height="108" rx="8" fill="#d9f1e7" stroke="#a9bccf" /><text x="867" y="408" font-size="17" fill="#17314a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">LON-CPR · bits 72–88</text><text x="867" y="438" font-size="16" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">11100110110110110</text><text x="867" y="467" font-size="17" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Valor entero: 118198</text><text x="30" y="545" font-size="20" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">F=0: mensaje par. LAT-CPR y LON-CPR son fracciones codificadas, no grados.</text><text x="30" y="583" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">ALT → Q=1 → quitar Q → N=1487 → 25×1487 − 1000 = 36175 ft.</text><text x="30" y="621" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">TC=11 selecciona posición aérea con altitud barométrica; no contiene el indicativo.</text><text x="30" y="659" font-size="19" fill="#17314a" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Los mensajes de identificación y velocidad se asocian por el mismo ICAO.</text></svg>