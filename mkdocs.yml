site_name: Radio Definida por Software
site_url: https://ollerenac.github.io/sdr/
site_description: Curso de pregrado en radio definida por software (SDR) — señales IQ, GNU Radio, modulación y sistemas reales
site_author: ollerenac
repo_url: https://github.com/ollerenac/sdr
repo_name: ollerenac/sdr

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.breadcrumbs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

extra:
  status:
    draft: En desarrollo

plugins:
  - search:
      lang: es

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Sesiones:
      - sessions/index.md
      # Añadir sesiones aquí, p. ej.:
      # - "01 — Introducción a SDR": sessions/01-introduccion-sdr/index.md
  - Exámenes:
      - exams/index.md
