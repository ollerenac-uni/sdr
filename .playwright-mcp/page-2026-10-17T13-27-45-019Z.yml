          - heading "Laboratorio de lectura y explicación" [level=2] [ref=e1871]
          - paragraph [ref=e1872]: Este recorrido se utiliza junto con la guía de construcción.
          - list [ref=e1873]:
            - listitem [ref=e1874]: El estudiante selecciona un paso y localiza sus bloques resaltados.
            - listitem [ref=e1875]: Describe la representación de entrada y la de salida antes de ejecutar.
            - listitem [ref=e1876]: Predice qué cambiará y elige el observador que permitirá comprobarlo.
            - listitem [ref=e1877]: Ejecuta el experimento de la guía y registra también los fallos.
            - listitem [ref=e1878]: Compara el resultado con la predicción y explica qué función lo produce.
            - listitem [ref=e1879]: Propone una comprobación adicional que mantenga las demás variables fijas.
          - paragraph [ref=e1880]: Para los pasos 18–24, la explicación incluye condiciones del canal, secuencia de mensajes y contadores. La constelación por sí sola no sustituye esos datos.
          - paragraph [ref=e1881]: La fila de −10 Hz y la de −1000 ppm permanecen como actividades del alumno. Las capturas manuales del paso 24 se incorporarán después. La integración BPSK no certifica todavía QPSK, hardware ni canales con variaciones arbitrarias.
