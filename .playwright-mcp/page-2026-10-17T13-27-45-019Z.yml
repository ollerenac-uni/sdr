          - heading "Tres tamaños distintos para Hola" [level=3] [ref=e808]
          - paragraph [ref=e809]:
            - text: CRC significa
            - emphasis [ref=e810]: Cyclic Redundancy Check
            - text: ", comprobación cíclica de redundancia. El CRC permite detectar alteraciones; no corrige bits."
          - table [ref=e813]:
            - rowgroup [ref=e814]:
              - row [ref=e815]:
                - columnheader "Momento de la construcción" [ref=e816]
                - columnheader "Contenido transmitido antes del mapeo" [ref=e817]
                - columnheader "Tamaño" [ref=e818]
            - rowgroup [ref=e819]:
              - row [ref=e820]:
                - cell "Pasos 7–15" [ref=e821]
                - cell "Longitud interna + texto UTF-8 + CRC." [ref=e822]
                - cell "10 bytes." [ref=e823]
              - row [ref=e824]:
                - cell "Pasos 16–23" [ref=e825]
                - cell "Acceso + longitud externa duplicada + paquete protegido." [ref=e826]
                - cell "22 bytes." [ref=e827]
              - row [ref=e828]:
                - cell "Paso 24" [ref=e829]
                - cell "Preámbulo + acceso + longitud externa duplicada + paquete protegido." [ref=e830]
                - cell "54 bytes." [ref=e831]
          - paragraph [ref=e832]:
            - text: La longitud interna de
            - code [ref=e833]: Hola
            - text: siempre indica cuatro bytes de texto. Cada copia de la longitud externa indica diez bytes de paquete protegido. Los ceros de cierre de los filtros no pertenecen a ninguno de esos campos.
          - paragraph [ref=e834]: El formato admite hasta 500 palabras y 5000 bytes UTF-8 de texto, sin recortar mensajes que excedan los límites.
          - heading "Recorrido de aprendizaje" [level=2] [ref=e835]
          - table [ref=e838]:
            - rowgroup [ref=e839]:
              - row [ref=e840]:
                - columnheader "Tramo" [ref=e841]
