                - columnheader "Punto de llegada" [ref=e843]
            - rowgroup [ref=e844]:
              - row [ref=e845]:
                - cell [ref=e846]:
                  - link "Pasos 1–10" [ref=e847] [cursor=pointer]:
                    - /url: "#paso-1"
                - cell "¿Cómo se representa y comprueba el mensaje?" [ref=e848]
                - cell "Datos preparados, todavía sin señal temporal." [ref=e849]
              - row [ref=e850]:
                - cell [ref=e851]:
                  - link "Pasos 11–15" [ref=e852] [cursor=pointer]:
                    - /url: "#paso-11"
                - cell "¿Cómo pasan los bits por una señal?" [ref=e853]
                - cell "Recuperación con referencias ideales." [ref=e854]
              - row [ref=e855]:
                - cell [ref=e856]:
                  - link "Pasos 16–17" [ref=e857] [cursor=pointer]:
                    - /url: "#paso-16"
                - cell "¿Cómo encuentra RX el paquete?" [ref=e858]
                - cell "Detección desde bits y recepción sin etiquetas de TX." [ref=e859]
              - row [ref=e860]:
                - cell [ref=e861]:
                  - link "Pasos 18–23" [ref=e862] [cursor=pointer]:
                    - /url: "#paso-18"
                - cell "¿Qué ocurre al perturbar la señal?" [ref=e863]
                - cell "Comparación de controles y recuperación de portadora y tiempo." [ref=e864]
              - row [ref=e865]:
                - cell [ref=e866]:
                  - link "Paso 24" [ref=e867] [cursor=pointer]:
                    - /url: "#paso-24"
                - cell "¿La cadena integrada recupera el primer envío?" [ref=e868]
                - cell "Adquisición previa al acceso y comprobación conjunta." [ref=e869]
          - paragraph [ref=e870]: El orden de enseñanza incorpora primero casos fáciles de comprobar. El orden físico de los bloques responde al procesamiento de la señal. Por ejemplo, el mapa final sitúa Symbol Sync antes de Costas, aunque Costas se estudia antes.
          - heading "Paso 1 — Preparar el entorno de la simulación" [level=2] [ref=e871]
          - paragraph [ref=e872]:
            - strong [ref=e873]: "Pregunta guía:"
            - text: ¿Qué prepara el programa antes de que exista una señal?
          - paragraph [ref=e874]: Options define cómo se genera y ejecuta el programa. La interfaz Qt permite introducir mensajes y observar resultados.
          - paragraph [ref=e875]:
            - img "Mapa funcional del enlace BPSK con E · Entorno resaltado para el paso 1." [ref=e876]
            - strong [ref=e877]: Figura 1.
            - text: El foco del paso 1 corresponde a E · Entorno.
          - list [ref=e878]:
            - listitem [ref=e879]:
              - strong [ref=e880]: "Fila TX:"
              - text: La cadena de datos sirve de contexto. En este paso solo se prepara el programa.
            - listitem [ref=e881]:
              - strong [ref=e882]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e883]:
              - strong [ref=e884]: "Fila RX:"
              - text: El receptor del mapa todavía no forma parte del ensayo.
            - listitem [ref=e885]:
              - strong [ref=e886]: "Fila de entorno y observación:"
              - text: E identifica las opciones y el entorno Qt; no transporta el mensaje.
          - paragraph [ref=e887]:
            - link "Ampliar el mapa" [ref=e888] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-01.png
            - text: .
          - paragraph [ref=e889]:
            - strong [ref=e890]: "Entrada y salida del ensayo:"
            - text: Configuración del flowgraph → programa ejecutable con interfaz Qt.
          - list [ref=e891]:
            - listitem [ref=e892]:
              - strong [ref=e893]: "Qué cambia:"
              - text: Se crea y guarda el archivo; se configuran sus opciones.
            - listitem [ref=e894]:
              - strong [ref=e895]: "Qué permanece fijo:"
              - text: Todavía no existe una cadena de transmisión ni un canal.
            - listitem [ref=e896]:
              - strong [ref=e897]: "Qué se observa:"
              - text: La aplicación puede abrirse y cerrarse sin errores.
          - paragraph [ref=e898]:
            - strong [ref=e899]: "Comprobación e interpretación:"
            - text: Guardar el archivo no equivale a transmitir. La extensión .grc identifica el diagrama; el ID identifica la clase del programa generado.
          - paragraph [ref=e900]:
            - strong [ref=e901]: "Error que debe evitarse:"
            - text: Un canvas vacío que ejecuta correctamente solo comprueba el entorno.
          - paragraph [ref=e902]:
            - link "Montaje y procedimiento del paso 1" [ref=e903] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#1-preparar-end-to-endgrc
            - text: .
          - heading "Paso 2 — Definir la entrada de texto" [level=2] [ref=e904]
          - paragraph [ref=e905]:
            - strong [ref=e906]: "Pregunta guía:"
            - text: ¿Por dónde entra la información del usuario?
          - paragraph [ref=e907]: QT GUI Message Edit Box recibe texto y publica un mensaje al confirmarlo. Su puerto pertenece al dominio de mensajes.
          - paragraph [ref=e908]:
            - img "Mapa funcional del enlace BPSK con T1 · Texto resaltado para el paso 2." [ref=e909]
            - strong [ref=e910]: Figura 2.
            - text: El foco del paso 2 corresponde a T1 · Texto.
          - list [ref=e911]:
            - listitem [ref=e912]:
              - strong [ref=e913]: "Fila TX:"
              - text: Solo se estudia la entrada de texto. La conversión UTF-8 de T1 se incorpora en el paso 5.
            - listitem [ref=e914]:
              - strong [ref=e915]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e916]:
              - strong [ref=e917]: "Fila RX:"
              - text: El receptor del mapa todavía no forma parte del ensayo.
            - listitem [ref=e918]:
              - strong [ref=e919]: "Fila de entorno y observación:"
              - text: E organiza la interfaz; la publicación de mensajes se comprueba después.
          - paragraph [ref=e920]:
            - link "Ampliar el mapa" [ref=e921] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-02.png
            - text: .
          - paragraph [ref=e922]:
            - strong [ref=e923]: "Entrada y salida del ensayo:"
            - text: Texto escrito → mensaje interno de GNU Radio.
          - list [ref=e924]:
            - listitem [ref=e925]:
              - strong [ref=e926]: "Qué cambia:"
              - text: Se añade el cuadro de texto.
            - listitem [ref=e927]:
              - strong [ref=e928]: "Qué permanece fijo:"
              - text: No hay bytes de paquete, símbolos BPSK ni muestras.
            - listitem [ref=e929]:
              - strong [ref=e930]: "Qué se observa:"
              - text: El cuadro admite Hola y reconoce la confirmación con Enter.
          - paragraph [ref=e931]:
            - strong [ref=e932]: "Comprobación e interpretación:"
            - text: El puerto de mensajes no representa una entrada de muestras complejas. Los adaptadores posteriores conectarán ambos dominios.
          - paragraph [ref=e933]:
            - strong [ref=e934]: "Error que debe evitarse:"
            - text: Escribir una palabra sin confirmarla no demuestra que el bloque haya publicado el mensaje.
          - paragraph [ref=e935]:
            - link "Montaje y procedimiento del paso 2" [ref=e936] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#2-primer-bloque-qt-gui-message-edit-box
            - text: .
          - heading "Paso 3 — Comprobar la interfaz antes de continuar" [level=2] [ref=e937]
          - paragraph [ref=e938]:
            - strong [ref=e939]: "Pregunta guía:"
            - text: ¿Qué confirma esta primera prueba y qué queda sin comprobar?
          - paragraph [ref=e940]: Una prueba pequeña permite revisar la entrada sin mezclar errores de interfaz, formato y procesamiento de señal.
          - paragraph [ref=e941]:
            - img "Mapa funcional del enlace BPSK con T1 · Texto, E · Entorno resaltado para el paso 3." [ref=e942]
            - strong [ref=e943]: Figura 3.
            - text: El foco del paso 3 corresponde a T1 · Texto, E · Entorno.
          - list [ref=e944]:
            - listitem [ref=e945]:
              - strong [ref=e946]: "Fila TX:"
              - text: Solo se estudia la entrada de texto. La conversión UTF-8 de T1 se incorpora en el paso 5.
            - listitem [ref=e947]:
              - strong [ref=e948]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e949]:
              - strong [ref=e950]: "Fila RX:"
              - text: El receptor del mapa todavía no forma parte del ensayo.
            - listitem [ref=e951]:
              - strong [ref=e952]: "Fila de entorno y observación:"
              - text: E representa la comprobación de apertura, entrada y cierre de la ventana.
          - paragraph [ref=e953]:
            - link "Ampliar el mapa" [ref=e954] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-03.png
            - text: .
          - paragraph [ref=e955]:
            - strong [ref=e956]: "Entrada y salida del ensayo:"
            - text: Interacción del usuario → evento de publicación del cuadro de texto.
          - list [ref=e957]:
            - listitem [ref=e958]:
              - strong [ref=e959]: "Qué cambia:"
              - text: Se ejecuta la interfaz y se introduce el primer mensaje.
            - listitem [ref=e960]:
              - strong [ref=e961]: "Qué permanece fijo:"
              - text: Se conserva el cuadro del paso 2; todavía no hay un receptor.
            - listitem [ref=e962]:
              - strong [ref=e963]: "Qué se observa:"
              - text: La ventana aparece y responde a las acciones previstas.
          - paragraph [ref=e964]:
            - strong [ref=e965]: "Comprobación e interpretación:"
            - text: La evidencia visible solo confirma la interfaz. El paso 4 añadirá un observador de la salida.
          - paragraph [ref=e966]:
            - strong [ref=e967]: "Error que debe evitarse:"
            - text: Una ventana abierta no prueba que otro bloque haya recibido Hola.
          - paragraph [ref=e968]:
            - link "Montaje y procedimiento del paso 3" [ref=e969] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#3-comprobar-el-primer-bloque
            - text: .
          - heading "Paso 4 — Observar mensajes con Message Debug" [level=2] [ref=e970]
          - paragraph [ref=e971]:
            - strong [ref=e972]: "Pregunta guía:"
            - text: ¿Qué entrega realmente el cuadro de texto?
          - paragraph [ref=e973]: Message Debug permite inspeccionar la salida del bloque de entrada. La conexión transporta mensajes dentro del mismo programa.
          - paragraph [ref=e974]:
            - img "Mapa funcional del enlace BPSK con O · Observar resaltado para el paso 4." [ref=e975]
            - strong [ref=e976]: Figura 4.
            - text: El foco del paso 4 corresponde a O · Observar.
          - list [ref=e977]:
            - listitem [ref=e978]:
              - strong [ref=e979]: "Fila TX:"
              - text: Solo se estudia la entrada de texto. La conversión UTF-8 de T1 se incorpora en el paso 5.
            - listitem [ref=e980]:
              - strong [ref=e981]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e982]:
              - strong [ref=e983]: "Fila RX:"
              - text: El receptor del mapa todavía no forma parte del ensayo.
            - listitem [ref=e984]:
              - strong [ref=e985]: "Fila de entorno y observación:"
              - text: O identifica Message Debug, conectado a la salida de la entrada de texto.
          - paragraph [ref=e986]:
            - link "Ampliar el mapa" [ref=e987] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-04.png
            - text: .
          - paragraph [ref=e988]:
            - strong [ref=e989]: "Entrada y salida del ensayo:"
            - text: Mensaje del cuadro → Message Debug → texto en consola.
          - list [ref=e990]:
            - listitem [ref=e991]:
              - strong [ref=e992]: "Qué cambia:"
              - text: Se conecta un observador a la salida de mensajes.
            - listitem [ref=e993]:
              - strong [ref=e994]: "Qué permanece fijo:"
              - text: Se mantiene Hola y todavía no existe una señal modulada.
            - listitem [ref=e995]:
              - strong [ref=e996]: "Qué se observa:"
              - text: La consola muestra el contenido después de confirmar el envío.
          - paragraph [ref=e997]:
            - strong [ref=e998]: "Comprobación e interpretación:"
            - text: El observador recibe el mensaje, pero no realiza una recepción de radio. No existe aún una ruta a través de muestras.
          - paragraph [ref=e999]:
            - strong [ref=e1000]: "Error que debe evitarse:"
            - text: Confundir una conexión de mensajes con el canal del enlace ocultaría errores posteriores del procesamiento de señal.
          - paragraph [ref=e1001]:
            - link "Montaje y procedimiento del paso 4" [ref=e1002] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#4-observar-el-mensaje-con-message-debug
            - text: .
          - heading "Paso 5 — Codificar el texto como bytes UTF-8" [level=2] [ref=e1003]
          - paragraph [ref=e1004]:
            - strong [ref=e1005]: "Pregunta guía:"
            - text: ¿Qué números representan el texto?
          - paragraph [ref=e1006]: UTF-8 convierte caracteres en bytes. Una PDU, Protocol Data Unit o unidad de datos, conserva un vector junto con sus metadatos.
          - paragraph [ref=e1007]:
            - img "Mapa funcional del enlace BPSK con T1 · Texto resaltado para el paso 5." [ref=e1008]
            - strong [ref=e1009]: Figura 5.
            - text: El foco del paso 5 corresponde a T1 · Texto.
          - list [ref=e1010]:
            - listitem [ref=e1011]:
              - strong [ref=e1012]: "Fila TX:"
              - text: T1 convierte el texto en bytes. Los demás bloques TX todavía no intervienen.
            - listitem [ref=e1013]:
              - strong [ref=e1014]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1015]:
              - strong [ref=e1016]: "Fila RX:"
              - text: El receptor del mapa todavía no forma parte del ensayo.
            - listitem [ref=e1017]:
              - strong [ref=e1018]: "Fila de entorno y observación:"
              - text: O permite inspeccionar los bytes y los metadatos de la PDU.
          - paragraph [ref=e1019]:
            - link "Ampliar el mapa" [ref=e1020] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-05.png
            - text: .
          - paragraph [ref=e1021]:
            - strong [ref=e1022]: "Entrada y salida del ensayo:"
            - text: Mensaje de texto → PDU con bytes UTF-8.
          - list [ref=e1023]:
            - listitem [ref=e1024]:
              - strong [ref=e1025]: "Qué cambia:"
              - text: Se incorpora el convertidor de texto a bytes.
            - listitem [ref=e1026]:
              - strong [ref=e1027]: "Qué permanece fijo:"
              - text: Se conserva el contenido del texto y sus espacios.
            - listitem [ref=e1028]:
              - strong [ref=e1029]: "Qué se observa:"
              - text: "Hola produce 48 6f 6c 61 en hexadecimal: cuatro bytes."
          - paragraph [ref=e1030]:
            - strong [ref=e1031]: "Comprobación e interpretación:"
            - text: La cantidad de caracteres puede diferir de la cantidad de bytes. La letra á ocupa dos bytes en UTF-8.
          - paragraph [ref=e1032]:
            - strong [ref=e1033]: "Error que debe evitarse:"
            - text: Una PDU de cuatro bytes todavía no contiene cuatro símbolos ni cuatro muestras.
          - paragraph [ref=e1034]:
            - link "Montaje y procedimiento del paso 5" [ref=e1035] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#5-convertir-texto-en-bytes-utf-8
            - text: .
          - heading "Paso 6 — Comprobar la conversión inversa" [level=2] [ref=e1036]
          - paragraph [ref=e1037]:
            - strong [ref=e1038]: "Pregunta guía:"
            - text: ¿La codificación permite recuperar exactamente el texto?
          - paragraph [ref=e1039]: El convertidor inverso interpreta los bytes como UTF-8. Esta prueba conecta los convertidores directamente mediante mensajes.
          - paragraph [ref=e1040]:
            - img "Mapa funcional del enlace BPSK con R6 · Validar resaltado para el paso 6." [ref=e1041]
            - strong [ref=e1042]: Figura 6.
            - text: El foco del paso 6 corresponde a R6 · Validar.
          - list [ref=e1043]:
            - listitem [ref=e1044]:
              - strong [ref=e1045]: "Fila TX:"
              - text: T1 convierte el texto en bytes. Los demás bloques TX todavía no intervienen.
            - listitem [ref=e1046]:
              - strong [ref=e1047]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1048]:
              - strong [ref=e1049]: "Fila RX:"
              - text: R6 señala la decodificación UTF-8. Se conecta directamente por mensajes, sin filtros, sincronizadores ni CRC.
            - listitem [ref=e1050]:
              - strong [ref=e1051]: "Fila de entorno y observación:"
              - text: O muestra el texto recuperado por la conexión directa.
          - paragraph [ref=e1052]:
            - link "Ampliar el mapa" [ref=e1053] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-06.png
            - text: .
          - paragraph [ref=e1054]:
            - strong [ref=e1055]: "Entrada y salida del ensayo:"
            - text: Texto → bytes UTF-8 → texto recuperado, sin atravesar el canal del mapa.
          - list [ref=e1056]:
            - listitem [ref=e1057]:
              - strong [ref=e1058]: "Qué cambia:"
              - text: Se añade la conversión de bytes a texto.
            - listitem [ref=e1059]:
              - strong [ref=e1060]: "Qué permanece fijo:"
              - text: No se añade todavía longitud, CRC ni modulación.
            - listitem [ref=e1061]:
              - strong [ref=e1062]: "Qué se observa:"
              - text: El texto recuperado coincide con el original, incluidos sus espacios.
          - paragraph [ref=e1063]:
            - strong [ref=e1064]: "Comprobación e interpretación:"
            - text: R6 señala la función de decodificación que luego pertenecerá al receptor. Su comprobador CRC todavía no forma parte de este ensayo.
          - paragraph [ref=e1065]:
            - strong [ref=e1066]: "Error que debe evitarse:"
            - text: Esta recuperación valida la representación del texto; todavía no valida un enlace de muestras.
          - paragraph [ref=e1067]:
            - link "Montaje y procedimiento del paso 6" [ref=e1068] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#6-recuperar-el-texto-desde-los-bytes
            - text: .
          - heading "Paso 7 — Construir un paquete que pueda comprobarse" [level=2] [ref=e1069]
          - paragraph [ref=e1070]:
            - strong [ref=e1071]: "Pregunta guía:"
            - text: ¿Cómo sabrá el receptor cuántos bytes pertenecen al texto?
          - paragraph [ref=e1072]: El constructor añade dos bytes de longitud y cuatro de CRC-32. El CRC, Cyclic Redundancy Check, permite detectar alteraciones del paquete.
          - paragraph [ref=e1073]:
            - img "Mapa funcional del enlace BPSK con T2 · Paquete resaltado para el paso 7." [ref=e1074]
            - strong [ref=e1075]: Figura 7.
            - text: El foco del paso 7 corresponde a T2 · Paquete.
          - list [ref=e1076]:
            - listitem [ref=e1077]:
              - strong [ref=e1078]: "Fila TX:"
              - text: T2 construye el paquete protegido. T3, el acceso, todavía no interviene.
            - listitem [ref=e1079]:
              - strong [ref=e1080]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1081]:
              - strong [ref=e1082]: "Fila RX:"
              - text: El comprobador R6 se incorporará después. El ensayo actual inspecciona el paquete construido.
            - listitem [ref=e1083]:
              - strong [ref=e1084]: "Fila de entorno y observación:"
              - text: O muestra el vector con longitud, texto y CRC.
          - paragraph [ref=e1085]:
            - link "Ampliar el mapa" [ref=e1086] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-07.png
            - text: .
          - paragraph [ref=e1087]:
            - strong [ref=e1088]: "Entrada y salida del ensayo:"
            - text: 4 bytes de Hola → 2 de longitud + 4 de texto + 4 de CRC = 10 bytes.
          - list [ref=e1089]:
            - listitem [ref=e1090]:
              - strong [ref=e1091]: "Qué cambia:"
              - text: Se incorpora el formato del paquete protegido.
            - listitem [ref=e1092]:
              - strong [ref=e1093]: "Qué permanece fijo:"
              - text: Los bytes UTF-8 del texto permanecen iguales.
            - listitem [ref=e1094]:
              - strong [ref=e1095]: "Qué se observa:"
              - text: La longitud interna vale cuatro, aunque el paquete completo contiene diez bytes.
          - paragraph [ref=e1096]:
            - strong [ref=e1097]: "Comprobación e interpretación:"
            - text: El CRC se calcula sobre longitud y texto. No incluye su propio campo. Los límites se aplican a palabras y bytes del texto.
          - paragraph [ref=e1098]:
            - strong [ref=e1099]: "Error que debe evitarse:"
            - text: El CRC detecta errores; no corrige bits ni autentica al emisor.
          - paragraph [ref=e1100]:
            - link "Montaje y procedimiento del paso 7" [ref=e1101] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#7-construir-el-paquete
            - text: .
          - heading "Paso 8 — Validar antes de entregar el texto" [level=2] [ref=e1102]
          - paragraph [ref=e1103]:
            - strong [ref=e1104]: "Pregunta guía:"
            - text: ¿Qué condiciones permiten aceptar un paquete?
          - paragraph [ref=e1105]: El comprobador interpreta la longitud y verifica el CRC antes de entregar los bytes al convertidor UTF-8.
          - paragraph [ref=e1106]:
            - img "Mapa funcional del enlace BPSK con R6 · Validar resaltado para el paso 8." [ref=e1107]
            - strong [ref=e1108]: Figura 8.
            - text: El foco del paso 8 corresponde a R6 · Validar.
          - list [ref=e1109]:
            - listitem [ref=e1110]:
              - strong [ref=e1111]: "Fila TX:"
              - text: T2 construye el paquete protegido. T3, el acceso, todavía no interviene.
            - listitem [ref=e1112]:
              - strong [ref=e1113]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1114]:
              - strong [ref=e1115]: "Fila RX:"
              - text: El comprobador y el decodificador R6 reciben una PDU por conexión directa; no atraviesan el canal.
            - listitem [ref=e1116]:
              - strong [ref=e1117]: "Fila de entorno y observación:"
              - text: O permite observar la aceptación o el motivo de rechazo.
          - paragraph [ref=e1118]:
            - link "Ampliar el mapa" [ref=e1119] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-08.png
            - text: .
          - paragraph [ref=e1120]:
            - strong [ref=e1121]: "Entrada y salida del ensayo:"
            - text: Paquete protegido → comprobación → bytes útiles → texto.
          - list [ref=e1122]:
            - listitem [ref=e1123]:
              - strong [ref=e1124]: "Qué cambia:"
              - text: Se conecta el comprobador al constructor por la ruta directa de PDU.
            - listitem [ref=e1125]:
              - strong [ref=e1126]: "Qué permanece fijo:"
              - text: Se conserva el formato del paso 7; el canal del mapa sigue sin utilizarse.
            - listitem [ref=e1127]:
              - strong [ref=e1128]: "Qué se observa:"
              - text: Hola se acepta cuando tamaño, longitud y CRC son coherentes.
          - paragraph [ref=e1129]:
            - strong [ref=e1130]: "Comprobación e interpretación:"
            - text: La salida aceptada es una decisión del protocolo. El comprobador no necesita conocer de antemano que el usuario escribió Hola.
          - paragraph [ref=e1131]:
            - strong [ref=e1132]: "Error que debe evitarse:"
            - text: Comparar solo lo enviado y lo mostrado no sustituye la comprobación del paquete recibido.
          - paragraph [ref=e1133]:
            - link "Montaje y procedimiento del paso 8" [ref=e1134] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#8-comprobar-el-paquete-y-recuperar-el-texto
            - text: .
          - heading "Paso 9 — Introducir un error deliberado" [level=2] [ref=e1135]
          - paragraph [ref=e1136]:
            - strong [ref=e1137]: "Pregunta guía:"
            - text: ¿El receptor rechaza una alteración sin perder los mensajes siguientes?
          - paragraph [ref=e1138]: Un auxiliar de prueba cambia un bit del segundo paquete después de calcular el CRC. La referencia exige rechazo, no recuperación de ese paquete.
          - paragraph [ref=e1139]:
            - img "Mapa funcional del enlace BPSK con T2 · Paquete, R6 · Validar, X · Ensayar resaltado para el paso 9." [ref=e1140]
            - strong [ref=e1141]: Figura 9.
            - text: El foco del paso 9 corresponde a T2 · Paquete, R6 · Validar, X · Ensayar.
          - list [ref=e1142]:
            - listitem [ref=e1143]:
              - strong [ref=e1144]: "Fila TX:"
              - text: T2 construye el paquete protegido. T3, el acceso, todavía no interviene.
            - listitem [ref=e1145]:
              - strong [ref=e1146]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1147]:
              - strong [ref=e1148]: "Fila RX:"
              - text: El comprobador y el decodificador R6 reciben una PDU por conexión directa; no atraviesan el canal.
            - listitem [ref=e1149]:
              - strong [ref=e1150]: "Fila de entorno y observación:"
              - text: X representa el auxiliar que altera el segundo paquete. O muestra los tres resultados.
          - paragraph [ref=e1151]:
            - link "Ampliar el mapa" [ref=e1152] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-09.png
            - text: .
          - paragraph [ref=e1153]:
            - strong [ref=e1154]: "Entrada y salida del ensayo:"
            - text: Paquete válido → alteración controlada → comprobador → rechazo del segundo envío.
          - list [ref=e1155]:
            - listitem [ref=e1156]:
              - strong [ref=e1157]: "Qué cambia:"
              - text: El auxiliar altera únicamente el segundo paquete de tres envíos.
            - listitem [ref=e1158]:
              - strong [ref=e1159]: "Qué permanece fijo:"
              - text: Se envía el mismo texto y se conserva el comprobador.
            - listitem [ref=e1160]:
              - strong [ref=e1161]: "Qué se observa:"
              - text: El primer y el tercer paquete se aceptan; el segundo se rechaza.
          - paragraph [ref=e1162]:
            - strong [ref=e1163]: "Comprobación e interpretación:"
            - text: El auxiliar es un instrumento de prueba. Más adelante se repite este control a través de las muestras.
          - paragraph [ref=e1164]:
            - strong [ref=e1165]: "Error que debe evitarse:"
            - text: Este error deliberado no representa todavía ruido gaussiano ni un modelo de canal.
          - paragraph [ref=e1166]:
            - link "Montaje y procedimiento del paso 9" [ref=e1167] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#9-comprobar-el-rechazo-de-un-bit-alterado
            - text: .
          - heading "Paso 10 — Separar cada byte en ocho bits" [level=2] [ref=e1168]
          - paragraph [ref=e1169]:
            - strong [ref=e1170]: "Pregunta guía:"
            - text: ¿Cambió el contenido o cambió su representación?
          - paragraph [ref=e1171]: "Bytes a bits entrega un elemento por bit, en orden MSB first: primero el bit más significativo de cada byte."
          - paragraph [ref=e1172]:
            - img "Mapa funcional del enlace BPSK con T4 · Bits resaltado para el paso 10." [ref=e1173]
            - strong [ref=e1174]: Figura 10.
            - text: El foco del paso 10 corresponde a T4 · Bits.
          - list [ref=e1175]:
            - listitem [ref=e1176]:
              - strong [ref=e1177]: "Fila TX:"
              - text: T4 separa los bytes del paquete en bits. No añade información nueva.
            - listitem [ref=e1178]:
              - strong [ref=e1179]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1180]:
              - strong [ref=e1181]: "Fila RX:"
              - text: El comprobador y el decodificador R6 reciben una PDU por conexión directa; no atraviesan el canal.
            - listitem [ref=e1182]:
              - strong [ref=e1183]: "Fila de entorno y observación:"
              - text: O permite contar y revisar los bits del vector.
          - paragraph [ref=e1184]:
            - link "Ampliar el mapa" [ref=e1185] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-10.png
            - text: .
          - paragraph [ref=e1186]:
            - strong [ref=e1187]: "Entrada y salida del ensayo:"
            - text: Paquete de 10 bytes → vector de 80 bits individuales.
          - list [ref=e1188]:
            - listitem [ref=e1189]:
              - strong [ref=e1190]: "Qué cambia:"
              - text: Se cambia la representación y la cantidad de elementos del vector.
            - listitem [ref=e1191]:
              - strong [ref=e1192]: "Qué permanece fijo:"
              - text: La secuencia de información del paquete y su CRC permanecen iguales.
            - listitem [ref=e1193]:
              - strong [ref=e1194]: "Qué se observa:"
              - text: El byte de H, 0x48, aparece como 01001000.
          - paragraph [ref=e1195]:
            - strong [ref=e1196]: "Comprobación e interpretación:"
            - text: Ochenta elementos con valores cero o uno no significan ochenta bytes de texto. Cada elemento representa un bit.
          - paragraph [ref=e1197]:
            - strong [ref=e1198]: "Error que debe evitarse:"
            - text: El orden de bits dentro del byte y el orden de bytes dentro de un campo son decisiones diferentes.
          - paragraph [ref=e1199]:
            - link "Montaje y procedimiento del paso 10" [ref=e1200] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#10-representar-el-paquete-mediante-bits
            - text: .
          - heading "Paso 11 — Mapear los bits a símbolos BPSK" [level=2] [ref=e1201]
          - paragraph [ref=e1202]:
            - strong [ref=e1203]: "Pregunta guía:"
            - text: ¿Qué valor complejo representa cada bit?
          - paragraph [ref=e1204]: BPSK, Binary Phase Shift Keying, asigna dos estados de fase. El laboratorio utiliza 0 → −1 y 1 → +1, con componente imaginaria cero.
          - paragraph [ref=e1205]:
            - img "Mapa funcional del enlace BPSK con T5 · BPSK resaltado para el paso 11." [ref=e1206]
            - strong [ref=e1207]: Figura 11.
            - text: El foco del paso 11 corresponde a T5 · BPSK.
          - list [ref=e1208]:
            - listitem [ref=e1209]:
              - strong [ref=e1210]: "Fila TX:"
              - text: T5 transforma bits en símbolos. Todavía no actúa el filtro RRC T6.
            - listitem [ref=e1211]:
              - strong [ref=e1212]: "Fila canal:"
              - text: Todavía no existe una señal temporal en este ensayo. La fila C muestra contexto futuro.
            - listitem [ref=e1213]:
              - strong [ref=e1214]: "Fila RX:"
              - text: Los bloques RX son contexto futuro. Los visores actuales observan el transmisor.
            - listitem [ref=e1215]:
              - strong [ref=e1216]: "Fila de entorno y observación:"
              - text: O reúne constelación y consola; los visores no actúan como receptor.
          - paragraph [ref=e1217]:
            - link "Ampliar el mapa" [ref=e1218] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-11.png
            - text: .
          - paragraph [ref=e1219]:
            - strong [ref=e1220]: "Entrada y salida del ensayo:"
            - text: 80 bits → 80 símbolos complejos, situados en (−1, 0) y (+1, 0).
          - list [ref=e1221]:
            - listitem [ref=e1222]:
              - strong [ref=e1223]: "Qué cambia:"
              - text: El adaptador pasa de PDU a tagged stream, flujo con etiquetas, y Chunks to Symbols aplica el mapeo.
            - listitem [ref=e1224]:
              - strong [ref=e1225]: "Qué permanece fijo:"
              - text: Cada bit conserva su posición; todavía no se forman varios valores temporales por símbolo.
            - listitem [ref=e1226]:
              - strong [ref=e1227]: "Qué se observa:"
              - text: La constelación TX tiene dos posiciones posibles.
          - paragraph [ref=e1228]:
            - strong [ref=e1229]: "Comprobación e interpretación:"
            - text: Un símbolo es una elección del alfabeto de modulación. Una muestra es un valor de la señal en un instante.
          - paragraph [ref=e1230]:
            - strong [ref=e1231]: "Error que debe evitarse:"
            - text: La constelación no muestra por sí sola el orden temporal de los símbolos.
          - paragraph [ref=e1232]:
            - link "Montaje y procedimiento del paso 11" [ref=e1233] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#11-asociar-bits-con-simbolos-bpsk
            - text: .
          - heading "Paso 12 — Construir muestras con un pulso rectangular" [level=2] [ref=e1234]
          - paragraph [ref=e1235]:
            - strong [ref=e1236]: "Pregunta guía:"
            - text: ¿Cómo adquieren duración los símbolos?
          - paragraph [ref=e1237]: Repeat representa cada símbolo mediante L muestras iguales. L es samples per symbol, muestras por símbolo, y corresponde a sps.
          - paragraph [ref=e1238]:
            - img "Mapa funcional del enlace BPSK con P · Rectangular resaltado para el paso 12." [ref=e1239]
            - strong [ref=e1240]: Figura 12.
            - text: El foco del paso 12 corresponde a P · Rectangular.
          - list [ref=e1241]:
            - listitem [ref=e1242]:
              - strong [ref=e1243]: "Fila TX:"
              - text: T5 alimenta la rama rectangular P. La cadena RRC T6 permanece como contexto futuro.
            - listitem [ref=e1244]:
              - strong [ref=e1245]: "Fila canal:"
              - text: El recorrido de muestras es ideal. No se introducen las perturbaciones de la fila C.
            - listitem [ref=e1246]:
              - strong [ref=e1247]: "Fila RX:"
              - text: Los bloques RX son contexto futuro. Los visores actuales observan el transmisor.
            - listitem [ref=e1248]:
              - strong [ref=e1249]: "Fila de entorno y observación:"
              - text: P produce la señal rectangular. O muestra I y Q en el tiempo.
          - paragraph [ref=e1250]:
            - link "Ampliar el mapa" [ref=e1251] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-12.png
            - text: .
          - paragraph [ref=e1252]:
            - strong [ref=e1253]: "Entrada y salida del ensayo:"
            - text: 80 símbolos → 320 muestras complejas con sps = 4.
          - list [ref=e1254]:
            - listitem [ref=e1255]:
              - strong [ref=e1256]: "Qué cambia:"
              - text: Se añade la rama rectangular de comparación; el bloque T6 RRC todavía no interviene.
            - listitem [ref=e1257]:
              - strong [ref=e1258]: "Qué permanece fijo:"
              - text: La tasa de símbolos vale 1000 símbolos/s y el paquete conserva sus bits.
            - listitem [ref=e1259]:
              - strong [ref=e1260]: "Qué se observa:"
              - text: La tasa de muestreo vale 4000 muestras/s. I presenta escalones y Q permanece en cero.
          - paragraph [ref=e1261]:
            - strong [ref=e1262]: "Comprobación e interpretación:"
            - text: Cuatro muestras por símbolo separan las tasas. No multiplican por cuatro la cantidad de bits del mensaje.
          - paragraph [ref=e1263]:
            - strong [ref=e1264]: "Error que debe evitarse:"
            - text: El eje temporal del visor expresa tiempo de señal. No obliga al computador a esperar esa duración.
          - paragraph [ref=e1265]:
            - link "Montaje y procedimiento del paso 12" [ref=e1266] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#12-construir-la-senal-en-el-dominio-del-tiempo
            - text: .
          - heading "Paso 13 — Dar forma RRC y cerrar la ráfaga" [level=2] [ref=e1267]
          - paragraph [ref=e1268]:
            - strong [ref=e1269]: "Pregunta guía:"
            - text: ¿Por qué el último mensaje necesita muestras de cierre?
          - paragraph [ref=e1270]: El filtro Root Raised Cosine, RRC o raíz de coseno alzado, interpola y da forma a los pulsos. Su memoria continúa después del último símbolo.
          - paragraph [ref=e1271]:
            - img "Mapa funcional del enlace BPSK con T6 · Pulso TX resaltado para el paso 13." [ref=e1272]
            - strong [ref=e1273]: Figura 13.
            - text: El foco del paso 13 corresponde a T6 · Pulso TX.
          - list [ref=e1274]:
            - listitem [ref=e1275]:
              - strong [ref=e1276]: "Fila TX:"
              - text: La rama RRC T6 produce las muestras TX. T3 todavía no añade una envoltura de trama.
            - listitem [ref=e1277]:
              - strong [ref=e1278]: "Fila canal:"
              - text: El recorrido de muestras es ideal. No se introducen las perturbaciones de la fila C.
            - listitem [ref=e1279]:
              - strong [ref=e1280]: "Fila RX:"
              - text: Los bloques RX son contexto futuro. Los visores actuales observan el transmisor.
            - listitem [ref=e1281]:
              - strong [ref=e1282]: "Fila de entorno y observación:"
              - text: P conserva la comparación rectangular. O permite leer la respuesta RRC y su cierre.
          - paragraph [ref=e1283]:
            - link "Ampliar el mapa" [ref=e1284] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-13.png
            - text: .
          - paragraph [ref=e1285]:
            - strong [ref=e1286]: "Entrada y salida del ensayo:"
            - text: 80 símbolos + 8 ceros de cierre → 88 elementos → 352 muestras RRC.
          - list [ref=e1287]:
            - listitem [ref=e1288]:
              - strong [ref=e1289]: "Qué cambia:"
              - text: Se añade la rama RRC y se compara con la rama rectangular.
            - listitem [ref=e1290]:
              - strong [ref=e1291]: "Qué permanece fijo:"
              - text: Se conservan BPSK, el paquete y las tasas nominales.
            - listitem [ref=e1292]:
              - strong [ref=e1293]: "Qué se observa:"
              - text: Las transiciones dejan de ser escalones. El cierre permite observar la respuesta del filtro al último símbolo.
          - paragraph [ref=e1294]:
            - strong [ref=e1295]: "Comprobación e interpretación:"
            - text: Los ocho ceros no representan bits adicionales. Los parámetros de referencia son roll-off α = 0.35 y 33 coeficientes.
          - paragraph [ref=e1296]:
            - strong [ref=e1297]: "Error que debe evitarse:"
            - text: La forma RRC no debe interpretarse como una lista de niveles BPSK constantes entre símbolos.
          - paragraph [ref=e1298]:
            - link "Montaje y procedimiento del paso 13" [ref=e1299] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#13-construir-un-pulso-rrc-y-observar-el-cierre-del-paquete
            - text: .
          - heading "Paso 14 — Recibir con filtro y tiempo conocidos" [level=2] [ref=e1300]
          - paragraph [ref=e1301]:
            - strong [ref=e1302]: "Pregunta guía:"
            - text: ¿En qué instantes recupera el receptor los símbolos?
          - paragraph [ref=e1303]: El matched filter, filtro adaptado, utiliza la forma RRC del transmisor. La primera selección conoce el retardo y los límites de la PDU.
          - paragraph [ref=e1304]:
            - img "Mapa funcional del enlace BPSK con R1 · RRC RX, R2 · Tiempo resaltado para el paso 14." [ref=e1305]
            - strong [ref=e1306]: Figura 14.
            - text: El foco del paso 14 corresponde a R1 · RRC RX, R2 · Tiempo.
          - list [ref=e1307]:
            - listitem [ref=e1308]:
              - strong [ref=e1309]: "Fila TX:"
              - text: La rama RRC T6 produce las muestras TX. T3 todavía no añade una envoltura de trama.
            - listitem [ref=e1310]:
              - strong [ref=e1311]: "Fila canal:"
              - text: El recorrido de muestras es ideal. No se introducen las perturbaciones de la fila C.
            - listitem [ref=e1312]:
              - strong [ref=e1313]: "Fila RX:"
              - text: R1 filtra y R2 selecciona con referencias ideales. Todavía no se utiliza Symbol Sync.
            - listitem [ref=e1314]:
              - strong [ref=e1315]: "Fila de entorno y observación:"
              - text: O distingue el registro completo de las muestras seleccionadas.
          - paragraph [ref=e1316]:
            - link "Ampliar el mapa" [ref=e1317] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-14.png
            - text: .
          - paragraph [ref=e1318]:
            - strong [ref=e1319]: "Entrada y salida del ensayo:"
            - text: Muestras RRC → cierre RX y filtro RRC → selección ideal → 80 símbolos.
          - list [ref=e1320]:
            - listitem [ref=e1321]:
              - strong [ref=e1322]: "Qué cambia:"
              - text: Se añade el filtro receptor y se compensa el retardo conjunto.
            - listitem [ref=e1323]:
              - strong [ref=e1324]: "Qué permanece fijo:"
              - text: El canal sigue ideal; sps y la fase de selección son conocidos.
            - listitem [ref=e1325]:
              - strong [ref=e1326]: "Qué se observa:"
              - text: Con 33 coeficientes por filtro, el retardo conjunto es 32 muestras. Se seleccionan los índices 32, 36, 40 y siguientes.
          - paragraph [ref=e1327]:
            - strong [ref=e1328]: "Comprobación e interpretación:"
            - text: El registro de Hola tiene 384 muestras con ambos cierres. Solo 80 muestras seleccionadas representan los símbolos del paquete.
          - paragraph [ref=e1329]:
            - strong [ref=e1330]: "Error que debe evitarse:"
            - text: Esta selección ideal no estima un reloj desconocido. Todavía recibe información de delimitación mediante etiquetas internas.
          - paragraph [ref=e1331]:
            - link "Montaje y procedimiento del paso 14" [ref=e1332] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#14-filtrar-en-el-receptor-ideal-y-seleccionar-los-simbolos
            - text: .
          - heading "Paso 15 — Recuperar bits, bytes y el paquete" [level=2] [ref=e1333]
          - paragraph [ref=e1334]:
            - strong [ref=e1335]: "Pregunta guía:"
            - text: ¿La ruta de muestras conserva el mensaje y permite detectar errores?
          - paragraph [ref=e1336]: El receptor toma I, decide un bit por su signo, reúne ocho bits por byte y entrega el paquete al comprobador.
          - paragraph [ref=e1337]:
            - img "Mapa funcional del enlace BPSK con R4 · Bits, R5 · Paquete, R6 · Validar resaltado para el paso 15." [ref=e1338]
            - strong [ref=e1339]: Figura 15.
            - text: El foco del paso 15 corresponde a R4 · Bits, R5 · Paquete, R6 · Validar.
          - list [ref=e1340]:
            - listitem [ref=e1341]:
              - strong [ref=e1342]: "Fila TX:"
              - text: La rama RRC T6 produce las muestras TX. T3 todavía no añade una envoltura de trama.
            - listitem [ref=e1343]:
              - strong [ref=e1344]: "Fila canal:"
              - text: El recorrido de muestras es ideal. No se introducen las perturbaciones de la fila C.
            - listitem [ref=e1345]:
              - strong [ref=e1346]: "Fila RX:"
              - text: R4 decide los bits y R5 reconstruye bytes con límites conocidos. La detección de acceso todavía no interviene.
            - listitem [ref=e1347]:
              - strong [ref=e1348]: "Fila de entorno y observación:"
              - text: O permite comprobar símbolos, bytes y resultado del CRC.
          - paragraph [ref=e1349]:
            - link "Ampliar el mapa" [ref=e1350] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-15.png
            - text: .
          - paragraph [ref=e1351]:
            - strong [ref=e1352]: "Entrada y salida del ensayo:"
            - text: 80 símbolos RX → 80 bits → 10 bytes → CRC correcto → Hola.
          - list [ref=e1353]:
            - listitem [ref=e1354]:
              - strong [ref=e1355]: "Qué cambia:"
              - text: Se cierra la recuperación de datos a través de las muestras.
            - listitem [ref=e1356]:
              - strong [ref=e1357]: "Qué permanece fijo:"
              - text: Se mantiene la selección ideal; los límites del paquete todavía son conocidos.
            - listitem [ref=e1358]:
              - strong [ref=e1359]: "Qué se observa:"
              - text: Hola, SDR y el texto Unicode se recuperan. La alteración deliberada sigue produciendo rechazo.
          - paragraph [ref=e1360]:
            - strong [ref=e1361]: "Comprobación e interpretación:"
            - text: R5 agrupa la reconstrucción de bytes. Su detector de acceso se añadirá en el paso 16.
          - paragraph [ref=e1362]:
            - strong [ref=e1363]: "Error que debe evitarse:"
            - text: Una constelación con dos grupos no demuestra que los bytes estén ordenados ni que el CRC sea correcto.
          - paragraph [ref=e1364]:
            - link "Montaje y procedimiento del paso 15" [ref=e1365] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#15-recuperar-los-bytes-y-comprobar-el-paquete
            - text: .
          - heading "Paso 16 — Detectar acceso y longitud desde los bits" [level=2] [ref=e1366]
          - paragraph [ref=e1367]:
            - strong [ref=e1368]: "Pregunta guía:"
            - text: ¿Cómo encuentra el receptor dónde empieza el paquete?
          - paragraph [ref=e1369]: TX añade una palabra de acceso y una cabecera externa duplicada. RX busca el acceso y crea una etiqueta nueva desde los bits recibidos.
          - paragraph [ref=e1370]:
            - img "Mapa funcional del enlace BPSK con T3 · Trama, R5 · Paquete resaltado para el paso 16." [ref=e1371]
            - strong [ref=e1372]: Figura 16.
            - text: El foco del paso 16 corresponde a T3 · Trama, R5 · Paquete.
          - list [ref=e1373]:
            - listitem [ref=e1374]:
              - strong [ref=e1375]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1376]:
              - strong [ref=e1377]: "Fila canal:"
              - text: El recorrido de muestras es ideal. No se introducen las perturbaciones de la fila C.
            - listitem [ref=e1378]:
              - strong [ref=e1379]: "Fila RX:"
              - text: R5 detecta el acceso; R2 todavía selecciona con referencias ideales.
            - listitem [ref=e1380]:
              - strong [ref=e1381]: "Fila de entorno y observación:"
              - text: O permite inspeccionar la detección y la longitud creada por RX.
          - paragraph [ref=e1382]:
            - link "Ampliar el mapa" [ref=e1383] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-16.png
            - text: .
          - paragraph [ref=e1384]:
            - strong [ref=e1385]: "Entrada y salida del ensayo:"
            - text: 10 bytes protegidos → trama de 22 bytes → detección → paquete original de 10 bytes.
          - list [ref=e1386]:
            - listitem [ref=e1387]:
              - strong [ref=e1388]: "Qué cambia:"
              - text: La envoltura añade ocho bytes de acceso y cuatro de longitud externa.
            - listitem [ref=e1389]:
              - strong [ref=e1390]: "Qué permanece fijo:"
              - text: La longitud interna de Hola sigue siendo cuatro y su CRC no cambia.
            - listitem [ref=e1391]:
              - strong [ref=e1392]: "Qué se observa:"
              - text: Las dos copias externas valen diez. El detector entrega 80 bits del paquete protegido.
          - paragraph [ref=e1393]:
            - strong [ref=e1394]: "Comprobación e interpretación:"
            - text: La palabra de acceso viaja en la señal. packet_len es una etiqueta de GNU Radio y no viaja como muestra.
          - paragraph [ref=e1395]:
            - strong [ref=e1396]: "Error que debe evitarse:"
            - text: Este paso resuelve la detección del paquete; la selección de instantes todavía utiliza referencias ideales.
          - paragraph [ref=e1397]:
            - link "Montaje y procedimiento del paso 16" [ref=e1398] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#16-detectar-el-comienzo-y-la-longitud-desde-los-bits
            - text: .
          - heading "Paso 17 — Recibir muestras sin etiquetas del transmisor" [level=2] [ref=e1399]
          - paragraph [ref=e1400]:
            - strong [ref=e1401]: "Pregunta guía:"
            - text: ¿Qué debe descubrir RX y qué sigue suponiendo conocido?
          - paragraph [ref=e1402]: La frontera elimina las etiquetas de delimitación antes del receptor. Keep M in N conserva una muestra por símbolo con una fase nominal fija.
          - paragraph [ref=e1403]:
            - img "Mapa funcional del enlace BPSK con R2 · Tiempo, R5 · Paquete resaltado para el paso 17." [ref=e1404]
            - strong [ref=e1405]: Figura 17.
            - text: El foco del paso 17 corresponde a R2 · Tiempo, R5 · Paquete.
          - list [ref=e1406]:
            - listitem [ref=e1407]:
              - strong [ref=e1408]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1409]:
              - strong [ref=e1410]: "Fila canal:"
              - text: El recorrido de muestras es ideal. No se introducen las perturbaciones de la fila C.
            - listitem [ref=e1411]:
              - strong [ref=e1412]: "Fila RX:"
              - text: R2 utiliza selección nominal fija. R5 detecta el paquete y R6 lo comprueba. Costas todavía no interviene.
            - listitem [ref=e1413]:
              - strong [ref=e1414]: "Fila de entorno y observación:"
              - text: O observa el stream; los auxiliares no entregan el texto directamente a RX.
          - paragraph [ref=e1415]:
            - link "Ampliar el mapa" [ref=e1416] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-17.png
            - text: .
          - paragraph [ref=e1417]:
            - strong [ref=e1418]: "Entrada y salida del ensayo:"
            - text: Stream de muestras sin etiquetas privadas → selección fija → bits → acceso → paquete.
          - list [ref=e1419]:
            - listitem [ref=e1420]:
              - strong [ref=e1421]: "Qué cambia:"
              - text: La recepción deja de utilizar la PDU delimitada por TX.
            - listitem [ref=e1422]:
              - strong [ref=e1423]: "Qué permanece fijo:"
              - text: Se conocen la tasa nominal, la fase de selección y el retardo de los filtros.
            - listitem [ref=e1424]:
              - strong [ref=e1425]: "Qué se observa:"
              - text: Cada mensaje, incluido el último, se recibe sin enviar otro para completar buffers.
          - paragraph [ref=e1426]:
            - strong [ref=e1427]: "Comprobación e interpretación:"
            - text: El detector genera sus propias etiquetas. El selector fijo todavía no estima un error temporal desconocido.
          - paragraph [ref=e1428]: El visor puede incluir arranque, cierre y muestras fuera del instante adecuado. Los puntos cercanos al origen no añaden un tercer símbolo al alfabeto BPSK.
          - paragraph [ref=e1429]:
            - strong [ref=e1430]: "Error que debe evitarse:"
            - text: Un stream sin etiquetas de paquete no implica señal de duración infinita. Durante las pausas no se añaden muestras artificiales.
          - paragraph [ref=e1431]:
            - link "Montaje y procedimiento del paso 17" [ref=e1432] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#17-recibir-desde-un-stream-sin-etiquetas-de-delimitacion
            - text: .
          - heading "Paso 18 — Añadir ruido y contar cada etapa" [level=2] [ref=e1433]
          - paragraph [ref=e1434]:
            - strong [ref=e1435]: "Pregunta guía:"
            - text: ¿En qué etapa se pierde un envío?
          - paragraph [ref=e1436]: El canal suma ruido gaussiano complejo antes del filtro RX. Los contadores separan envíos, detecciones, paquetes completos y textos aceptados.
          - paragraph [ref=e1437]:
            - img "Mapa funcional del enlace BPSK con C5 · Ruido, X · Ensayar resaltado para el paso 18." [ref=e1438]
            - strong [ref=e1439]: Figura 18.
            - text: El foco del paso 18 corresponde a C5 · Ruido, X · Ensayar.
          - list [ref=e1440]:
            - listitem [ref=e1441]:
              - strong [ref=e1442]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1443]:
              - strong [ref=e1444]: "Fila canal:"
              - text: Solo C5 añade ruido. Los demás desajustes permanecen en cero.
            - listitem [ref=e1445]:
              - strong [ref=e1446]: "Fila RX:"
              - text: R2 utiliza selección nominal fija. R5 detecta el paquete y R6 lo comprueba. Costas todavía no interviene.
            - listitem [ref=e1447]:
              - strong [ref=e1448]: "Fila de entorno y observación:"
              - text: X incorpora los contadores. O permite relacionar dispersión y resultado de los envíos.
          - paragraph [ref=e1449]:
            - link "Ampliar el mapa" [ref=e1450] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-18.png
            - text: .
          - paragraph [ref=e1451]:
            - strong [ref=e1452]: "Entrada y salida del ensayo:"
            - text: Muestras limpias + ruido → muestras RX → DET → RX → OK.
          - list [ref=e1453]:
            - listitem [ref=e1454]:
              - strong [ref=e1455]: "Qué cambia:"
              - text: Se cambia ruido_amplitud y se declara la semilla del ensayo.
            - listitem [ref=e1456]:
              - strong [ref=e1457]: "Qué permanece fijo:"
              - text: Se conserva el corpus y se mantienen los demás desajustes en cero.
            - listitem [ref=e1458]:
              - strong [ref=e1459]: "Qué se observa:"
              - text: Las muestras se dispersan. El resumen permite distinguir ausencia de detección y rechazo del paquete.
          - paragraph [ref=e1460]:
            - strong [ref=e1461]: "Comprobación e interpretación:"
            - text: TX cuenta envíos; DET cuenta detecciones; RX cuenta paquetes completos; OK cuenta textos aceptados. La amplitud del generador no es una SNR.
          - paragraph [ref=e1462]:
            - strong [ref=e1463]: "Error que debe evitarse:"
            - text: El CRC no elimina ruido. Un lote pequeño tampoco establece una tasa de error estadística para cualquier mensaje.
          - paragraph [ref=e1464]:
            - link "Montaje y procedimiento del paso 18" [ref=e1465] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#18-anadir-ruido-gaussiano-y-contar-resultados
            - text: .
          - heading "Paso 19 — Introducir fase y observar Costas" [level=2] [ref=e1466]
          - paragraph [ref=e1467]:
            - strong [ref=e1468]: "Pregunta guía:"
            - text: ¿Alinear los grupos garantiza interpretar sus bits?
          - paragraph [ref=e1469]: Una fase constante rota la señal. El Costas Loop, lazo de recuperación de portadora, busca alinear los símbolos BPSK con el eje real.
          - paragraph [ref=e1470]:
            - img "Mapa funcional del enlace BPSK con C1 · Fase, R3 · Costas resaltado para el paso 19." [ref=e1471]
            - strong [ref=e1472]: Figura 19.
            - text: El foco del paso 19 corresponde a C1 · Fase, R3 · Costas.
          - list [ref=e1473]:
            - listitem [ref=e1474]:
              - strong [ref=e1475]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1476]:
              - strong [ref=e1477]: "Fila canal:"
              - text: C1 aplica una fase constante; los demás desajustes permanecen en cero.
            - listitem [ref=e1478]:
              - strong [ref=e1479]: "Fila RX:"
              - text: R3 recupera portadora después de la selección fija. La segunda hipótesis de polaridad todavía no interviene.
            - listitem [ref=e1480]:
              - strong [ref=e1481]: "Fila de entorno y observación:"
              - text: O compara las constelaciones antes y después de Costas.
          - paragraph [ref=e1482]:
            - link "Ampliar el mapa" [ref=e1483] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-19.png
            - text: .
          - paragraph [ref=e1484]:
            - strong [ref=e1485]: "Entrada y salida del ensayo:"
            - text: Símbolos rotados → Costas de orden 2 → símbolos alineados, con posible inversión.
          - list [ref=e1486]:
            - listitem [ref=e1487]:
              - strong [ref=e1488]: "Qué cambia:"
              - text: Se aplica fase constante y se compara el receptor con Costas y sin Costas.
            - listitem [ref=e1489]:
              - strong [ref=e1490]: "Qué permanece fijo:"
              - text: No se introduce todavía desajuste de frecuencia ni deriva de reloj.
            - listitem [ref=e1491]:
              - strong [ref=e1492]: "Qué se observa:"
              - text: Los grupos rotan antes del lazo. Después pueden quedar alineados, pero intercambiados.
          - paragraph [ref=e1493]:
            - strong [ref=e1494]: "Comprobación e interpretación:"
            - text: BPSK presenta una ambigüedad de 180°. El control de 120° conserva un fallo que el siguiente paso debe resolver.
          - paragraph [ref=e1495]:
            - strong [ref=e1496]: "Error que debe evitarse:"
            - text: Una alineación geométrica correcta no establece cuál grupo significa cero.
          - paragraph [ref=e1497]:
            - link "Montaje y procedimiento del paso 19" [ref=e1498] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#19-introducir-una-rotacion-constante-y-recuperar-fase
            - text: .
          - heading "Paso 20 — Resolver la polaridad con el protocolo" [level=2] [ref=e1499]
          - paragraph [ref=e1500]:
            - strong [ref=e1501]: "Pregunta guía:"
            - text: ¿Qué hipótesis convierte la alineación en bits interpretables?
          - paragraph [ref=e1502]: El receptor prueba los bits normales y sus complementos. Cada ruta busca la misma palabra de acceso y entrega el paquete al mismo comprobador.
          - paragraph [ref=e1503]:
            - img "Mapa funcional del enlace BPSK con R4 · Bits, R5 · Paquete resaltado para el paso 20." [ref=e1504]
            - strong [ref=e1505]: Figura 20.
            - text: El foco del paso 20 corresponde a R4 · Bits, R5 · Paquete.
          - list [ref=e1506]:
            - listitem [ref=e1507]:
              - strong [ref=e1508]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1509]:
              - strong [ref=e1510]: "Fila canal:"
              - text: C1 aplica una fase constante; los demás desajustes permanecen en cero.
            - listitem [ref=e1511]:
              - strong [ref=e1512]: "Fila RX:"
              - text: R2 sigue fijo. R3 conserva Costas y R4–R5 prueban las dos polaridades.
            - listitem [ref=e1513]:
              - strong [ref=e1514]: "Fila de entorno y observación:"
              - text: O permite identificar la ruta normal o invertida que entrega el paquete.
          - paragraph [ref=e1515]:
            - link "Ampliar el mapa" [ref=e1516] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-20.png
            - text: .
          - paragraph [ref=e1517]:
            - strong [ref=e1518]: "Entrada y salida del ensayo:"
            - text: Bits decididos → hipótesis normal e invertida → acceso y CRC → texto aceptado.
          - list [ref=e1519]:
            - listitem [ref=e1520]:
              - strong [ref=e1521]: "Qué cambia:"
              - text: Se añade la segunda hipótesis de polaridad.
            - listitem [ref=e1522]:
              - strong [ref=e1523]: "Qué permanece fijo:"
              - text: Se conserva Costas, la palabra de acceso, el paquete y el CRC.
            - listitem [ref=e1524]:
              - strong [ref=e1525]: "Qué se observa:"
              - text: El caso de 120° puede recuperar el texto por la ruta invertida.
          - paragraph [ref=e1526]:
            - strong [ref=e1527]: "Comprobación e interpretación:"
            - text: El receptor utiliza estructura transmitida y CRC. No recibe la fase exacta del canal para elegir la polaridad.
          - paragraph [ref=e1528]:
            - strong [ref=e1529]: "Error que debe evitarse:"
            - text: Invertir los bits resuelve la ambigüedad de signo. No corrige una selección temporal errónea.
          - paragraph [ref=e1530]:
            - link "Montaje y procedimiento del paso 20" [ref=e1531] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#20-resolver-la-polaridad-bpsk-y-recuperar-el-caso-de-120
            - text: .
          - heading "Paso 21 — Seguir una diferencia de frecuencia" [level=2] [ref=e1532]
          - paragraph [ref=e1533]:
            - strong [ref=e1534]: "Pregunta guía:"
            - text: ¿Qué cambia cuando la fase gira durante el mensaje?
          - paragraph [ref=e1535]: Un frequency offset, desajuste de frecuencia, acumula fase con el tiempo. El Costas existente estima y sigue esa evolución dentro de las condiciones ensayadas.
          - paragraph [ref=e1536]: El desajuste se expresa en Hz, hertz o ciclos por segundo.
          - paragraph [ref=e1537]:
            - img "Mapa funcional del enlace BPSK con C2 · Frecuencia, R3 · Costas resaltado para el paso 21." [ref=e1538]
            - strong [ref=e1539]: Figura 21.
            - text: El foco del paso 21 corresponde a C2 · Frecuencia, R3 · Costas.
          - list [ref=e1540]:
            - listitem [ref=e1541]:
              - strong [ref=e1542]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1543]:
              - strong [ref=e1544]: "Fila canal:"
              - text: C2 introduce una diferencia de frecuencia. Se estudia su efecto con los demás desajustes en cero.
            - listitem [ref=e1545]:
              - strong [ref=e1546]: "Fila RX:"
              - text: R2 sigue fijo. R3 conserva Costas y R4–R5 prueban las dos polaridades.
            - listitem [ref=e1547]:
              - strong [ref=e1548]: "Fila de entorno y observación:"
              - text: O incluye la estimación de frecuencia expresada en Hz.
          - paragraph [ref=e1549]:
            - link "Ampliar el mapa" [ref=e1550] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-21.png
            - text: .
          - paragraph [ref=e1551]:
            - strong [ref=e1552]: "Entrada y salida del ensayo:"
            - text: Muestras con giro progresivo → Costas → símbolos corregidos y estimación de frecuencia.
          - list [ref=e1553]:
            - listitem [ref=e1554]:
              - strong [ref=e1555]: "Qué cambia:"
              - text: El Rotator introduce un desajuste en Hz y se observa la estimación del lazo.
            - listitem [ref=e1556]:
              - strong [ref=e1557]: "Qué permanece fijo:"
              - text: Se mantienen el tiempo nominal, ambas polaridades y el formato del paquete.
            - listitem [ref=e1558]:
              - strong [ref=e1559]: "Qué se observa:"
              - text: Con +10 Hz, la estimación debe acercarse a +10 Hz después del arranque.
          - paragraph [ref=e1560]:
            - strong [ref=e1561]: "Comprobación e interpretación:"
            - text: La fase constante y la diferencia de frecuencia son magnitudes distintas. Sus unidades son grados o radianes y Hz, respectivamente.
          - paragraph [ref=e1562]:
            - strong [ref=e1563]: "Error que debe evitarse:"
            - text: Una fase que cambia durante el paquete no se compensa mediante una sola rotación constante. La fila −10 Hz queda para el alumno.
          - paragraph [ref=e1564]:
            - link "Montaje y procedimiento del paso 21" [ref=e1565] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#21-introducir-un-desajuste-de-frecuencia-y-recuperarlo-con-costas
            - text: .
          - heading "Paso 22 — Separar retardo y fase de muestreo" [level=2] [ref=e1566]
          - paragraph [ref=e1567]:
            - strong [ref=e1568]: "Pregunta guía:"
            - text: ¿Qué ocurre si RX decide entre los instantes adecuados?
          - paragraph [ref=e1569]: Delay desplaza las muestras. Un selector fijo puede tomar muestras entre símbolos; cambiar offset_muestreo permite un control manual con retardo conocido.
          - paragraph [ref=e1570]:
            - img "Mapa funcional del enlace BPSK con C3 · Retardo, R2 · Tiempo resaltado para el paso 22." [ref=e1571]
            - strong [ref=e1572]: Figura 22.
            - text: El foco del paso 22 corresponde a C3 · Retardo, R2 · Tiempo.
          - list [ref=e1573]:
            - listitem [ref=e1574]:
              - strong [ref=e1575]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1576]:
              - strong [ref=e1577]: "Fila canal:"
              - text: C3 desplaza la señal; las tasas permanecen iguales.
            - listitem [ref=e1578]:
              - strong [ref=e1579]: "Fila RX:"
              - text: R2 sigue fijo. R3 conserva Costas y R4–R5 prueban las dos polaridades.
            - listitem [ref=e1580]:
              - strong [ref=e1581]: "Fila de entorno y observación:"
              - text: O compara constelaciones y resumen en las tres condiciones temporales.
          - paragraph [ref=e1582]:
            - link "Ampliar el mapa" [ref=e1583] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-22.png
            - text: .
          - paragraph [ref=e1584]:
            - strong [ref=e1585]: "Entrada y salida del ensayo:"
            - text: Muestras retrasadas → selector fijo desalineado → amplitudes intermedias y posibles pérdidas.
          - list [ref=e1586]:
            - listitem [ref=e1587]:
              - strong [ref=e1588]: "Qué cambia:"
              - text: Se compara retardo cero, retardo dos con offset cero y retardo dos con offset dos.
            - listitem [ref=e1589]:
              - strong [ref=e1590]: "Qué permanece fijo:"
              - text: Las tasas son iguales y los demás desajustes permanecen en cero.
            - listitem [ref=e1591]:
              - strong [ref=e1592]: "Qué se observa:"
              - text: Dos muestras equivalen a medio símbolo con sps = 4. El control manual recupera Hola al cambiar la selección.
          - paragraph [ref=e1593]:
            - strong [ref=e1594]: "Comprobación e interpretación:"
            - text: El ensayo modela un desajuste constante del instante de llegada respecto del muestreo nominal. No incluye ecos ni deriva de reloj.
          - paragraph [ref=e1595]:
            - strong [ref=e1596]: "Error que debe evitarse:"
            - text: Costas puede alinear la fase sin corregir el instante de muestreo. El valor manual conocido no constituye sincronización automática.
          - paragraph [ref=e1597]:
            - link "Montaje y procedimiento del paso 22" [ref=e1598] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#22-introducir-un-desajuste-temporal-y-reconocer-sus-efectos
            - text: .
          - heading "Paso 23 — Adquirir el instante y seguir el reloj" [level=2] [ref=e1599]
          - paragraph [ref=e1600]:
            - strong [ref=e1601]: "Pregunta guía:"
            - text: ¿Por qué una corrección temporal inicial puede dejar de servir?
          - paragraph [ref=e1602]: Symbol Sync con Gardner estima los instantes y ajusta el período. Una diferencia constante entre relojes produce un desplazamiento temporal que se acumula.
          - paragraph [ref=e1603]: La unidad ppm significa partes por millón. Un error de +1000 ppm corresponde a una diferencia relativa de +0.001.
          - paragraph [ref=e1604]:
            - img "Mapa funcional del enlace BPSK con C4 · Reloj, R2 · Tiempo resaltado para el paso 23." [ref=e1605]
            - strong [ref=e1606]: Figura 23.
            - text: El foco del paso 23 corresponde a C4 · Reloj, R2 · Tiempo.
          - list [ref=e1607]:
            - listitem [ref=e1608]:
              - strong [ref=e1609]: "Fila TX:"
              - text: T3 añade acceso y cabecera. La trama de Hola contiene 22 bytes antes del mapeo.
            - listitem [ref=e1610]:
              - strong [ref=e1611]: "Fila canal:"
              - text: El ensayo A varía C3. El ensayo B utiliza C4 y restablece el retardo a cero.
            - listitem [ref=e1612]:
              - strong [ref=e1613]: "Fila RX:"
              - text: R2 utiliza Symbol Sync; R3 conserva Costas. Las dos polaridades alimentan detección y comprobación del paquete.
            - listitem [ref=e1614]:
              - strong [ref=e1615]: "Fila de entorno y observación:"
              - text: O añade el período estimado en muestras/símbolo. X conserva los contadores.
          - paragraph [ref=e1616]:
            - link "Ampliar el mapa" [ref=e1617] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-23.png
            - text: .
          - paragraph [ref=e1618]:
            - strong [ref=e1619]: "Entrada y salida del ensayo:"
            - text: Muestras RX → filtro adaptado → Symbol Sync → una muestra por símbolo y período estimado.
          - list [ref=e1620]:
            - listitem [ref=e1621]:
              - strong [ref=e1622]: "Qué cambia:"
              - text: Se sustituye el selector activo y después se introduce reloj_ppm mediante un remuestreador.
            - listitem [ref=e1623]:
              - strong [ref=e1624]: "Qué permanece fijo:"
              - text: El receptor conoce sps nominal, pero no recibe el retardo ni el error exacto del canal.
            - listitem [ref=e1625]:
              - strong [ref=e1626]: "Qué se observa:"
              - text: El retardo inicial se adquiere con período cercano a cuatro. Con +1000 ppm, el período esperado es 4.004 muestras/símbolo.
          - paragraph [ref=e1627]:
            - strong [ref=e1628]: "Comprobación e interpretación:"
            - text: En el ensayo de reloj se envía el texto largo primero y Hola después. El selector fijo rechaza el largo; Symbol Sync recupera ambos.
          - paragraph [ref=e1629]:
            - strong [ref=e1630]: "Error que debe evitarse:"
            - text: No se sustituye esa secuencia por dos Hola. La fila −1000 ppm queda para el alumno y el ensayo aún no demuestra seguimiento de jitter.
          - paragraph [ref=e1631]:
            - link "Montaje y procedimiento del paso 23" [ref=e1632] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#23-recuperar-el-instante-de-simbolo-y-seguir-la-deriva-de-reloj
            - text: .
          - heading "Paso 24 — Dar tiempo de adquisición e integrar" [level=2] [ref=e1633]
          - paragraph [ref=e1634]:
            - strong [ref=e1635]: "Pregunta guía:"
            - text: ¿Puede el primer acceso llegar antes de que los lazos se estabilicen?
          - paragraph [ref=e1636]: La combinación de desajustes reveló una pérdida inicial sin preámbulo. TX añade 32 bytes 0x55 antes del acceso para proporcionar muestras de adquisición.
          - paragraph [ref=e1637]:
            - img "Mapa funcional del enlace BPSK con T3 · Trama resaltado para el paso 24." [ref=e1638]
            - strong [ref=e1639]: Figura 24.
            - text: El foco del paso 24 corresponde a T3 · Trama.
          - list [ref=e1640]:
            - listitem [ref=e1641]:
              - strong [ref=e1642]: "Fila TX:"
              - text: T3 incorpora el preámbulo. La trama de Hola contiene 54 bytes antes del mapeo.
            - listitem [ref=e1643]:
              - strong [ref=e1644]: "Fila canal:"
              - text: C1–C4 actúan juntos. La tercera condición añade también ruido en C5.
            - listitem [ref=e1645]:
              - strong [ref=e1646]: "Fila RX:"
              - text: R2 utiliza Symbol Sync; R3 conserva Costas. Las dos polaridades alimentan detección y comprobación del paquete.
            - listitem [ref=e1647]:
              - strong [ref=e1648]: "Fila de entorno y observación:"
              - text: O y X reúnen constelaciones, frecuencia, período y resumen. Sus capturas manuales quedan pendientes.
          - paragraph [ref=e1649]:
            - link "Ampliar el mapa" [ref=e1650] [cursor=pointer]:
              - /url: ../figures/enlace-mapa-paso-24.png
            - text: .
          - paragraph [ref=e1651]:
            - strong [ref=e1652]: "Entrada y salida del ensayo:"
            - text: 32 bytes de preámbulo + 22 de trama anterior → 54 bytes → adquisición → acceso → paquete protegido.
          - list [ref=e1653]:
            - listitem [ref=e1654]:
              - strong [ref=e1655]: "Qué cambia:"
              - text: Se combinan fase, frecuencia, retardo y reloj; una ejecución adicional añade ruido de amplitud 0.1.
            - listitem [ref=e1656]:
              - strong [ref=e1657]: "Qué permanece fijo:"
              - text: Se mantienen los parámetros de los lazos, el acceso exacto, las longitudes útiles y el CRC.
            - listitem [ref=e1658]:
              - strong [ref=e1659]: "Qué se observa:"
              - text: La referencia automática recupera el primer texto antes del siguiente envío en los escenarios declarados.
          - paragraph [ref=e1660]:
            - strong [ref=e1661]: "Comprobación e interpretación:"
            - text: El preámbulo añade 256 símbolos, equivalentes a 256 ms con 1000 símbolos/s. No cambia el paquete protegido de diez bytes.
          - paragraph [ref=e1662]:
            - strong [ref=e1663]: "Error que debe evitarse:"
            - text: Los lazos no corrigen retroactivamente un acceso ya perdido. Las capturas manuales del paso 24 quedan pendientes; QPSK requiere otra validación.
          - paragraph [ref=e1664]:
            - link "Montaje y procedimiento del paso 24" [ref=e1665] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/#24-cerrar-la-etapa-bpsk-con-el-enlace-integrado
            - text: .
