          - heading "Cuatro funciones que deben nombrarse por separado" [level=3] [ref=e1722]
          - list [ref=e1723]:
            - listitem [ref=e1724]:
              - strong [ref=e1725]: "Adquisición:"
              - text: los lazos ajustan sus estimaciones iniciales a partir de las muestras observadas.
            - listitem [ref=e1726]:
              - strong [ref=e1727]: "Seguimiento:"
              - text: los lazos continúan ajustando portadora o instantes de símbolo mientras avanza la señal.
            - listitem [ref=e1728]:
              - strong [ref=e1729]: "Detección del paquete:"
              - text: el detector encuentra el acceso y lee su longitud externa.
            - listitem [ref=e1730]:
              - strong [ref=e1731]: "Validación:"
              - text: el comprobador decide si el paquete reconstruido cumple el formato y el CRC antes de entregar el texto.
          - paragraph [ref=e1732]: El preámbulo proporciona muestras antes del acceso. La palabra de acceso permite localizar el paquete. El CRC comprueba su contenido reconstruido. Esas funciones no se sustituyen entre sí.
          - paragraph [ref=e1733]: Una pérdida inicial con desajustes combinados no demuestra incapacidad general de los sincronizadores. En el control sin preámbulo, los lazos podían estabilizarse después de que hubiera pasado el primer acceso. Ese paquete no se recuperaba retroactivamente. El paso 24 modifica el comienzo de la trama y vuelve a comprobar el primer envío.
          - paragraph [ref=e1734]: La referencia integrada contempla condiciones discretas y semillas declaradas. No demuestra recepción con cualquier ruido, desajuste, canal variable o dispersión multipath, propagación por varios caminos.
          - heading "Ejercicios de integración" [level=2] [ref=e1735]
          - heading "Ejercicio A — Seguir las longitudes de Hola" [level=3] [ref=e1736]
          - paragraph [ref=e1737]: El mensaje contiene cuatro bytes UTF-8. ¿Cuántos bytes tienen el paquete protegido, la trama del paso 16 y la trama del paso 24? ¿Qué indican las longitudes interna y externa?
