        - article [ref=e277]:
          - heading "Del texto al enlace BPSK — Mapa de los 24 pasos" [level=1] [ref=e278]
          - heading "Propósito de la clase" [level=2] [ref=e279]
          - paragraph [ref=e280]:
            - text: El estudiante explica qué transforma cada bloque y qué problema resuelve cada paso del
            - link "laboratorio de enlace digital" [ref=e281] [cursor=pointer]:
              - /url: ../laboratorio-enlace-digital/
            - text: . La guía de construcción indica cómo montar el flowgraph. Esta clase conecta esos procedimientos con el sistema completo.
          - paragraph [ref=e282]:
            - text: "El hilo conductor es una pregunta:"
            - strong [ref=e283]: ¿qué debe ocurrir para que el receptor entregue exactamente el texto escrito en el transmisor?
          - heading "Objetivos" [level=2] [ref=e284]
          - paragraph [ref=e285]: "Al finalizar el recorrido, el estudiante puede:"
          - list [ref=e286]:
            - listitem [ref=e287]: Seguir un mensaje a través de texto, bytes, bits, símbolos y muestras.
            - listitem [ref=e288]: Distinguir el contenido útil, el paquete protegido y la trama transmitida.
            - listitem [ref=e289]: Explicar el propósito de los filtros y de cada función de sincronización.
            - listitem [ref=e290]: Relacionar una perturbación del canal con la función receptora que la trata.
            - listitem [ref=e291]: Identificar dónde falla un envío utilizando observaciones y contadores.
            - listitem [ref=e292]: Separar un resultado comprobado de una conclusión que el experimento todavía no permite.
          - heading "Cómo leer el mapa" [level=2] [ref=e293]
          - paragraph [ref=e294]: Cada paso conserva las posiciones de los bloques. El mapa amplía el esquema conceptual del paso 15 de la guía. Los bloques agrupan funciones; un recuadro puede corresponder a varios bloques de GNU Radio.
          - list [ref=e295]:
            - listitem [ref=e296]:
              - strong [ref=e297]: "Naranja, borde grueso:"
              - text: función estudiada en ese paso.
            - listitem [ref=e298]:
              - strong [ref=e299]: "Azul:"
              - text: funciones relacionadas que ayudan a explicar el experimento.
            - listitem [ref=e300]:
              - strong [ref=e301]: "Gris:"
              - text: contexto del sistema completo; no significa que el bloque ya esté instalado o activo.
            - listitem [ref=e302]:
              - strong [ref=e303]: "T:"
              - text: transmisor, TX. La fila se lee de izquierda a derecha.
            - listitem [ref=e304]:
              - strong [ref=e305]: "C:"
              - text: canal simulado. Las flechas continúan de derecha a izquierda.
            - listitem [ref=e306]:
              - strong [ref=e307]: "R:"
              - text: receptor, RX. La fila se lee de izquierda a derecha.
            - listitem [ref=e308]:
              - strong [ref=e309]: "Fila inferior:"
              - text: entorno, observadores, auxiliares de prueba y rama rectangular de comparación.
          - paragraph [ref=e310]:
            - strong [ref=e311]: Los mapas no son capturas de ejecución ni planos de cableado.
            - text: El texto de cada paso declara qué ruta utiliza el experimento. Las conexiones y los parámetros exactos permanecen en la guía.
          - paragraph [ref=e312]: El recorrido utiliza muestras complejas de banda base. No incluye antenas, conversión a radiofrecuencia, hardware ni propagación física. Los efectos introducidos en el canal representan perturbaciones controladas del enlace.
          - generic [ref=e313]:
            - paragraph [ref=e314]: Estado del material
            - paragraph [ref=e315]:
              - text: Esta clase acompaña los 24 pasos BPSK. No inicia otra sesión formal ni desarrolla todavía QPSK. Las capturas manuales del paso 24 quedan pendientes. Sus referencias automáticas tienen el alcance declarado en la guía. El archivo
              - code [ref=e316]: end-to-end.grc
              - text: guardado en el repositorio corresponde al estado restaurado del paso 23. El paso 24 se aplica siguiendo la guía.
