            - listitem [ref=f7e875]:
              - strong [ref=f7e876]: "Otros tonos:"
              - text: son los de −600 y 0 kHz, de amplitudes 0.6 y 0.4 utilizados en la sección 6.3. Si coinciden con componentes del objetivo, el espectro muestra su suma compleja, no dos picos separados.
            - listitem [ref=f7e877]:
              - strong [ref=f7e878]: "Bloque del espectro:"
              - text: 240 muestras, duración 100 µs y separación entre bins de 10 kHz. La interfaz calcula una DFT directa normalizada; una FFT del mismo bloque obtiene los mismos coeficientes. Se omiten residuos numéricos menores que
