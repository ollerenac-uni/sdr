            - listitem [ref=f10e3533]:
              - link "GNU Radio 3.10.12 — WBFM Receive" [ref=f10e3534] [cursor=pointer]:
                - /url: https://github.com/gnuradio/gnuradio/blob/v3.10.12.0/gr-analog/python/analog/wfm_rcv.py
              - text: ": parámetros de entrada, demodulación y salida mono."
            - listitem [ref=f10e3535]:
