          - heading "5. Ejecutar y registrar observaciones" [level=2] [ref=f10e3308]
          - list [ref=f10e3309]:
            - listitem [ref=f10e3310]:
              - text: Se verifica que la captura correcta está en
              - code [ref=f10e3311]: samples/
              - text: y que la ruta del
              - code [ref=f10e3312]: File Source
              - text: es relativa.
            - listitem [ref=f10e3313]:
              - text: Se comparan las conexiones y tipos del montaje del estudiante con el grafo de referencia. El
              - code [ref=f10e3314]: ID
              - text: del estudiante se mantiene distinto del de la referencia.
            - listitem [ref=f10e3315]:
              - text: En la referencia,
              - code [ref=f10e3316]: File Source
              - text: y toda la cadena CU8 están activos;
              - code [ref=f10e3317]: Soapy RTLSDR Source
              - text: está desactivado. No se mezclan las dos rutas.
            - listitem [ref=f10e3318]:
              - text: Se ejecuta desde GNU Radio Companion con
              - strong [ref=f10e3319]: F6
              - text: y se aumenta el volumen gradualmente. El contenido de la grabación y la salida de audio del equipo determinan lo que se escucha.
            - listitem [ref=f10e3320]:
              - paragraph [ref=f10e3321]: Se registra cada visor con su eje de frecuencia y se explica la diferencia entre las dos etapas mediante los ítems de la sección 3.
            - listitem [ref=f10e3322]:
              - paragraph [ref=f10e3323]:
                - strong [ref=f10e3324]: "Repetición:"
                - code [ref=f10e3325]: Repeat = Yes
                - text: vuelve al inicio al terminar el archivo. Puede haber una discontinuidad en ese retorno; no representa una nueva observación del entorno RF.
            - listitem [ref=f10e3326]:
              - strong [ref=f10e3327]: "Archivo fijo:"
              - text: cambiar
              - code [ref=f10e3328]: freq
              - text: solo modifica etiquetas en esta ruta. No se recibe otra emisora ni se reescribe la frecuencia central de adquisición.
            - listitem [ref=f10e3329]:
              - strong [ref=f10e3330]: "Expectativa verificable:"
              - text: debe haber muestras en ambas etapas complejas y una salida real a 48 kS/s. La interpretación de la captura y la audición se documentan por separado; no se presume una calidad determinada solo porque el grafo compile.
          - heading "Si solo se dispone de la captura a 2.4 MS/s" [level=3] [ref=f10e3331]
          - paragraph [ref=f10e3332]:
            - text: No se renombra el archivo para hacerlo pasar por la captura de 2.048 MS/s. Se guarda una variante con otro
            - code [ref=f10e3333]: ID
            - text: y se cambian
            - strong [ref=f10e3334]: conjuntamente
            - text: "estos parámetros:"
