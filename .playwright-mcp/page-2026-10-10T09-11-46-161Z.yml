          - list [ref=f10e1318]:
            - listitem [ref=f10e1319]:
              - strong [ref=f10e1320]: "No es tomar una de cada 32 muestras:"
              - text: el bloque realiza resampling con filtrado y relación 3/32. El filtro es necesario para controlar el aliasing al reducir la tasa, como mostró la subsección 4.7.
            - listitem [ref=f10e1321]:
              - strong [ref=f10e1322]: "Configuración automática:"
              - text: en GNU Radio 3.10.12, taps vacíos y
              - code [ref=f10e1323]: Fractional BW = 0
              - text: solicitan el filtro predeterminado, con ancho fraccional 0.4. Para esta reducción, su banda de paso de diseño llega aproximadamente a ±76.8 kHz y la transición hasta ±96 kHz. No es un filtro ideal de corte abrupto.
              - link "Implementación del resampler" [ref=f10e1324] [cursor=pointer]:
                - /url: https://github.com/gnuradio/gnuradio/blob/v3.10.12.0/gr-filter/lib/rational_resampler_impl.cc
              - text: .
            - listitem [ref=f10e1325]:
              - strong [ref=f10e1326]: "Límite del ejemplo:"
              - text: 192 kS/s dan un intervalo nominal de 192 kHz, no una garantía de conservar todo el espectro de cualquier emisión FM. Este montaje es una práctica de recepción mono; no certifica fidelidad de una señal de radiodifusión completa.
