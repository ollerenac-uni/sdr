        - article [ref=f10e175]:
          - 'heading "Laboratorio #2 — Demodulador FM en GNU Radio" [level=1] [ref=f10e176]'
          - paragraph [ref=f10e177]:
            - text: "Esta guía recupera el laboratorio de receptor FM que acompañaba la versión anterior de la sesión. Conserva su cadena principal: captura I/Q a 2.048 MS/s, resampler 3/32,"
            - code [ref=f10e178]: WBFM Receive
            - text: a 192 kS/s y audio mono a 48 kS/s.
          - heading "Objetivos" [level=2] [ref=f10e179]
          - paragraph [ref=f10e180]: "Al finalizar, el estudiante será capaz de:"
          - list [ref=f10e181]:
            - listitem [ref=f10e182]: Reconstruir muestras complejas a partir de un archivo CU8, sin confundir bytes con muestras I/Q.
            - listitem [ref=f10e183]: Calcular y configurar las tasas de las etapas de recepción y de audio.
            - listitem [ref=f10e184]: Relacionar los ejes de los visores con la frecuencia central y con la tasa de cada etapa.
            - listitem [ref=f10e185]: Explicar cómo el cambio de fase entre muestras permite demodular FM.
            - listitem [ref=f10e186]: Implementar la cadena en GNU Radio Companion y distinguir qué operaciones realiza cada bloque.
          - paragraph [ref=f10e187]: La construcción no requiere diseñar los taps de los filtros desde cero. Los bloques se utilizan como sistemas cuyas entradas, salidas y parámetros deben entenderse. El análisis detallado de sus filtros queda para el tema de sistemas y filtrado.
          - heading "Archivos y requisitos" [level=2] [ref=f10e188]
