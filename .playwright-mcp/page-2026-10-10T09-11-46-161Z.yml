              - strong [ref=f10e3448]: "Contenido:"
              - text: aunque ambas capturas documenten 99.1 MHz, no se supone que contengan el mismo instante ni las mismas amplitudes. Ajustar la cadena conserva una interpretación temporal correcta; no convierte una grabación en la otra.
          - heading "6. Extensión opcional con RTL-SDR" [level=2] [ref=f10e3449]
          - paragraph [ref=f10e3450]: "Para recibir en vivo se detiene el grafo y se selecciona una sola ruta:"
          - list [ref=f10e3451]:
            - listitem [ref=f10e3452]:
              - text: Se desactivan los
              - strong [ref=f10e3453]: siete bloques de la ruta CU8
              - text: ":"
              - code [ref=f10e3454]: File Source
              - text: ","
              - code [ref=f10e3455]: Throttle
              - text: ","
              - code [ref=f10e3456]: UChar to Float
              - text: ","
              - code [ref=f10e3457]: Add Const
              - text: ", el"
              - code [ref=f10e3458]: Multiply Const
              - text: de normalización,
              - code [ref=f10e3459]: Deinterleave
              - text: "y"
              - code [ref=f10e3460]: Float to Complex
              - text: . No se desactiva el control de volumen de la salida de audio.
            - listitem [ref=f10e3461]:
              - text: Se activa
              - code [ref=f10e3462]: Soapy RTLSDR Source
              - text: ", que en la referencia está desactivado."
            - listitem [ref=f10e3463]:
              - text: Se mantiene su salida
              - code [ref=f10e3464]: Complex Float32
              - text: ","
              - code [ref=f10e3465]: Sample Rate = samp_rate
              - text: ","
              - code [ref=f10e3466]: Center Frequency = freq
              - text: ", ganancia manual 30 dB y AGC desactivado, como en el grafo."
            - listitem [ref=f10e3467]: Se conecta directamente al resampler y al visor RF; el hardware ya entrega muestras complejas. No se aplica la conversión CU8 a esa salida.
            - listitem [ref=f10e3468]:
              - paragraph [ref=f10e3469]:
                - text: Se ejecuta nuevamente. Los requisitos del dispositivo se revisan en la
                - link "guía de configuración del RTL-SDR" [ref=f10e3470] [cursor=pointer]:
                  - /url: ../../../setup/rtl-sdr/
                - text: .
            - listitem [ref=f10e3471]:
              - paragraph [ref=f10e3472]:
                - strong [ref=f10e3473]: "Clock de adquisición:"
                - text: la fuente de hardware proporciona el ritmo de las muestras. No se añade el
                - code [ref=f10e3474]: Throttle
                - text: de archivo a esa ruta.
            - listitem [ref=f10e3475]:
              - strong [ref=f10e3476]: "Sintonización real:"
              - text: en esta variante,
              - code [ref=f10e3477]: freq
              - text: sí configura la frecuencia central de la fuente Soapy. La variable tiene una función distinta de la que tenía con un archivo fijo.
            - listitem [ref=f10e3478]:
              - strong [ref=f10e3479]: "Comparación válida:"
              - text: pueden variar la señal, la interferencia, el nivel y el ruido respecto a la captura. Se distingue cambiar de fuente de cambiar el procesamiento digital.
          - group [ref=f10e3480]:
            - generic "Comprobación 6.1 — por qué no quedan activas ambas fuentes" [ref=f10e3481] [cursor=pointer]
          - heading "7. Diagnóstico breve" [level=2] [ref=f10e3482]
          - table [ref=f10e3485]:
            - rowgroup [ref=f10e3486]:
              - row [ref=f10e3487]:
                - columnheader "Síntoma" [ref=f10e3488]
                - columnheader "Revisión inicial" [ref=f10e3489]
            - rowgroup [ref=f10e3490]:
              - row [ref=f10e3491]:
                - cell "El grafo no abre el archivo" [ref=f10e3492]
                - cell [ref=f10e3493]:
                  - text: Se comprueban el nombre, la ruta relativa y la presencia de la captura en
                  - code [ref=f10e3494]: samples/
                  - text: .
              - row [ref=f10e3495]:
                - cell "Hay underruns o cortes de audio" [ref=f10e3496]
                - cell [ref=f10e3497]:
                  - text: Se revisan captura,
                  - code [ref=f10e3498]: Throttle = 2*samp_rate
                  - text: en Byte, carga del equipo y tasas de las etapas.
              - row [ref=f10e3499]:
                - cell "Los tiempos o el audio no corresponden" [ref=f10e3500]
                - cell "Se revisa el sample rate documentado; una captura a 2.4 MS/s no se declara a 2.048 MS/s." [ref=f10e3501]
              - row [ref=f10e3502]:
                - cell "Hay espectro, pero no audio" [ref=f10e3503]
                - cell [ref=f10e3504]:
                  - text: Se verifican
                  - code [ref=f10e3505]: Quadrature Rate = 192000
                  - text: ", decimación 4, salida a 48000 y volumen; también la salida de audio del sistema."
              - row [ref=f10e3506]:
                - cell "La señal parece ruido" [ref=f10e3507]
                - cell "Se revisan formato Byte, normalización CU8 y orden de las entradas I y Q." [ref=f10e3508]
              - row [ref=f10e3509]:
                - cell "Las frecuencias RF parecen desplazadas" [ref=f10e3510]
                - cell [ref=f10e3511]:
                  - text: Se comprueba que
                  - code [ref=f10e3512]: freq
                  - text: corresponde a los metadatos; cambiar etiquetas no mezcla muestras.
              - row [ref=f10e3513]:
                - cell "Soapy no abre el dongle" [ref=f10e3514]
                - cell "Se vuelve a la ruta de archivo y se revisan driver y configuración del dispositivo por separado." [ref=f10e3515]
          - heading "Entrega" [level=2] [ref=f10e3516]
          - paragraph [ref=f10e3517]: "El estudiante entrega:"
          - list [ref=f10e3518]:
            - listitem [ref=f10e3519]:
              - text: El
              - code [ref=f10e3520]: .grc
              - text: construido, con un
              - code [ref=f10e3521]: ID
              - text: propio y sin rutas absolutas ni archivos I/Q dentro de Git.
            - listitem [ref=f10e3522]: "La tabla de tasas completada: bytes de entrada, flujos I y Q, flujo complejo, salida del resampler y audio. Cada número se acompaña de su cálculo."
            - listitem [ref=f10e3523]: Una captura de cada visor, identificando la tasa, los bordes nominales, la referencia RF y la posición del canal objetivo.
            - listitem [ref=f10e3524]: Una explicación itemizada de qué hacen la conversión CU8, el resampling, la demodulación y el control de volumen. Se identifica qué etapa deja de tener una salida I/Q.
            - listitem [ref=f10e3525]:
              - text: Una justificación de por qué cambiar
              - code [ref=f10e3526]: freq
              - text: no sintoniza otra señal del archivo. Si se utiliza la variante a 2.4 MS/s o el dongle, se documentan los cambios por separado.
