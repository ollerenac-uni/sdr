            - listitem [ref=f4e812]:
              - strong [ref=f4e813]: "FM didáctica:"
              - text: se utiliza una modulación sinusoidal de fase con índice 1.2 y frecuencia moduladora de 100 kHz para que la variación se vea en esta escala temporal. No es una grabación ni un receptor de radiodifusión completo.
            - listitem [ref=f4e814]:
              - strong [ref=f4e815]: "Límite:"
              - text: centrar no equivale a filtrar, decimar ni demodular. La recuperación del mensaje necesita etapas adicionales.
