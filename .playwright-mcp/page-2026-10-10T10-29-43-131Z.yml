          - heading "5. Ejecutar y registrar observaciones" [level=2] [ref=f48e1050]
          - list [ref=f48e1051]:
            - listitem [ref=f48e1052]: Se comprueban archivo, ruta relativa, sampling rate e ID propio del grafo.
            - listitem [ref=f48e1053]: Se comprueba que la ruta CU8 está activa y Soapy RTLSDR Source está desactivado.
            - listitem [ref=f48e1054]: Se comparan parámetros y conexiones con la referencia de 2.4 MS/s.
            - listitem [ref=f48e1055]: Se ejecuta con F6 y se aumenta el volumen gradualmente.
            - listitem [ref=f48e1056]: Se registra cada visor, con sus ejes y su escala. Se compara el waterfall con la sección 6.3 de la teoría.
            - listitem [ref=f48e1057]:
              - paragraph [ref=f48e1058]: Se explica por separado qué muestra el espectro y qué se escucha en el audio.
            - listitem [ref=f48e1059]:
              - paragraph [ref=f48e1060]: Repeat de valor Yes vuelve al inicio del archivo. Puede aparecer una discontinuidad; no es una adquisición nueva.
            - listitem [ref=f48e1061]: La cadena debe producir muestras complejas a 192 kS/s y audio real a 48 kS/s.
            - listitem [ref=f48e1062]: La compilación no garantiza una calidad de recepción determinada. La audición y las observaciones se documentan por separado.
          - group [ref=f48e1063]:
            - 'generic "Variante anterior: captura a 2.048 MS/s" [ref=f48e1064] [cursor=pointer]'
            - text: 2 ( 2 0 4 8 0 0 0 ) = 4 0 9 6 0 0 0 2 ( 2 0 4 8 0 0 0 ) = 4 0 9 6 0 0 0 2 0 4 8 0 0 0 ( 3 / 3 2 ) = 1 9 2 0 0 0 2 0 4 8 0 0 0 ( 3 / 3 2 ) = 1 9 2 0 0 0
          - heading "6. Extensión opcional con RTL-SDR" [level=2] [ref=f48e1065]
          - list [ref=f48e1066]:
            - listitem [ref=f48e1067]: Se detiene el grafo antes de cambiar la fuente.
            - listitem [ref=f48e1068]: Se desactivan los siete bloques de la ruta CU8, desde File Source hasta Float to Complex. El control de volumen permanece activo.
            - listitem [ref=f48e1069]:
              - text: Se activa Soapy RTLSDR Source con salida
              - code [ref=f48e1070]: Complex Float32
              - text: ","
              - code [ref=f48e1071]: Sample Rate = samp_rate
              - text: "y"
              - code [ref=f48e1072]: Center Frequency = freq
              - text: .
            - listitem [ref=f48e1073]: Se conservan ganancia manual de 30 dB y AGC desactivado, como en la referencia.
            - listitem [ref=f48e1074]: Su salida se conecta al resampler, al Frequency Sink RF y al Waterfall Sink RF.
            - listitem [ref=f48e1075]:
              - paragraph [ref=f48e1076]:
                - text: Se revisa la
                - link "configuración del RTL-SDR" [ref=f48e1077] [cursor=pointer]:
                  - /url: ../../../setup/rtl-sdr/
                - text: y se ejecuta nuevamente.
            - listitem [ref=f48e1078]:
              - paragraph [ref=f48e1079]: La fuente de hardware proporciona el ritmo de adquisición. No se añade Throttle a esa ruta.
            - listitem [ref=f48e1080]:
              - text: En esta variante,
              - code [ref=f48e1081]: freq
              - text: sí configura el receptor. Con el archivo fijo solo modifica las etiquetas de los visores.
            - listitem [ref=f48e1082]: Se pueden recibir señales y niveles distintos. Cambiar de fuente no equivale a cambiar únicamente el procesamiento.
          - group [ref=f48e1083]:
