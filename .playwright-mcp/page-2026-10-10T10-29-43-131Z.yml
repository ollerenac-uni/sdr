        - article [ref=f48e127]:
          - 'heading "Laboratorio #2 — Demodulador FM en GNU Radio" [level=1] [ref=f48e128]'
          - list [ref=f48e129]:
            - listitem [ref=f48e130]: El laboratorio utiliza la misma captura de 2.4 MS/s que S01 y la teoría de S02.
            - listitem [ref=f48e131]: La cadena selecciona la banda central y entrega audio mono a 48 kS/s.
            - listitem [ref=f48e132]: El estudiante observa la captura mediante un espectro y un waterfall. No necesita un dongle.
          - heading "Objetivos" [level=2] [ref=f48e133]
          - list [ref=f48e134]:
            - listitem [ref=f48e135]: Reconstruir muestras complejas desde bytes CU8.
            - listitem [ref=f48e136]: Calcular las tasas de entrada, canal y audio.
            - listitem [ref=f48e137]: Relacionar espectro y waterfall con los metadatos de la captura.
            - listitem [ref=f48e138]: Explicar cómo el giro entre muestras permite demodular FM.
            - listitem [ref=f48e139]: Implementar y verificar la cadena en GNU Radio Companion.
          - paragraph [ref=f48e140]: El diseño detallado de los filtros queda para S03 y S04. Aquí se utilizan bloques con parámetros conocidos y límites explícitos.
          - heading "Archivos y requisitos" [level=2] [ref=f48e141]
