          - heading "4. Del giro entre muestras al audio FM" [level=2] [ref=f48e1029]
          - list [ref=f48e1030]:
            - listitem [ref=f48e1031]:
              - text: La
              - link "teoría de 6.5" [ref=f48e1032] [cursor=pointer]:
                - /url: ../#65-como-permite-fm-recuperar-el-audio
              - text: muestra cómo el mensaje modifica el giro entre muestras.
            - listitem [ref=f48e1033]: WBFM Receive recibe la banda central seleccionada, en formato complejo, y entrega audio mono real.
            - listitem [ref=f48e1034]:
              - text: Se configura
              - strong [ref=f48e1035]:
                - code [ref=f48e1036]: Quadrature Rate = 192000
              - text: "y"
              - strong [ref=f48e1037]:
                - code [ref=f48e1038]: Audio Decimation = 4
              - text: .
            - listitem [ref=f48e1039]:
              - text: Después se conecta Multiply Const de tipo Float, con constante
              - code [ref=f48e1040]: volume
              - text: .
            - listitem [ref=f48e1041]:
              - text: "La salida entra en Audio Sink: una entrada,"
              - code [ref=f48e1042]: Sample Rate = 48000
              - text: "y"
              - code [ref=f48e1043]: OK to Block = No
              - text: .
            - listitem [ref=f48e1044]:
              - code [ref=f48e1045]: volume
              - text: "utiliza QT GUI Range: mínimo 0, máximo 1, paso 0.05 y valor inicial 0.2."
