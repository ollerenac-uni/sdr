            - paragraph [ref=f11e277]:
              - strong [ref=f11e278]: Figura 1.
              - text: Una misma muestra del objetivo antes y después de la mezcla, con sus proyecciones sobre los ejes I y Q.
            - list [ref=f11e280]:
              - listitem [ref=f11e281]: Cada flecha representa una sola muestra del objetivo. La posición horizontal es I; la vertical es Q. Se observa n = 1, no dos instantes distintos.
              - listitem [ref=f11e282]: "Antes: I = 0.500 y Q = 0.866. Después: I = 0.500 y Q = 0.866."
              - listitem [ref=f11e283]: El oscilador suma 0.0° a la fase de esta muestra. Los ejes I y Q siguen siendo perpendiculares; no se elimina su cuadratura.
              - listitem [ref=f11e284]: La longitud de ambas flechas es 1. La mezcla modifica su orientación, no su magnitud.
            - heading "Comprobación" [level=3] [ref=f11e285]
