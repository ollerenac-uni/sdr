              - strong [ref=f11e533]: Figura 3.
              - text: Espectros del bloque completo antes y después de la mezcla; centrar el objetivo no elimina las otras componentes.
            - list [ref=f11e535]:
              - listitem [ref=f11e536]: "Aquí sí aparecen todas las componentes: el objetivo en morado y los otros tonos en gris. Las gráficas I/Q anteriores siguen mostrando solo el objetivo, aislado por construcción."
              - listitem [ref=f11e537]: El centro del objetivo pasa de +400 kHz a +400 kHz. Cada línea vertical es un tono en frecuencia, no un pulso en el tiempo.
              - listitem [ref=f11e538]: El espectro usa un bloque completo de 240 muestras (100 µs); el avance de la muestra seleccionada no cambia ese bloque ni su espectro.
              - listitem [ref=f11e539]: La mezcla no elimina las otras componentes ni selecciona el canal. Para seleccionar una banda todavía hace falta filtrar.
            - heading "Comprobación" [level=3] [ref=f11e540]
