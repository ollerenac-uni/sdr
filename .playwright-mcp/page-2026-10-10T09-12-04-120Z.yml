              - strong [ref=f11e478]: Figura 2.
              - text: Las componentes I y Q del objetivo durante 37 muestras; la línea vertical identifica la muestra del plano I/Q.
            - list [ref=f11e480]:
              - listitem [ref=f11e481]: Las curvas muestran las coordenadas de la flecha durante 37 muestras. Azul corresponde a I y naranja a Q; no son dos emisoras.
              - listitem [ref=f11e482]: La línea vertical señala la muestra que aparece en el plano I/Q. Al avanzar una muestra, los puntos destacados y la flecha cambian juntos.
              - listitem [ref=f11e483]: La frecuencia de salida es +400 kHz. Las muestras de salida siguen girando; todavía no se centró este tono.
              - listitem [ref=f11e484]: Las líneas rectas solo unen las muestras para facilitar la lectura. No representan una nueva señal triangular.
