        - article [ref=f11e175]:
          - heading "Mezcla compleja, muestra por muestra" [level=1] [ref=f11e176]
          - list [ref=f11e177]:
            - listitem [ref=f11e178]:
              - strong [ref=f11e179]: "Propósito:"
              - text: relacionar una misma señal con su flecha en el plano I/Q, sus muestras en el tiempo y su espectro.
            - listitem [ref=f11e180]:
              - strong [ref=f11e181]: "Pregunta principal:"
              - text: ¿por qué un tono de +400 kHz puede quedar como I = 1 y Q = 0 después de centrarlo, y por qué ese resultado no se aplica a cualquier señal?
            - listitem [ref=f11e182]:
              - strong [ref=f11e183]: "Alcance:"
              - text: esta primera demostración desarrolla la
              - link "sección 6.3 de la sesión 2" [ref=f11e184] [cursor=pointer]:
                - /url: ../#63-experimento-b-trasladar-una-componente-al-cero-mediante-mezcla-compleja
              - text: . No necesita dongle ni archivos
              - code [ref=f11e185]: .cu8
              - text: .
          - generic [ref=f11e186]:
            - heading "Recorrido guiado" [level=2] [ref=f11e187]
            - list [ref=f11e188]:
              - listitem [ref=f11e189]:
                - strong [ref=f11e190]: "1. Sin mezcla:"
                - text: al avanzar las muestras, las dos flechas se mueven igual. No se ha cambiado la señal.
              - listitem [ref=f11e191]:
                - strong [ref=f11e192]: "2. Centrar en 0 Hz:"
                - text: la flecha de entrada sigue girando; la de salida queda fija. Se canceló la frecuencia del tono, no la cuadratura entre los ejes I y Q.
              - listitem [ref=f11e193]:
                - strong [ref=f11e194]: "3. Fase de 45°:"
                - text: la salida sigue centrada, pero ahora I y Q son distintas de cero. Centrar no significa eliminar Q.
              - listitem [ref=f11e195]:
                - strong [ref=f11e196]: "4. Con modulación:"
                - text: incluso después de centrar el canal, su flecha y sus componentes siguen cambiando. Esa variación no se elimina con la mezcla.
