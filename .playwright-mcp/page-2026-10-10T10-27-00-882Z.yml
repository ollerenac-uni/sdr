                      - generic [ref=f42e15008]: "90"
                      - generic [ref=f42e15009]: ∘
                    - generic [ref=f42e15010]: "n"
              - text: . Las flechas resultantes retroceden 45° entre muestras.
              - list [ref=f42e15011]:
                - listitem [ref=f42e15012]: Las flechas opuestas se cancelan al sumarlas.
            - listitem [ref=f42e15013]:
              - strong [ref=f42e15014]: "E — Suma de la prueba de 2 kHz:"
              - text: el recorrido vuelve al inicio. La suma vale cero y la barra también.
              - list [ref=f42e15015]:
                - listitem [ref=f42e15016]: C y E usan la misma escala. Los ejes representan la parte real e imaginaria de la suma acumulada, no tiempo.
          - paragraph [ref=f42e15017]:
            - strong [ref=f42e15018]: El espectro reúne todas las pruebas. Cada barra indica cuánto mide la suma correspondiente, dividida entre ocho.
          - paragraph [ref=f42e15019]:
            - img "Espectro del tono de 1 kHz con ocho frecuencias de prueba y una sola barra de altura uno" [ref=f42e15020]
          - paragraph [ref=f42e15021]:
            - strong [ref=f42e15022]: Figura 16.
            - text: Las ocho pruebas del tono de 1 kHz dan una barra de altura 1 y siete resultados cero.
          - list [ref=f42e15023]:
            - listitem [ref=f42e15024]: El eje horizontal muestra las frecuencias de prueba. El vertical muestra la longitud de cada suma dividida entre ocho.
            - listitem [ref=f42e15025]: La línea naranja marca el tono generado. La barra coincidente vale 1; las demás sumas se cancelan.
            - listitem [ref=f42e15026]: Las frecuencias negativas indican el sentido contrario de giro. El apartado 5.3 explica cómo se ordena este eje.
          - paragraph [ref=f42e15027]:
            - strong [ref=f42e15028]: Ahora cambia solo la entrada, a 1.5 kHz. La prueba de 1 kHz deja flechas que todavía giran; su suma ya no mide ocho.
          - paragraph [ref=f42e15029]:
            - img "Tono de 1.5 kHz antes y después del giro de prueba, suma abierta y espectro con varias barras" [ref=f42e15030]
          - paragraph [ref=f42e15031]:
            - strong [ref=f42e15032]: Figura 17.
            - text: Un tono de 1.5 kHz produce una suma de longitud aproximada 5.126 al probar 1 kHz; su barra mide aproximadamente 0.641.
          - list [ref=f42e15033]:
            - listitem [ref=f42e15034]:
              - strong [ref=f42e15035]: "A — Nueva entrada:"
              - text: las ocho flechas azules avanzan 67.5° entre muestras. Los ejes siguen siendo I y Q.
            - listitem [ref=f42e15036]:
