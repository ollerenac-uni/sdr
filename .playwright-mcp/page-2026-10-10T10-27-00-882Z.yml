          - 'heading "4.7. Experimento F: el filtro debe actuar antes de perder la distinción" [level=4] [ref=f42e13573]'
          - paragraph [ref=f42e13574]:
            - text: El filtrado anti-aliasing atenúa las componentes que se confundirían con la banda de interés. Debe actuar
            - strong [ref=f42e13575]: antes
            - text: del muestreo que genera la superposición. El
            - link "MIT, en su lección sobre muestreo" [ref=f42e13576] [cursor=pointer]:
              - /url: https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/resources/mit6_003f11_lec22/
            - text: ", muestra ese orden tanto para muestreo continuo como para cambios de tasa en tiempo discreto."
          - paragraph [ref=f42e13577]: "Si la operación es un ADC, el filtrado previo es analógico. Si se reduce el sample rate de una secuencia ya adquirida, el filtrado previo puede ser digital: se aplica antes de descartar muestras. Diseñar esos filtros corresponde a la siguiente sesión; aquí se observa por qué hacen falta."
