            - listitem [ref=f42e17116]: Rectangular asigna peso 1 a todas las muestras. Hann reduce principalmente los pesos próximos a los extremos del bloque.
            - listitem [ref=f42e17117]:
              - strong [ref=f42e17118]: "Qué cambia:"
              - text: los pesos. Las muestras adquiridas, sus instantes y la frecuencia del tono permanecen fijos.
          - paragraph [ref=f42e17119]: Hann cambia las longitudes de las flechas antes de sumarlas. Algunas sumas lejanas se cierran mejor, pero las cercanas pueden quedar más largas.
          - paragraph [ref=f42e17120]:
            - img "Pesos rectangular y Hann y tres comparaciones de recorridos normalizados con iguales escalas para media, dos y media y cuatro y media vueltas sobrantes" [ref=f42e17121]
          - paragraph [ref=f42e17122]:
            - strong [ref=f42e17123]: Figura 22.
            - text: "Hann cambia los pesos y las sumas: reduce estas contribuciones lejanas, pero aumenta la contribución de la prueba cercana."
          - paragraph [ref=f42e17124]:
            - strong [ref=f42e17125]: "Panel A — pesos:"
          - list [ref=f42e17126]:
            - listitem [ref=f42e17127]: "El eje horizontal indica la muestra; el vertical indica su peso. Azul: rectangular; naranja: Hann."
            - listitem [ref=f42e17128]: Hann reduce las flechas de los extremos antes de sumar. No cambia cuándo se adquirieron las muestras.
          - paragraph [ref=f42e17129]:
            - strong [ref=f42e17130]: "Panel B — 0.5 vueltas sobrantes:"
          - list [ref=f42e17131]:
            - listitem [ref=f42e17132]: Los recorridos suman flechas punta con cola. Cada recorrido se divide por la suma de sus pesos para comparar magnitudes.
            - listitem [ref=f42e17133]: El punto negro marca el inicio; el cuadrado marca el final. La magnitud normalizada pasa de aproximadamente 0.637 a 0.849.
          - paragraph [ref=f42e17134]:
            - strong [ref=f42e17135]: "Panel C — 2.5 vueltas sobrantes:"
          - list [ref=f42e17136]:
            - listitem [ref=f42e17137]: Los ejes y colores son los mismos que en B. La suma con Hann termina más cerca del inicio.
            - listitem [ref=f42e17138]: La magnitud pasa de aproximadamente 0.128 a 0.024. La contribución de esta prueba disminuye.
          - paragraph [ref=f42e17139]:
            - strong [ref=f42e17140]: "Panel D — 4.5 vueltas sobrantes:"
          - list [ref=f42e17141]:
            - listitem [ref=f42e17142]: La suma con Hann termina aún más cerca del inicio. Los ejes mantienen la misma escala, aunque los recorridos ocupan menos espacio.
            - listitem [ref=f42e17143]: La magnitud pasa de aproximadamente 0.071 a 0.004. No se propone una regla de disminución para cualquier frecuencia.
          - paragraph [ref=f42e17144]:
            - strong [ref=f42e17145]: "Colab — pesos y sumas:"
