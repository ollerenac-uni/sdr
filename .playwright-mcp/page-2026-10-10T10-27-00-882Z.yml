              - listitem [ref=f42e6913]: La subsección 4.6 explica por qué ambos extremos representan la misma frecuencia discreta.
          - paragraph [ref=f42e6914]: Las dos componentes del coseno describen una sola senoide real. No significan que existan dos emisoras. En general, un pico representa una componente frecuencial; identificar su origen requiere más información.
          - paragraph [ref=f42e6915]:
            - strong [ref=f42e6916]: "Colab — Celda 1: preparar las señales y el visor de frecuencia."
            - text: Las cinco celdas de esta subsección se ejecutan en orden y pueden comenzar en un notebook nuevo.
          - generic [ref=f42e6918]:
