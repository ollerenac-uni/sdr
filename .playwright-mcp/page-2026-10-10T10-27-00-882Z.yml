            - strong [ref=f42e17163]: "Panel A — rectangular:"
          - list [ref=f42e17164]:
            - listitem [ref=f42e17165]: "Los ejes muestran frecuencia y magnitud en dB. Azul: fuerte solo; naranja discontinua: ambos tonos."
