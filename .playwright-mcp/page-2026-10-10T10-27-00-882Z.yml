            - list [ref=f42e6686]:
              - listitem [ref=f42e6687]: Las dos componentes distintas corresponden al coseno de 1 kHz del ejemplo.
              - listitem [ref=f42e6688]: En DC, las frecuencias positiva y negativa coinciden en 0 Hz. Sus coeficientes se suman.
