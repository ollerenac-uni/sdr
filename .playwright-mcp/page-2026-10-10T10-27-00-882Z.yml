            - code [ref=f42e16756]: "import numpy as np import matplotlib.pyplot as plt fs = 8000 N = 64 n = np.arange(N) t = n / fs T_obs = N / fs f0 = 1062.5 tono = np.exp(1j * 2 * np.pi * f0 * t) pruebas = np.array([875, 1000, 1125, 1250]) vueltas_sobrantes = (f0 - pruebas) * T_obs productos_pruebas = tono[None, :] * np.exp(-1j * 2 * np.pi * pruebas[:, None] * t) sumas_pruebas = np.sum(productos_pruebas, axis=1) barras_pruebas = np.abs(sumas_pruebas) / N frecuencias = np.fft.fftshift(np.fft.fftfreq(N, d=1 / fs)) C_leakage = np.fft.fftshift(np.fft.fft(tono)) / N colores = [\"tab:purple\", \"tab:blue\", \"tab:orange\", \"tab:green\"] fig = plt.figure(figsize=(13, 8), layout=\"constrained\") gs = fig.add_gridspec(2, 4) for i, (prueba, productos, vueltas, color) in enumerate(zip(pruebas, productos_pruebas, vueltas_sobrantes, colores)): ax = fig.add_subplot(gs[0, i]) camino = np.r_[0j, np.cumsum(productos)] ax.quiver(camino[:-1].real, camino[:-1].imag, productos.real, productos.imag, angles=\"xy\", scale_units=\"xy\", scale=1, color=color, width=0.008) ax.annotate(\"\", xy=(camino[-1].real, camino[-1].imag), xytext=(0, 0), arrowprops={\"arrowstyle\": \"->\", \"color\": \"tab:red\", \"lw\": 2}) ax.plot(0, 0, \"ko\", markersize=4) ax.plot(camino[-1].real, camino[-1].imag, \"s\", color=\"tab:red\", markersize=4) ax.annotate(\"Final\", xy=(camino[-1].real, camino[-1].imag), xytext=(7, 0), textcoords=\"offset points\", color=\"tab:red\", fontsize=8) ax.set(title=f\"{'ABCD'[i]}. Prueba: {prueba:g} Hz\\n{vueltas:+g} vueltas sobrantes\\nBarra = {barras_pruebas[i]:.3f}\", xlabel=\"Suma: parte real\", ylabel=\"Suma: parte imaginaria\", xlim=(-24, 24), ylim=(-44, 44)) ax.set_aspect(\"equal\") ax.grid(alpha=0.2) ax = fig.add_subplot(gs[1, :]) ax.stem(frecuencias, np.abs(C_leakage), linefmt=\"0.6\", markerfmt=\".\", basefmt=\" \") for prueba, barra, color, letra in zip(pruebas, barras_pruebas, colores, \"ABCD\"): ax.vlines(prueba, 0, barra, color=color, linewidth=3) ax.plot(prueba, barra, \"o\", color=color) ax.text(prueba, barra + 0.025, letra, ha=\"center\", color=color, weight=\"bold\") ax.axvline(f0, color=\"0.4\", linestyle=\"--\", label=\"Tono generado: 1062.5 Hz\") ax.set(title=\"E. Las barras pertenecen al mismo tono\", xlabel=\"Frecuencia de prueba (Hz)\", ylabel=\"Longitud de la suma / 64\", xlim=(650, 1475), ylim=(-0.02, 0.85)) ax.legend(loc=\"upper right\") ax.grid(alpha=0.2) plt.show() for prueba, vueltas, barra in zip(pruebas, vueltas_sobrantes, barras_pruebas): print(f\"Prueba {prueba:g} Hz: {vueltas:+g} vueltas sobrantes; barra={barra:.6f}\")"
