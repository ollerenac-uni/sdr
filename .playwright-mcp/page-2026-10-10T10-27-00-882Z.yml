          - paragraph [ref=f42e13747]: Después se conserva una de cada tres muestras, para obtener 8 kS/s. En esa nueva tasa, +9 kHz y +1 kHz coinciden. Con las fases elegidas, ambas contribuciones se suman en +1 kHz y la magnitud pasa de 1 a 1.6.
          - paragraph [ref=f42e13748]:
            - text: "Se compara con un segundo camino: un filtro ideal previo conserva el tono de +1 kHz y elimina el de +9 kHz. Para aislar la idea, su salida se escribe directamente usando el tono conocido."
            - strong [ref=f42e13749]: No se implementa un filtro real ni se calcula su respuesta en este snippet.
          - paragraph [ref=f42e13750]:
            - strong [ref=f42e13751]: "Qué se varía:"
            - text: la presencia o ausencia de filtrado antes de reducir la tasa.
            - strong [ref=f42e13752]: "Qué permanece fijo:"
            - text: señal de entrada, tasa inicial de 24 kS/s, tasa final de 8 kS/s y duración de 8 ms.
            - strong [ref=f42e13753]: "Qué se debe notar:"
            - text: después de la superposición ya no hay dos picos que un filtro pueda separar.
          - paragraph [ref=f42e13754]:
            - strong [ref=f42e13755]: "Colab — Celda 7: comparar ambos caminos."
          - generic [ref=f42e13757]:
            - navigation [ref=f42e13758]:
              - button "Copiar al portapapeles" [ref=f42e13759] [cursor=pointer]
            - code [ref=f42e13760]: "fs_alta = 24000 fs_baja = 8000 factor = fs_alta // fs_baja th = np.arange(192) / fs_alta deseada = np.exp(1j * 2 * np.pi * 1000 * th) interferente = 0.6 * np.exp(1j * 2 * np.pi * 9000 * th) entrada = deseada + interferente salida_filtro_ideal = deseada # Modelo: elimina por completo el tono de 9 kHz. sin_filtro = entrada[::factor] con_filtro = salida_filtro_ideal[::factor] tb = np.arange(len(sin_filtro)) / fs_baja print(\"Sin filtro, se obtiene 1.6 veces el tono deseado:\", np.allclose(sin_filtro, 1.6 * con_filtro)) fig, axes = plt.subplots(2, 2, figsize=(12, 8), layout=\"constrained\") casos = [(entrada, fs_alta, \"Entrada: dos tonos a 24 kS/s\"), (salida_filtro_ideal, fs_alta, \"Después del filtro ideal, antes de reducir la tasa\"), (sin_filtro, fs_baja, \"Reducir a 8 kS/s SIN filtro: los tonos se suman\")] for ax, (y, tasa, titulo) in zip([axes[0, 0], axes[0, 1], axes[1, 0]], casos): f, C = espectro(y, tasa) ax.stem(f / 1000, np.abs(C), basefmt=\" \") ax.set(title=titulo, xlabel=\"Frecuencia (kHz)\", ylabel=\"Magnitud por componente\", xlim=(-12.2, 12.2), ylim=(-0.03, 1.85)) ax.axvspan(-4, 4, color=\"tab:green\", alpha=0.08, label=\"Banda representativa de la tasa final\") ax.legend(fontsize=8, loc=\"upper left\") axes[1, 1].plot(tb[:17] * 1000, sin_filtro.real[:17], \"o-\", label=\"I sin filtro: amplitud 1.6\") axes[1, 1].plot(tb[:17] * 1000, con_filtro.real[:17], \"s-\", label=\"I con filtro previo: amplitud 1\", markerfacecolor=\"white\") axes[1, 1].set(title=\"Salidas a 8 kS/s: misma frecuencia, distinto resultado\", xlabel=\"Tiempo (ms)\", ylabel=\"I\", ylim=(-1.85, 1.85)) axes[1, 1].legend(fontsize=8) for ax in axes.flat: ax.grid(alpha=0.2) plt.show()"
          - paragraph [ref=f42e13761]:
            - img "Dos tonos separados a 24 kS/s, eliminación ideal previa del tono de 9 kHz y superposición en 1 kHz al reducir sin filtro a 8 kS/s" [ref=f42e13762]
          - paragraph [ref=f42e13763]:
            - strong [ref=f42e13764]: Figura 14.
            - text: El filtrado previo evita que una componente fuera de la banda se superponga al tono que se desea conservar al reducir el sample rate.
          - list [ref=f42e13765]:
            - listitem [ref=f42e13766]:
              - strong [ref=f42e13767]: "Panel superior izquierdo — entrada a la tasa inicial:"
              - text: +1 y +9 kHz se distinguen porque ambos están dentro del intervalo disponible.
            - listitem [ref=f42e13768]:
              - strong [ref=f42e13769]: "Panel superior derecho — filtrado previo ideal:"
              - text: solo queda +1 kHz. Esta eliminación ocurre
              - strong [ref=f42e13770]: antes
              - text: de reducir la tasa a 8 kS/s.
            - listitem [ref=f42e13771]:
              - strong [ref=f42e13772]: "Panel inferior izquierdo — reducción sin filtro:"
              - text: aparece una sola componente de magnitud 1.6 en +1 kHz. El tono de +9 kHz ya se superpuso al de +1 kHz.
            - listitem [ref=f42e13773]:
              - strong [ref=f42e13774]: "Eje del panel inferior izquierdo:"
              - text: solo hay bins entre −4 y +4 kHz. El resto del eje se mantiene para comparar las posiciones con la entrada.
            - listitem [ref=f42e13775]:
              - strong [ref=f42e13776]: "Panel inferior derecho — comparación de las salidas:"
              - text: ambas secuencias tienen la misma tasa final. Con filtrado previo, I conserva el tono de magnitud 1; sin filtrado, muestra el resultado de la superposición.
            - listitem [ref=f42e13777]:
              - strong [ref=f42e13778]: "FFT de la salida filtrada:"
              - text: tendría un pico de magnitud 1 en +1 kHz. La diferencia con la salida sin filtro se debe al procesamiento previo, no a la tasa final, que es igual en ambos casos.
            - listitem [ref=f42e13779]:
              - strong [ref=f42e13780]: "Por qué un filtro posterior no separa los tonos:"
              - text: si deja pasar +1 kHz, también deja pasar la contribución aliased. Ambas ocupan la misma frecuencia.
            - listitem [ref=f42e13781]:
              - strong [ref=f42e13782]: "Por qué la magnitud es 1.6:"
              - text: depende de las amplitudes y fases elegidas. En otro caso, las contribuciones podrían reforzarse menos o cancelarse.
            - listitem [ref=f42e13783]:
              - strong [ref=f42e13784]: "Qué no constituye una solución general:"
              - text: dividir por 1.6 funciona para esta simulación conocida, pero no permite deshacer aliasing en una captura desconocida de forma general.
          - heading "4.8. Qué conclusiones se aplican a una captura SDR" [level=4] [ref=f42e13785]
          - paragraph [ref=f42e13786]:
            - text: La tasa de la secuencia I/Q determina el intervalo representativo de
            - strong [ref=f42e13787]: esa etapa
            - text: ". No significa que la RF de la antena se muestree directamente a la tasa del archivo: el receptor incluye conversión de frecuencia, filtrado y cambios de tasa, como se presentó en la sesión 1. La relación entre baseband y RF se retomará en la subsección 6."
          - paragraph [ref=f42e13788]: "Para interpretar los experimentos conviene distinguir tres operaciones:"
          - list [ref=f42e13789]:
            - listitem [ref=f42e13790]:
              - strong [ref=f42e13791]: "Adquirir de nuevo con otro sample rate:"
              - text: cambia los instantes en los que se observa la señal. Puede evitar aliasing si la banda de entrada y el filtrado son apropiados.
            - listitem [ref=f42e13792]:
              - strong [ref=f42e13793]: "Reducir la tasa descartando muestras:"
              - text: puede crear aliasing nuevo. Requiere filtrado previo respecto a la tasa de salida.
            - listitem [ref=f42e13794]:
              - strong [ref=f42e13795]: "Cambiar solo la etiqueta de sample rate de un archivo:"
              - text: cambia la interpretación de sus ejes, pero no obtiene información nueva ni revierte aliasing.
          - group [ref=f42e13796]:
