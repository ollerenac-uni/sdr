          - 'heading "5.2. Cada bin prueba una frecuencia: girar hacia atrás y sumar" [level=4] [ref=f42e14866]'
          - list [ref=f42e14867]:
            - listitem [ref=f42e14868]:
              - strong [ref=f42e14869]: "Propósito:"
              - text: ver cómo las muestras producen una barra del espectro.
            - listitem [ref=f42e14870]: Cada muestra compleja es una flecha en el plano I/Q, como en 2.3.
            - listitem [ref=f42e14871]:
              - text: Un
              - strong [ref=f42e14872]: bin
              - text: es una posición de salida asociada a una frecuencia de prueba.
            - listitem [ref=f42e14873]:
              - text: Para probarla, el cálculo gira cada flecha en sentido contrario al giro de prueba. Después suma las flechas
              - strong [ref=f42e14874]: punta con cola
              - text: .
            - listitem [ref=f42e14875]: La flecha desde el inicio hasta el final del recorrido representa la suma. La barra muestra su longitud dividida entre las muestras utilizadas.
            - listitem [ref=f42e14876]:
