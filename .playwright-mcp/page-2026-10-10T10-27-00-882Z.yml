            - code [ref=f42e17150]: "import numpy as np import matplotlib.pyplot as plt N, fs = 64, 8000 n = np.arange(N) w_rect = np.ones(N) w_hann = 0.5 - 0.5 * np.cos(2 * np.pi * n / N) recorridos = {} fig, axes = plt.subplots(2, 2, figsize=(12, 9), layout=\"constrained\") axes[0, 0].plot(n, w_rect, label=\"Rectangular\") axes[0, 0].plot(n, w_hann, label=\"Hann\") axes[0, 0].set(title=\"A. Pesos de las 64 muestras\", xlabel=\"Índice n\", ylabel=\"Peso\", ylim=(-0.05, 1.15)) axes[0, 0].legend() for ax, letra, vueltas in zip([axes[0, 1], axes[1, 0], axes[1, 1]], \"BCD\", [0.5, 2.5, 4.5]): for nombre, w, color in [(\"Rectangular\", w_rect, \"tab:blue\"), (\"Hann\", w_hann, \"tab:orange\")]: flechas = w * np.exp(1j * 2 * np.pi * vueltas * n / N) / w.sum() p = np.r_[0j, np.cumsum(flechas)] recorridos[(vueltas, nombre)] = p ax.plot(p.real, p.imag, color=color, label=f\"{nombre}: {abs(p[-1]):.3f}\") ax.plot([0, p[-1].real], [0, p[-1].imag], \"--\", color=color, alpha=0.7) ax.plot(p[-1].real, p[-1].imag, \"s\", color=color) for k in range(0, N, 8): ax.annotate(\"\", xy=(p[k + 1].real, p[k + 1].imag), xytext=(p[k].real, p[k].imag), arrowprops={\"arrowstyle\": \"->\", \"color\": color}) ax.plot(0, 0, \"ko\") ax.set(title=f\"{letra}. {vueltas:g} vueltas sobrantes\", xlabel=\"Parte real de la suma normalizada\", ylabel=\"Parte imaginaria\", aspect=\"equal\", xlim=(-0.57, 0.57), ylim=(-0.17, 0.97)) ax.legend(fontsize=9, loc=\"upper right\") for ax in axes.flat: ax.grid(alpha=0.2) plt.show()"
