            - code [ref=f42e6936]: "casos = [(x_real, \"Coseno real\", False), (z_pos, \"Tono complejo de +1 kHz\", True), (z_neg, \"Tono complejo de -1 kHz\", True)] fig, axes = plt.subplots(3, 2, figsize=(12, 9), layout=\"constrained\") for fila, (y, titulo, complejo) in enumerate(casos): axes[fila, 0].plot(t[visible] * 1000, y.real[visible], \".-\", label=\"I\" if complejo else \"x[n]\") if complejo: axes[fila, 0].plot(t[visible] * 1000, y.imag[visible], \"s-\", label=\"Q\", markerfacecolor=\"white\") axes[fila, 0].set(title=titulo, xlabel=\"Tiempo (ms)\", ylabel=\"Amplitud\", ylim=(-1.2, 1.2)) axes[fila, 0].legend() f, C = espectro(y, fs) axes[fila, 1].stem(f / 1000, np.abs(C), basefmt=\" \") axes[fila, 1].set(title=\"Componentes en frecuencia\", xlabel=\"Frecuencia (kHz)\", ylabel=\"Magnitud por componente\", xlim=(-3, 3), ylim=(-0.04, 1.15)) for ax in axes[fila]: ax.grid(alpha=0.2) plt.show()"
