          - heading "Síntesis visual — de las muestras al análisis y al audio" [level=2] [ref=f42e19743]
          - heading "Una señal, cuatro vistas" [level=3] [ref=f42e19744]
          - paragraph [ref=f42e19745]: Las muestras, el plano I/Q y el espectro describen aspectos distintos de la señal.
          - paragraph [ref=f42e19746]:
            - link "Abrir la imagen en otra pestaña" [ref=f42e19747] [cursor=pointer]:
              - /url: figures/sintesis-muestras-representaciones.png
          - paragraph [ref=f42e19748]:
            - img "Muestras I/Q, posiciones en el plano complejo, FFT compleja y FFT de solo I para un tono de más 1 kHz" [ref=f42e19749]
          - paragraph [ref=f42e19750]:
            - strong [ref=f42e19751]: Figura 30.
            - text: Las cuatro vistas relacionan las muestras y el espectro; usar solo I cambia la señal analizada.
          - paragraph [ref=f42e19752]:
            - strong [ref=f42e19753]: "Panel A — tiempo:"
          - list [ref=f42e19754]:
            - listitem [ref=f42e19755]: I y Q corresponden a las mismas 16 muestras. El sampling rate de 8 kS/s sitúa cada muestra en el tiempo.
            - listitem [ref=f42e19756]:
              - text: El bloque representa
