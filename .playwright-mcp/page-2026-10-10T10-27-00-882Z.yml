            - text: .
          - paragraph [ref=f42e6929]: Los tonos elegidos completan un número entero de ciclos en el bloque. Así sus componentes se observan en puntos de frecuencia concretos y sus alturas coinciden con la tabla. Otras elecciones pueden distribuir un tono entre varios puntos; ese efecto se estudiará en la subsección 5.
          - paragraph [ref=f42e6930]:
            - strong [ref=f42e6931]: "Colab — Celda 2: comparar el tiempo y la frecuencia."
          - generic [ref=f42e6933]:
