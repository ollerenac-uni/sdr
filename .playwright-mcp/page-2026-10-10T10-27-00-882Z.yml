            - code [ref=f42e9390]: "x1 = np.cos(2 * np.pi * 1000 * t) x9 = np.cos(2 * np.pi * 9000 * t) td = np.linspace(0, 0.001, 2001) visible = t <= 0.001 print(\"Las muestras coinciden:\", np.allclose(x1, x9)) print(\"Error máximo:\", np.max(np.abs(x1 - x9))) fig, axes = plt.subplots(3, 1, figsize=(11, 9), layout=\"constrained\") for ax, frecuencia, muestras in zip(axes[:2], [1000, 9000], [x1, x9]): ax.plot(td * 1000, np.cos(2 * np.pi * frecuencia * td), color=\"tab:gray\", label=\"Referencia continua conocida\") ax.plot(t[visible] * 1000, muestras[visible], \"o\", color=\"tab:blue\", label=\"Muestras a 8 kS/s\") ax.set(title=f\"Señal original: {frecuencia / 1000:g} kHz\", xlabel=\"Tiempo (ms)\", ylabel=\"Amplitud\", ylim=(-1.2, 1.2)) ax.legend(loc=\"upper right\") axes[2].plot(n[:17], x1[:17], \"o\", markersize=8, label=\"Muestras del coseno de 1 kHz\") axes[2].plot(n[:17], x9[:17], \"s\", markerfacecolor=\"none\", markersize=10, label=\"Muestras del coseno de 9 kHz\") axes[2].set(title=\"Solo se conservan estas secuencias: los marcadores se superponen\", xlabel=\"Índice n\", ylabel=\"Valor de la muestra\", xticks=np.arange(0, 17, 2), ylim=(-1.2, 1.2)) axes[2].legend(loc=\"upper right\") for ax in axes: ax.grid(alpha=0.2) plt.show()"
