          - heading "6.2. ¿Por qué cambia el espectro entre bloques?" [level=4] [ref=f42e18537]
          - list [ref=f42e18538]:
            - listitem [ref=f42e18539]:
              - strong [ref=f42e18540]: "Qué cambia:"
              - text: se compara un bloque con el promedio de 200 bloques consecutivos.
            - listitem [ref=f42e18541]:
              - strong [ref=f42e18542]: "Qué permanece fijo:"
              - text: captura, ventana Hann, 4096 muestras por bloque y escalas de los paneles.
            - listitem [ref=f42e18543]:
              - strong [ref=f42e18544]: "Qué se observa:"
              - text: el promedio reduce la variación entre bloques; no estrecha los detalles que cada bloque puede distinguir.
            - listitem [ref=f42e18545]: Cada bloque representa unos 1.707 ms. Los 200 bloques representan unos 341.333 ms.
            - listitem [ref=f42e18546]:
              - text: "Se promedia la potencia lineal: primero"
