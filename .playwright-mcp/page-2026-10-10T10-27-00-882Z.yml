            - code [ref=f42e15970]: "import numpy as np import matplotlib.pyplot as plt fs = 8000 n8 = np.arange(8) tono8 = np.exp(1j * 2 * np.pi * 1000 * n8 / fs) referencias = {k: np.exp(1j * 2 * np.pi * k * n8 / 8) for k in [1, 2]} productos_bin1 = tono8 * np.conj(referencias[1]) productos_bin2 = tono8 * np.conj(referencias[2]) def flechas(ax, valores, titulo): origen = np.zeros(len(valores)) ax.quiver(origen, origen, valores.real, valores.imag, angles=\"xy\", scale_units=\"xy\", scale=1, color=\"tab:blue\", width=0.012) for n, z in enumerate(valores): if np.allclose(valores, valores[0]): break ax.text(1.18 * z.real, 1.18 * z.imag, str(n), ha=\"center\", va=\"center\", fontsize=9) if np.allclose(valores, valores[0]): ax.text(0, -0.6, f\"{len(valores)} flechas superpuestas\", ha=\"center\", fontsize=9) ax.set(title=titulo, xlabel=\"Parte real\", ylabel=\"Parte imaginaria\", xlim=(-1.45, 1.45), ylim=(-1.45, 1.45)) ax.set_aspect(\"equal\") ax.axhline(0, color=\"0.8\", linewidth=0.7) ax.axvline(0, color=\"0.8\", linewidth=0.7) ax.grid(alpha=0.2) def suma_flechas(ax, valores, titulo): camino = np.r_[0j, np.cumsum(valores)] ax.quiver(camino[:-1].real, camino[:-1].imag, valores.real, valores.imag, angles=\"xy\", scale_units=\"xy\", scale=1, color=\"tab:blue\", width=0.008) ax.plot(camino.real, camino.imag, \".\", color=\"tab:blue\") ax.annotate(\"\", xy=(camino[-1].real, camino[-1].imag), xytext=(0, 0), arrowprops={\"arrowstyle\": \"->\", \"color\": \"tab:red\", \"lw\": 2.5}) ax.plot(0, 0, \"ko\", markersize=4) ax.set(title=f\"{titulo}\\nLongitud de la suma = {abs(camino[-1]):.3f}\", xlabel=\"Suma acumulada: parte real\", ylabel=\"Suma acumulada: parte imaginaria\", xlim=(-1, 9), ylim=(-4, 6)) ax.set_aspect(\"equal\") ax.grid(alpha=0.2) return camino fig = plt.figure(figsize=(13, 8), layout=\"constrained\") gs = fig.add_gridspec(2, 3) ax_entrada = fig.add_subplot(gs[0, 0]) flechas(ax_entrada, tono8, \"A. Entrada: tono de 1 kHz\") ax_entrada.set(xlabel=\"I\", ylabel=\"Q\") ax_instruccion = fig.add_subplot(gs[1, 0]) ax_instruccion.axis(\"off\") ax_instruccion.text(0.05, 0.85, \"Misma entrada en ambas pruebas\\n\\n1. Girar cada muestra hacia atrás.\\n2. Sumar punta con cola.\\n3. Medir la resultante roja.\\n4. Dividir esa longitud entre ocho.\", va=\"top\", fontsize=11, linespacing=1.8) flechas(fig.add_subplot(gs[0, 1]), productos_bin1, \"B. Prueba de 1 kHz: restar 45° × n\") camino_bin1 = suma_flechas(fig.add_subplot(gs[0, 2]), productos_bin1, \"C. Punta con cola: prueba de 1 kHz\") flechas(fig.add_subplot(gs[1, 1]), productos_bin2, \"D. Prueba de 2 kHz: restar 90° × n\") camino_bin2 = suma_flechas(fig.add_subplot(gs[1, 2]), productos_bin2, \"E. Punta con cola: prueba de 2 kHz\") plt.show() frecuencias8 = np.fft.fftshift(np.fft.fftfreq(8, d=1 / fs)) C_bin_alineado = np.fft.fft(tono8) / 8 sumas_directas = np.array([np.sum(tono8 * np.exp(-1j * 2 * np.pi * f * n8 / fs)) for f in frecuencias8]) np.testing.assert_allclose(sumas_directas, np.fft.fftshift(np.fft.fft(tono8)), atol=1e-12) fig, ax = plt.subplots(figsize=(10, 4), layout=\"constrained\") ax.stem(frecuencias8 / 1000, np.abs(sumas_directas) / 8, basefmt=\" \") ax.axvline(1, color=\"tab:orange\", linestyle=\"--\", label=\"Frecuencia del tono generado: 1 kHz\") ax.set(xlabel=\"Frecuencia de prueba (kHz)\", ylabel=\"Longitud de la suma / 8\", xticks=np.arange(-4, 4), ylim=(-0.03, 1.2)) ax.legend() ax.grid(alpha=0.2) plt.show() tono_entre_bins = np.exp(1j * 2 * np.pi * 1500 * n8 / fs) productos_intermedio = tono_entre_bins * np.conj(referencias[1]) C_bin_intermedio = np.fft.fft(tono_entre_bins) / 8 fig, axes = plt.subplots(2, 2, figsize=(11, 9), layout=\"constrained\") flechas(axes[0, 0], tono_entre_bins, \"A. Entrada: tono de 1.5 kHz\") axes[0, 0].set(xlabel=\"I\", ylabel=\"Q\") flechas(axes[0, 1], productos_intermedio, \"B. Prueba de 1 kHz: restar 45° × n\") camino_intermedio = suma_flechas(axes[1, 0], productos_intermedio, \"C. Punta con cola\") axes[1, 1].stem(frecuencias8 / 1000, np.abs(np.fft.fftshift(C_bin_intermedio)), basefmt=\" \") axes[1, 1].axvline(1.5, color=\"tab:orange\", linestyle=\"--\", label=\"Frecuencia del tono generado\") axes[1, 1].set(title=\"D. La misma entrada en todas las pruebas\", xlabel=\"Frecuencia de prueba (kHz)\", ylabel=\"Longitud de la suma / 8\", xticks=np.arange(-4, 4), ylim=(-0.03, 1.2)) axes[1, 1].legend(fontsize=8) axes[1, 1].grid(alpha=0.2) plt.show() for etiqueta, productos in [(\"1 kHz / prueba 1 kHz\", productos_bin1), (\"1 kHz / prueba 2 kHz\", productos_bin2), (\"1.5 kHz / prueba 1 kHz\", productos_intermedio)]: print(f\"{etiqueta}: longitud={abs(np.sum(productos)):.6f}; barra={abs(np.sum(productos)) / 8:.6f}\")"
