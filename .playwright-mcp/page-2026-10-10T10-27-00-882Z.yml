          - 'heading "Laboratorio #2 — demodulador FM en GNU Radio" [level=2] [ref=f42e19873]'
          - paragraph [ref=f42e19874]:
            - text: La
            - 'link "guía del laboratorio #2" [ref=f42e19875] [cursor=pointer]':
              - /url: laboratorio-receptor-fm/
            - text: implementa un receptor FM desde un archivo I/Q. También incluye una entrada RTL-SDR opcional.
          - list [ref=f42e19876]:
            - listitem [ref=f42e19877]:
              - strong [ref=f42e19878]: "Conexión con la teoría:"
              - text: el estudiante sigue las tasas y compara el espectro RF, el waterfall y el espectro del canal seleccionado.
            - listitem [ref=f42e19879]:
              - strong [ref=f42e19880]: "Archivo principal:"
              - code [ref=f42e19881]: fm_99p1MHz_2p4Msps_g30.cu8
              - text: ", a"
              - strong [ref=f42e19882]: 2.4 MS/s
              - text: . Es la misma captura de la sección 6.
            - listitem [ref=f42e19883]:
              - strong [ref=f42e19884]: "Cadena de audio:"
              - text: el resampler convierte 2.4 MS/s en 192 kS/s con la razón 2/25.
              - code [ref=f42e19885]: WBFM Receive
              - text: entrega audio mono a 48 kS/s.
            - listitem [ref=f42e19886]:
              - strong [ref=f42e19887]: "Alcance:"
              - text: se justifican los parámetros y se relaciona la demodulación con el giro entre muestras de 6.5. El diseño de filtros queda para sesiones posteriores.
