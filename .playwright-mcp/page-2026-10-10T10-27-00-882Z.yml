          - heading "5. Qué calcula una FFT de un bloque finito" [level=3] [ref=f42e14495]
          - list [ref=f42e14496]:
            - listitem [ref=f42e14497]: Una gráfica de espectro suele representar un bloque de muestras, no toda la captura.
            - listitem [ref=f42e14498]: La FFT calcula la DFT de ese bloque. Las figuras siguientes muestran la magnitud de sus coeficientes complejos.
            - listitem [ref=f42e14499]: El tiempo observado y la ventana afectan la forma de los picos. El zero padding cambia cuántos puntos se calculan.
            - listitem [ref=f42e14500]:
              - strong [ref=f42e14501]: "Pregunta conductora:"
              - text: ¿qué muestra la señal y qué efecto introduce la forma de analizarla?
          - heading "5.1. La FFT recibe un bloque, no una señal de duración infinita" [level=4] [ref=f42e14502]
          - list [ref=f42e14503]:
            - listitem [ref=f42e14504]:
              - strong [ref=f42e14505]: "Propósito:"
              - text: identificar las muestras que se analizan y el tiempo que representan.
