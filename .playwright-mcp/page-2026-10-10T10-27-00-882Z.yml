          - paragraph [ref=f42e7811]: Una pantalla que presenta únicamente magnitud no distingue estos dos casos. La transformada completa sí los distingue porque conserva la fase.
          - paragraph [ref=f42e7812]:
            - strong [ref=f42e7813]: "Colab — Celda 4: comparar magnitud y fase espectral."
          - generic [ref=f42e7815]:
            - navigation [ref=f42e7816]:
              - button "Copiar al portapapeles" [ref=f42e7817] [cursor=pointer]
            - code [ref=f42e7818]: "x0 = np.cos(theta) x90 = np.cos(theta + np.pi / 2) f, C0 = espectro(x0, fs) _, C90 = espectro(x90, fs) presentes = np.abs(C0) > 1e-9 print(\"Las magnitudes coinciden:\", np.allclose(np.abs(C0), np.abs(C90))) print(\"Las muestras coinciden:\", np.allclose(x0, x90)) fig, axes = plt.subplots(3, 1, figsize=(10, 9), layout=\"constrained\") axes[0].plot(t[visible] * 1000, x0[visible], \"o-\", label=\"Fase inicial 0°\") axes[0].plot(t[visible] * 1000, x90[visible], \"s-\", label=\"Fase inicial 90°\", markerfacecolor=\"white\") axes[0].set(title=\"Distintos valores en el tiempo\", xlabel=\"Tiempo (ms)\", ylabel=\"Amplitud\") axes[1].stem(f / 1000, np.abs(C0), basefmt=\" \", label=\"Fase inicial 0°\") axes[1].plot(f / 1000, np.abs(C90), \"s\", color=\"tab:orange\", markerfacecolor=\"white\", label=\"Fase inicial 90°\") axes[1].set(title=\"Igual magnitud espectral\", xlabel=\"Frecuencia (kHz)\", ylabel=\"Magnitud por componente\", xlim=(-2, 2), ylim=(-0.03, 0.6)) axes[2].plot(f[presentes] / 1000, np.angle(C0[presentes], deg=True), \"o\", label=\"Fase inicial 0°\") axes[2].plot(f[presentes] / 1000, np.angle(C90[presentes], deg=True), \"s\", label=\"Fase inicial 90°\", markerfacecolor=\"white\") axes[2].set(title=\"Distinta fase espectral\", xlabel=\"Frecuencia (kHz)\", ylabel=\"Fase (grados)\", xlim=(-2, 2), ylim=(-115, 115), yticks=[-90, 0, 90]) for ax in axes: ax.grid(alpha=0.2) ax.legend() plt.show()"
          - paragraph [ref=f42e7819]:
            - img "Dos cosenos de igual amplitud y frecuencia con fases iniciales cero y noventa grados, comparados en tiempo, magnitud espectral y fase espectral" [ref=f42e7820]
          - paragraph [ref=f42e7821]:
            - strong [ref=f42e7822]: Figura 8.
            - text: Dos señales distintas en el tiempo pueden tener la misma magnitud espectral y diferente fase espectral.
          - paragraph [ref=f42e7823]: "El primer panel muestra que las muestras cambian. En el segundo, los marcadores de magnitud se superponen. El tercero distingue las señales por las fases de sus componentes en ±1 kHz. Se muestran fases únicamente donde hay componentes presentes: los coeficientes que deberían ser cero pueden contener pequeños errores numéricos, cuya fase no aporta información sobre un tono del ejemplo."
          - paragraph [ref=f42e7824]:
            - text: El umbral
            - code [ref=f42e7825]: "1e-9"
            - text: solo evita mostrar esas fases numéricas en esta simulación sin ruido. No es un criterio de detección para una captura real.
          - heading "3.5. La transformada completa permite recuperar las muestras" [level=4] [ref=f42e7826]
          - paragraph [ref=f42e7827]:
            - text: Cambiar de representación no elimina información por sí mismo. La DFT completa de un bloque y su inversa permiten pasar entre las muestras y los coeficientes. La correspondencia entre ambas secuencias se describe en el
            - link "tutorial de SciPy" [ref=f42e7828] [cursor=pointer]:
              - /url: https://docs.scipy.org/doc/scipy/tutorial/fft.html
            - text: .
          - paragraph [ref=f42e7829]: "Conservar únicamente las magnitudes descarta las fases originales. En general, esas magnitudes no bastan para recuperar las mismas muestras. Esto se puede comprobar con el coseno de fase inicial 90°:"
          - paragraph [ref=f42e7830]:
            - strong [ref=f42e7831]: "Colab — Celda 5: volver al tiempo con y sin la fase original."
            - text: Esta celda usa directamente la salida de
            - code [ref=f42e7832]: fft
            - text: ", sin el reordenamiento ni la escala del visor anterior."
          - generic [ref=f42e7834]:
            - navigation [ref=f42e7835]:
              - button "Copiar al portapapeles" [ref=f42e7836] [cursor=pointer]
            - code [ref=f42e7837]: X_completo = np.fft.fft(x90) x_recuperado = np.fft.ifft(X_completo) x_sin_fase = np.fft.ifft(np.abs(X_completo)) print("La transformada completa recupera las muestras:", np.allclose(x_recuperado, x90)) print("Solo la magnitud recupera las mismas muestras:", np.allclose(x_sin_fase, x90)) print("Error máximo con la transformada completa:", np.max(np.abs(x_recuperado - x90)))
          - paragraph [ref=f42e7838]:
            - text: La primera comparación produce
            - code [ref=f42e7839]: "True"
            - text: y la segunda,
            - code [ref=f42e7840]: "False"
            - text: . El error de recuperación con la transformada completa es muy pequeño y corresponde a la precisión numérica. Usar
            - code [ref=f42e7841]: np.abs(X_completo)
            - text: como entrada de la inversa asigna fase cero a todos sus coeficientes; no conserva las fases del coseno original.
          - paragraph [ref=f42e7842]: Este resultado explica por qué una gráfica habitual de magnitud espectral muestra solo una parte de la representación en frecuencia. La FFT devuelve coeficientes complejos; la elección de mostrar únicamente su magnitud corresponde al visor.
          - group [ref=f42e7843]:
            - 'generic "Comprobación: otro tono real" [ref=f42e7844] [cursor=pointer]'
          - group [ref=f42e7845]:
            - 'generic "Comprobación: interpretar una pantalla de magnitud" [ref=f42e7846] [cursor=pointer]'
          - paragraph [ref=f42e7847]: "La lectura en tiempo y la lectura en frecuencia se complementan: una permite observar cómo cambia la secuencia y la otra identificar sus componentes. En una captura I/Q se analizan ambas partes conjuntamente como una señal compleja. Antes de interpretar cualquier eje de frecuencia, también hay que entender qué efectos introduce el muestreo; ese es el tema de la subsección 4."
