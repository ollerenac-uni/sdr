          - paragraph [ref=f42e6683]: El coseno real reúne dos giros de amplitud 0.5. El tono complejo conserva un solo sentido de giro. Por eso el espectro completo del coseno tiene dos componentes y el de cada tono complejo tiene una.
          - generic [ref=f42e6684]:
