            - code [ref=f42e17000]: "import numpy as np import matplotlib.pyplot as plt fs, N_debil, M = 8000, 256, 8192 f_fuerte, f_debil = 1007.8125, 1203.125 t_debil = np.arange(N_debil) / fs fuerte = np.exp(1j * 2 * np.pi * f_fuerte * t_debil) debil = 0.01 * np.exp(1j * 2 * np.pi * f_debil * t_debil) f = np.fft.fftshift(np.fft.fftfreq(M, 1 / fs)) C_fuerte = np.fft.fftshift(np.fft.fft(fuerte, M)) / N_debil C_ambos = np.fft.fftshift(np.fft.fft(fuerte + debil, M)) / N_debil def magnitud_db(C): return 20 * np.log10(np.maximum(np.abs(C), 1e-6)) indice_debil = np.argmin(np.abs(f - f_debil)) fig, ax = plt.subplots(figsize=(12, 5), layout=\"constrained\") ax.plot(f, magnitud_db(C_fuerte), label=\"Solo el tono fuerte\") ax.plot(f, magnitud_db(C_ambos), \"--\", label=\"Fuerte + débil\") ax.axvline(f_debil, color=\"gray\", linestyle=\":\") ax.plot([f_debil], [-40], \"ko\", label=\"Nivel del débil aislado: −40 dB\") ax.annotate(\"Fuerte solo: −28.9 dB\", xy=(f_debil, magnitud_db(C_fuerte)[indice_debil]), xytext=(1240, -15), arrowprops={\"arrowstyle\": \"->\"}) ax.set(title=\"Ventana rectangular: el tono fuerte ocupa también otras frecuencias de prueba\", xlabel=\"Frecuencia de prueba (Hz)\", ylabel=\"Magnitud (dB respecto a 1)\", xlim=(900, 1390), ylim=(-85, 5)) ax.grid(alpha=0.2) ax.legend(loc=\"lower left\") print(\"Fuerte en la frecuencia del débil:\", magnitud_db(C_fuerte)[indice_debil], \"dB\") plt.show()"
