            - code [ref=f42e12916]: "f_tono = 3000 duracion = 0.008 tasas = [12000, 8000, 4000] td = np.linspace(0, 0.001, 1201) fig, axes = plt.subplots(3, 2, figsize=(12, 10), layout=\"constrained\") for fila, tasa in enumerate(tasas): cantidad = int(round(duracion * tasa)) tk = np.arange(cantidad) / tasa zk = np.exp(1j * 2 * np.pi * f_tono * tk) fa = float(frecuencia_alias(f_tono, tasa)) fk, Ck = espectro(zk, tasa) visible_k = tk <= 0.001 print(f\"fs={tasa} S/s; N={cantidad}; alias={fa:g} Hz; pico FFT={fk[np.argmax(np.abs(Ck))]:g} Hz\") axes[fila, 0].plot(td * 1000, np.cos(2 * np.pi * f_tono * td), color=\"tab:gray\", label=\"I continua original: +3 kHz\") axes[fila, 0].plot(td * 1000, np.cos(2 * np.pi * fa * td), \"--\", color=\"tab:orange\", label=f\"I del representante: {fa / 1000:+g} kHz\") axes[fila, 0].plot(tk[visible_k] * 1000, zk.real[visible_k], \"o\", color=\"tab:blue\", label=\"Muestras I\") axes[fila, 0].set(title=f\"fs = {tasa / 1000:g} kS/s; {cantidad} muestras en 8 ms\", xlabel=\"Tiempo (ms)\", ylabel=\"I\", ylim=(-1.2, 1.2)) axes[fila, 0].legend(fontsize=8, loc=\"upper right\") axes[fila, 1].stem(fk / 1000, np.abs(Ck), basefmt=\" \") axes[fila, 1].set(title=f\"FFT de I + jQ: pico en {fa / 1000:+g} kHz\", xlabel=\"Frecuencia (kHz)\", ylabel=\"Magnitud por componente\", xlim=(-6.2, 6.2), ylim=(-0.03, 1.2)) axes[fila, 1].axvline(-tasa / 2000, color=\"tab:gray\", linestyle=\"--\") axes[fila, 1].axvline(tasa / 2000, color=\"tab:gray\", linestyle=\"--\") axes[fila, 1].axvspan(-tasa / 2000, tasa / 2000, color=\"tab:green\", alpha=0.08) for ax in axes.flat: ax.grid(alpha=0.2) plt.show()"
