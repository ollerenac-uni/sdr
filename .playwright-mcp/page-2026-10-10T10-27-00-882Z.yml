              - text: ", después el promedio y finalmente la conversión a dB."
          - paragraph [ref=f42e18595]: Un bloque muestra un instante breve. El promedio permite comparar la potencia observada durante varios bloques.
          - paragraph [ref=f42e18596]:
            - img "Un espectro de la captura frente al promedio de 200 bloques, con igual escala RF y marcas de tres bandas" [ref=f42e18597]
          - paragraph [ref=f42e18598]:
            - strong [ref=f42e18599]: Figura 26.
            - text: El promedio muestra con menos variación las bandas de la captura; ambos paneles usan bloques del mismo tamaño.
          - paragraph [ref=f42e18600]:
            - strong [ref=f42e18601]: "Panel A — un bloque:"
          - list [ref=f42e18602]:
            - listitem [ref=f42e18603]: El eje horizontal muestra RF en MHz. El eje vertical muestra potencia relativa en dB, sin calibración en dBm.
            - listitem [ref=f42e18604]: La curva azul corresponde a las primeras 4096 muestras. Sus irregularidades no significan que cada pico sea una emisora distinta.
            - listitem [ref=f42e18605]: Las líneas señalan 98.1, 99.1 y 100.1 MHz. Esas referencias no cambian entre paneles.
          - paragraph [ref=f42e18606]:
            - strong [ref=f42e18607]: "Panel B — promedio:"
          - list [ref=f42e18608]:
            - listitem [ref=f42e18609]: La curva naranja promedia 200 estimaciones de potencia. Los paneles comparten referencia y límites verticales.
            - listitem [ref=f42e18610]: Se observan bandas alrededor de las tres referencias. La marca gris de 200 kHz sirve como regla visual, no como ancho medido.
