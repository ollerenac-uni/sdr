          - heading "4. Muestreo y aliasing" [level=3] [ref=f42e8372]
          - paragraph [ref=f42e8373]:
            - text: "La subsección anterior identificó tonos mediante sus muestras y su espectro. Ahora aparece una pregunta importante:"
            - strong [ref=f42e8374]: ¿pueden dos señales de frecuencias diferentes producir exactamente las mismas muestras?
          - paragraph [ref=f42e8375]: "La respuesta es sí. El muestreo conserva valores en instantes separados, no todo lo que ocurrió entre ellos. El aliasing es la ambigüedad que permite que una componente se confunda con otra al muestrear. No es un error de la FFT: puede comprobarse antes de calcular cualquier transformada."
          - paragraph [ref=f42e8376]: Los experimentos empiezan con señales sintéticas de frecuencia conocida. No simulan todos los bloques del RTL2832U. Primero se utiliza un coseno real para observar el problema y después un tono complejo para conservar el signo de la frecuencia.
