          - paragraph [ref=f42e19801]:
            - strong [ref=f42e19802]: "Panel B — plano I/Q:"
          - list [ref=f42e19803]:
            - listitem [ref=f42e19804]: Cada punto reúne I y Q del mismo instante. Las primeras ocho muestras completan las posiciones de una vuelta.
            - listitem [ref=f42e19805]: El orden muestra el giro positivo del tono de +1 kHz; cada avance es de 45°.
          - paragraph [ref=f42e19806]:
            - strong [ref=f42e19807]: "Panel C — FFT compleja:"
          - list [ref=f42e19808]:
            - listitem [ref=f42e19809]:
              - text: La entrada es
              - generic [ref=f42e19811]:
                - generic [aria-hidden] [ref=f42e19812]:
