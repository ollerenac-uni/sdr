            - code [ref=f42e17182]: "import numpy as np import matplotlib.pyplot as plt fs, N_debil, M = 8000, 256, 8192 f_fuerte, f_debil = 1007.8125, 1203.125 t_debil = np.arange(N_debil) / fs fuerte = np.exp(1j * 2 * np.pi * f_fuerte * t_debil) debil = 0.01 * np.exp(1j * 2 * np.pi * f_debil * t_debil) f = np.fft.fftshift(np.fft.fftfreq(M, 1 / fs)) ventanas = [np.ones(N_debil), np.hanning(N_debil + 1)[:-1]] def magnitud_db(C): return 20 * np.log10(np.maximum(np.abs(C), 1e-6)) resultados_debil = {} fig, axes = plt.subplots(2, 1, figsize=(12, 8), layout=\"constrained\") for ax, letra, nombre, w, semiancho in zip(axes, \"AB\", [\"Rectangular\", \"Hann\"], ventanas, [fs / N_debil, 2 * fs / N_debil]): C_fuerte = np.fft.fftshift(np.fft.fft(fuerte * w, M)) / w.sum() C_ambos = np.fft.fftshift(np.fft.fft((fuerte + debil) * w, M)) / w.sum() resultados_debil[nombre] = (f, C_fuerte, C_ambos) ax.axvspan(f_fuerte - semiancho, f_fuerte + semiancho, color=\"tab:blue\", alpha=0.12, label=\"Main lobe del fuerte\") ax.plot(f, magnitud_db(C_fuerte), label=\"Solo fuerte\") ax.plot(f, magnitud_db(C_ambos), \"--\", label=\"Fuerte + débil\") ax.axvline(f_debil, color=\"gray\", linestyle=\":\") ax.plot([f_debil], [-40], \"ko\", label=\"Débil aislado: −40 dB\") ax.set(title=f\"{letra}. {nombre}: ancho del main lobe = {2 * semiancho:g} Hz\", xlabel=\"Frecuencia de prueba (Hz)\", ylabel=\"Magnitud (dB respecto a 1)\", xlim=(900, 1390), ylim=(-85, 5)) ax.grid(alpha=0.2) ax.legend(fontsize=9, loc=\"lower left\") k = np.argmin(abs(f - f_debil)) print(nombre, \": fuerte solo / ambos (dB):\", magnitud_db(C_fuerte)[k], magnitud_db(C_ambos)[k]) plt.show()"
