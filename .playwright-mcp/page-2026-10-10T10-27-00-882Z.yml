          - paragraph [ref=f42e17261]: Observar más tiempo permite separar estos tonos estables. Más puntos de FFT, por sí solos, no producen ese cambio.
          - paragraph [ref=f42e17262]:
            - img "Cuatro espectros del mismo par de tonos con bloques de 64, 256, 512 y 1024 muestras, idénticas escalas y frecuencias conocidas marcadas" [ref=f42e17263]
          - paragraph [ref=f42e17264]:
            - strong [ref=f42e17265]: Figura 24.
            - text: Al aumentar las muestras adquiridas, los máximos de este par se separan y se aproximan a las frecuencias conocidas.
          - paragraph [ref=f42e17266]:
            - strong [ref=f42e17267]: "Panel A — 8 ms:"
          - list [ref=f42e17268]:
            - listitem [ref=f42e17269]: La curva azul combina ambos tonos; las líneas naranjas marcan sus frecuencias conocidas. Los ejes muestran Hz y magnitud normalizada.
            - listitem [ref=f42e17270]: Solo aparecen 0.5 vueltas sobrantes entre tonos. El máximo combinado está en 1031.25 Hz, donde no se generó ningún tono.
          - paragraph [ref=f42e17271]:
            - strong [ref=f42e17272]: "Panel B — 32 ms:"
          - list [ref=f42e17273]:
            - listitem [ref=f42e17274]: Hay dos vueltas sobrantes. La curva forma una meseta con una pequeña muesca central.
            - listitem [ref=f42e17275]: Sus máximos todavía están desplazados. Contar dos máximos no basta para medir correctamente dos tonos.
          - paragraph [ref=f42e17276]:
            - strong [ref=f42e17277]: "Panel C — 64 ms:"
          - list [ref=f42e17278]:
            - listitem [ref=f42e17279]: Hay cuatro vueltas sobrantes. Los máximos aparecen en 1000 y 1062.5 Hz en la rejilla utilizada.
            - listitem [ref=f42e17280]: Los puntos FFT tienen la misma separación que en A y B. La diferencia procede del bloque adquirido.
          - paragraph [ref=f42e17281]:
            - strong [ref=f42e17282]: "Panel D — 128 ms:"
          - list [ref=f42e17283]:
            - listitem [ref=f42e17284]: Hay ocho vueltas sobrantes. Los máximos permanecen en las frecuencias conocidas y sus contribuciones son más estrechas.
            - listitem [ref=f42e17285]: Esta comparación supone tonos estables. Una señal cambiante puede requerir bloques más cortos para observar sus cambios.
