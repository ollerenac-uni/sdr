              - text: S/s, amplitud 1 y fase inicial 0. Primero se mantiene el tono de entrada en 1 kHz.
          - paragraph [ref=f42e14917]:
            - strong [ref=f42e14918]: La misma entrada se prueba a dos frecuencias. A 1 kHz, las flechas se suman en línea; a 2 kHz, el recorrido se cierra.
          - paragraph [ref=f42e14919]:
            - img "Entrada de ocho muestras de 1 kHz, flechas después de probar 1 y 2 kHz y sus sumas punta con cola" [ref=f42e14920]
          - paragraph [ref=f42e14921]:
            - strong [ref=f42e14922]: Figura 15.
            - text: Las mismas ocho muestras producen una suma de longitud 8 al probar 1 kHz y una suma cero al probar 2 kHz.
          - list [ref=f42e14923]:
            - listitem [ref=f42e14924]:
              - strong [ref=f42e14925]: "A — Entrada:"
              - text: cada flecha azul representa una muestra. El eje horizontal muestra I; el vertical muestra Q.
              - list [ref=f42e14926]:
                - listitem [ref=f42e14927]: Los números indican el orden de las muestras. Cada flecha avanza 45° respecto a la anterior.
            - listitem [ref=f42e14928]:
              - strong [ref=f42e14929]: "B — Prueba de 1 kHz:"
              - text: se resta
