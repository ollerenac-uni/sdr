            - code [ref=f42e18688]: "from pathlib import Path import numpy as np import matplotlib.pyplot as plt ruta = Path(globals().get(\"ruta_captura\", \"fm_99p1MHz_2p4Msps_g30.cu8\")) fs, fc, N, bloques = 2400000, 99100000, 4096, 200 if not ruta.is_file(): raise FileNotFoundError(f\"Falta la grabación: {ruta}\") if ruta.stat().st_size % 2: raise ValueError(\"El archivo CU8 debe contener pares completos I/Q\") raw = np.fromfile(ruta, dtype=np.uint8, count=2 * N * bloques) if raw.size != 2 * N * bloques: raise ValueError(\"Se necesitan 200 bloques completos de 4096 muestras I/Q\") v = (raw.astype(np.float32) - 127.5) / 127.5 z = (v[0::2] + 1j * v[1::2]).reshape(bloques, N) w = 0.5 - 0.5 * np.cos(2 * np.pi * np.arange(N) / N) P = np.abs(np.fft.fftshift(np.fft.fft(z * w, axis=1), axes=1)) ** 2 / w.sum() ** 2 promedio = P.mean(axis=0) referencia = max(promedio.max(), np.finfo(float).tiny) db = 10 * np.log10(np.maximum(np.vstack([P[0], promedio]) / referencia, 1e-12)) f_rf = (fc + np.fft.fftshift(np.fft.fftfreq(N, 1 / fs))) / 1e6 fig, axes = plt.subplots(2, 1, figsize=(12, 7), layout=\"constrained\") for ax, valores, color, titulo in zip(axes, db, [\"tab:blue\", \"tab:orange\"], [\"A. Un bloque: 1.707 ms\", \"B. Promedio de 200 bloques: 341.333 ms\"]): ax.plot(f_rf, valores, color=color, linewidth=0.8) for frecuencia in [98.1, 99.1, 100.1]: ax.axvline(frecuencia, color=\"gray\", linestyle=\"--\", alpha=0.6) ax.text(frecuencia, 8, f\"{frecuencia:.1f} MHz\", ha=\"center\") ax.set(title=titulo, xlabel=\"Frecuencia RF (MHz)\", ylabel=\"Potencia relativa (dB)\", xlim=(97.9, 100.3), ylim=(-65, 14)) ax.grid(alpha=0.2) axes[1].annotate(\"\", xy=(99.2, -51), xytext=(99.0, -51), arrowprops={\"arrowstyle\": \"<->\", \"color\": \"black\"}) axes[1].text(99.1, -60, \"Regla: 200 kHz (no es un ancho medido)\", ha=\"center\", fontsize=9, bbox={\"facecolor\": \"white\", \"alpha\": 0.85, \"edgecolor\": \"none\"}) print(\"Duración por bloque (ms):\", 1000 * N / fs, \"; separación de bins (Hz):\", fs / N) plt.show()"
          - heading "6.3. ¿Qué cambia y qué permanece durante la captura?" [level=4] [ref=f42e18689]
          - list [ref=f42e18690]:
            - listitem [ref=f42e18691]:
              - strong [ref=f42e18692]: "Waterfall:"
              - text: vista que apila espectros en el tiempo. El color indica la potencia en cada posición.
            - listitem [ref=f42e18693]:
              - strong [ref=f42e18694]: "Qué cambia:"
              - text: el tramo temporal de la grabación que representa cada fila.
            - listitem [ref=f42e18695]:
              - strong [ref=f42e18696]: "Qué permanece fijo:"
              - text: ventana Hann, 4096 muestras por bloque y escala de color.
            - listitem [ref=f42e18697]: Cada fila promedia diez bloques consecutivos. Se muestran 585 filas, que cubren 9.984 s.
          - paragraph [ref=f42e18698]: El waterfall muestra dónde aparece potencia y cómo cambia durante la grabación.
          - paragraph [ref=f42e18699]:
            - img "Waterfall de la captura con frecuencia RF, tiempo y escala de potencia relativa; marcas para bandas, líneas estrechas y bordes" [ref=f42e18700]
          - paragraph [ref=f42e18701]:
            - strong [ref=f42e18702]: Figura 27.
            - text: El waterfall separa los cambios temporales de las bandas, las líneas estrechas estables y la atenuación observada en los bordes.
          - list [ref=f42e18703]:
            - listitem [ref=f42e18704]:
              - strong [ref=f42e18705]: "Ejes y color:"
              - text: RF aumenta hacia la derecha; el tiempo avanza hacia abajo. El color claro representa mayor potencia según la barra lateral.
            - listitem [ref=f42e18706]:
              - strong [ref=f42e18707]: "Marcas A y B:"
              - text: A señala bandas anchas; B señala una línea estrecha estable. La forma de B no basta para identificar su origen.
            - listitem [ref=f42e18708]:
              - strong [ref=f42e18709]: "Marca C:"
              - text: el borde tiene menor potencia en esta vista. La figura no demuestra qué etapa del receptor produce esa diferencia.
