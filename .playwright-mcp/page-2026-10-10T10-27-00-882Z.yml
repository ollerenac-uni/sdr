          - 'heading "3. Una señal, dos representaciones: tiempo y frecuencia" [level=3] [ref=f42e6473]'
          - paragraph [ref=f42e6474]: "Las subsecciones anteriores describieron cómo cambian las muestras de un tono. Ahora se considera otra pregunta: ¿qué tonos contribuyen a una señal?"
          - paragraph [ref=f42e6475]: La representación temporal muestra los valores en cada instante. La representación frecuencial describe las componentes que forman la señal. Ambas se refieren a la misma señal y permiten responder preguntas diferentes.
          - heading "3.1. Qué revela cada representación" [level=4] [ref=f42e6476]
          - table [ref=f42e6479]:
            - rowgroup [ref=f42e6480]:
              - row [ref=f42e6481]:
                - columnheader "Representación" [ref=f42e6482]
                - columnheader "Pregunta que responde" [ref=f42e6483]
                - columnheader "Ejemplo de lectura" [ref=f42e6484]
            - rowgroup [ref=f42e6485]:
              - row [ref=f42e6486]:
                - cell "Tiempo" [ref=f42e6487]
                - cell "¿Qué valor toma la señal y cuándo cambia?" [ref=f42e6488]
                - cell "Reconocer un período, un cambio de amplitud o la posición inicial dentro de un ciclo." [ref=f42e6489]
              - row [ref=f42e6490]:
                - cell "Frecuencia" [ref=f42e6491]
                - cell "¿Qué componentes frecuenciales contiene?" [ref=f42e6492]
                - cell "Identificar tonos, comparar sus magnitudes y distinguir frecuencias positivas y negativas." [ref=f42e6493]
          - paragraph [ref=f42e6494]: En un tono sencillo se puede reconocer la frecuencia contando ciclos. Cuando se suman varios tonos, la forma temporal resulta más complicada. La representación en frecuencia permite identificar las componentes por separado.
          - paragraph [ref=f42e6495]:
            - text: El análisis de Fourier proporciona esta relación entre representaciones. Para un bloque de muestras, una FFT calcula coeficientes complejos asociados con determinadas frecuencias. Cada coeficiente tiene magnitud y fase. La idea de descomponer una señal y recuperarla a partir de sus componentes se presenta en el
            - link "tutorial de Fourier de SciPy" [ref=f42e6496] [cursor=pointer]:
              - /url: https://docs.scipy.org/doc/scipy/tutorial/fft.html
            - text: .
          - paragraph [ref=f42e6497]: En esta subsección, la FFT se utiliza como herramienta de visualización. El significado detallado de sus puntos de frecuencia, del tamaño del bloque y de las ventanas se desarrollará en la subsección 5.
          - heading "3.2. Qué componentes corresponden a cada tono" [level=4] [ref=f42e6498]
