            - code [ref=f42e16844]: "import numpy as np import matplotlib.pyplot as plt def espectro_bloque(x, sample_rate, ventana=None, nfft=None): cantidad = len(x) w = np.ones(cantidad) if ventana is None else np.asarray(ventana) longitud_fft = cantidad if nfft is None else nfft if len(w) != cantidad or longitud_fft < cantidad or w.sum() == 0: raise ValueError(\"La ventana debe tener N pesos de suma no nula; la FFT no debe recortar muestras\") f = np.fft.fftshift(np.fft.fftfreq(longitud_fft, d=1 / sample_rate)) C = np.fft.fftshift(np.fft.fft(x * w, n=longitud_fft)) / w.sum() return f, C fs, N, M = 8000, 64, 512 z_off = np.exp(1j * 2 * np.pi * 1062.5 * np.arange(N) / fs) entrada_padded = np.pad(z_off, (0, M - N)) f64, C64 = espectro_bloque(z_off, fs) f512, C512 = espectro_bloque(z_off, fs, nfft=M) fig, axes = plt.subplots(2, 1, figsize=(12, 7), layout=\"constrained\", gridspec_kw={\"height_ratios\": [1, 3]}) axes[0].barh(0, N, height=0.5, color=\"tab:blue\", label=\"64 muestras adquiridas: 8 ms\") axes[0].barh(0, M - N, left=N, height=0.5, color=\"white\", edgecolor=\"tab:orange\", hatch=\"///\", label=\"448 ceros: no medidos\") axes[0].set(title=\"A. Arreglo de entrada: datos y ceros\", xlabel=\"Posición en el arreglo\", xlim=(0, M), yticks=[], xticks=[0, 64, 256, 512]) axes[0].legend(loc=\"upper center\", ncol=2, fontsize=9) axes[1].plot(f512, np.abs(C512), \".-\", label=\"M = 512: pruebas cada 15.625 Hz\") axes[1].plot(f64, np.abs(C64), \"s\", color=\"tab:orange\", markerfacecolor=\"none\", markersize=9, label=\"M = 64: pruebas cada 125 Hz\") axes[1].axvline(1062.5, color=\"gray\", linestyle=\"--\", label=\"Tono: 1062.5 Hz\") axes[1].set(title=\"B. Más puntos, la misma forma espectral\", xlabel=\"Frecuencia de prueba (Hz)\", ylabel=\"Magnitud\", xlim=(700, 1450), ylim=(-0.03, 1.15)) axes[1].grid(alpha=0.2) axes[1].legend(fontsize=9) print(\"Muestras adquiridas:\", N, \"; ceros:\", M - N, \"; tiempo observado (ms):\", N / fs * 1000) print(\"Los puntos originales coinciden:\", np.allclose(C512[::8], C64)) plt.show()"
