          - heading "6.5. ¿Cómo permite FM recuperar el audio?" [level=4] [ref=f42e18921]
          - list [ref=f42e18922]:
            - listitem [ref=f42e18923]:
              - strong [ref=f42e18924]: "FM, frequency modulation:"
              - text: el mensaje modifica la frecuencia instantánea; en el plano I/Q, modifica el avance de fase entre muestras.
            - listitem [ref=f42e18925]:
              - strong [ref=f42e18926]: "Qué cambia:"
              - text: un mensaje sinusoidal controla el giro de una señal sintética.
            - listitem [ref=f42e18927]:
              - strong [ref=f42e18928]: "Qué permanece fijo:"
              - text: amplitud 1, sampling rate de 48 kS/s y desviación máxima de 6 kHz.
            - listitem [ref=f42e18929]:
              - strong [ref=f42e18930]: "Qué se observa:"
              - text: medir el giro y aplicar la escala conocida recupera el mensaje utilizado para generar las muestras.
          - paragraph [ref=f42e18931]: En FM, el mensaje cambia el giro entre muestras. El demodulador mide ese cambio para recuperar el mensaje.
          - paragraph [ref=f42e18932]:
            - img "Flechas de una señal FM sintética, giros entre muestras y coincidencia entre mensaje original y recuperado" [ref=f42e18933]
          - paragraph [ref=f42e18934]:
            - strong [ref=f42e18935]: Figura 28.
            - text: En esta simulación, el giro entre muestras sigue el mensaje; una escala conocida permite recuperar sus valores desde la segunda muestra.
          - paragraph [ref=f42e18936]:
            - strong [ref=f42e18937]: "Panel A — muestras I/Q:"
          - list [ref=f42e18938]:
            - listitem [ref=f42e18939]: Los ejes son I y Q. Cada flecha representa una muestra; las etiquetas indican su orden.
            - listitem [ref=f42e18940]: Las flechas tienen la misma longitud. Cambia el ángulo que separa una muestra de la siguiente.
            - listitem [ref=f42e18941]: Las primeras muestras avanzan cada vez más porque el mensaje aumenta durante ese tramo.
          - paragraph [ref=f42e18942]:
            - strong [ref=f42e18943]: "Panel B — giro medido:"
          - list [ref=f42e18944]:
            - listitem [ref=f42e18945]: El eje horizontal identifica la muestra que termina cada intervalo. Las barras muestran el giro en grados.
            - listitem [ref=f42e18946]: Un giro positivo indica avance en sentido antihorario; uno negativo indica avance en sentido horario.
            - listitem [ref=f42e18947]: El máximo es 45°. No aparece un valor para la primera muestra, porque no tiene una muestra anterior en el bloque.
          - paragraph [ref=f42e18948]:
            - strong [ref=f42e18949]: "Panel C — mensaje recuperado:"
          - list [ref=f42e18950]:
            - listitem [ref=f42e18951]: El eje horizontal muestra tiempo. La curva azul es el mensaje original; los puntos naranjas son el resultado de medir y escalar el giro.
            - listitem [ref=f42e18952]: Los puntos coinciden con el mensaje desde la segunda muestra. Las muestras I/Q no se convirtieron en una componente constante.
            - listitem [ref=f42e18953]: Esta comparación usa una simulación conocida, no el audio original de una emisora real.
          - paragraph [ref=f42e18954]:
            - strong [ref=f42e18955]: "La operación después de verla:"
          - list [ref=f42e18956]:
            - listitem [ref=f42e18957]:
