            - code [ref=f42e17294]: "import numpy as np import matplotlib.pyplot as plt fs, M = 8000, 16384 frecuencias_par = [1000, 1062.5] resultados_duracion = {} fig, axes = plt.subplots(2, 2, figsize=(12, 8), layout=\"constrained\") for ax, letra, cantidad in zip(axes.flat, \"ABCD\", [64, 256, 512, 1024]): tk = np.arange(cantidad) / fs zk = np.exp(1j * 2 * np.pi * frecuencias_par[0] * tk) + np.exp(1j * 2 * np.pi * frecuencias_par[1] * tk) wk = np.hanning(cantidad + 1)[:-1] fk = np.fft.fftshift(np.fft.fftfreq(M, 1 / fs)) Ck = np.fft.fftshift(np.fft.fft(zk * wk, M)) / wk.sum() resultados_duracion[cantidad] = (fk, Ck) vueltas = (frecuencias_par[1] - frecuencias_par[0]) * cantidad / fs ax.plot(fk, np.abs(Ck), label=\"Suma de ambos tonos\") for frecuencia in frecuencias_par: ax.axvline(frecuencia, color=\"tab:orange\", linestyle=\"--\") ax.set(title=f\"{letra}. N={cantidad}: {1000 * cantidad / fs:g} ms; {vueltas:g} vueltas sobrantes\", xlabel=\"Frecuencia (Hz)\", ylabel=\"Magnitud\", xlim=(850, 1210), ylim=(-0.03, 1.5)) ax.grid(alpha=0.2) print(\"N:\", cantidad, \"; vueltas sobrantes:\", vueltas) plt.show()"
