          - paragraph [ref=f42e12909]: Esto no consiste en tomar un archivo y cambiar la etiqueta de su sample rate. Cada fila calcula la señal original en nuevos instantes de muestreo.
          - paragraph [ref=f42e12910]:
            - strong [ref=f42e12911]: "Colab — Celda 5: comparar las adquisiciones en tiempo y frecuencia."
          - generic [ref=f42e12913]:
