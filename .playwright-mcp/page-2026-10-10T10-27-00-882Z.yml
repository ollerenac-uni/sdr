            - code [ref=f42e19350]: "import numpy as np import matplotlib.pyplot as plt fs, desviacion, frecuencia_mensaje, N = 48000, 6000, 1000, 48 n = np.arange(N) t = n / fs mensaje = np.sin(2 * np.pi * frecuencia_mensaje * t) fase = 2 * np.pi * desviacion / fs * np.cumsum(mensaje) z = np.exp(1j * fase) giro = np.angle(z[1:] * np.conj(z[:-1])) recuperado = fs / (2 * np.pi * desviacion) * giro fig = plt.figure(figsize=(13, 7), layout=\"constrained\") rejilla = fig.add_gridspec(2, 2) a = fig.add_subplot(rejilla[0, 0]) b = fig.add_subplot(rejilla[0, 1]) c = fig.add_subplot(rejilla[1, :]) angulos = np.linspace(0, 2 * np.pi, 300) a.plot(np.cos(angulos), np.sin(angulos), color=\"lightgray\") for k in range(9): a.annotate(\"\", xy=(z[k].real, z[k].imag), xytext=(0, 0), arrowprops={\"arrowstyle\": \"->\", \"color\": plt.cm.viridis(k / 8)}) a.text(1.14 * z[k].real, 1.14 * z[k].imag, str(k), ha=\"center\", va=\"center\") a.set(title=\"A. Primeras nueve muestras: cambia el giro\", xlabel=\"I\", ylabel=\"Q\", aspect=\"equal\", xlim=(-1.35, 1.35), ylim=(-1.35, 1.35)) b.bar(n[1:], np.rad2deg(giro), color=\"tab:orange\") b.set(title=\"B. Giro desde la muestra anterior\", xlabel=\"Índice n\", ylabel=\"Giro (grados)\", ylim=(-50, 50)) c.plot(t * 1000, mensaje, color=\"tab:blue\", label=\"Mensaje original\") c.plot(t[1:] * 1000, recuperado, \"o\", color=\"tab:orange\", markersize=4, label=\"Mensaje recuperado\") c.set(title=\"C. El giro medido, multiplicado por una escala conocida\", xlabel=\"Tiempo (ms)\", ylabel=\"Valor del mensaje\", ylim=(-1.2, 1.2)) c.legend() for ax in [a, b, c]: ax.grid(alpha=0.2) print(\"Error máximo:\", np.max(np.abs(recuperado - mensaje[1:]))) plt.show()"
