        - article [ref=f42e132]:
          - heading "Sesión 02 — Señales y espectro en SDR" [level=1] [ref=f42e133]
          - heading "Objetivos de aprendizaje" [level=2] [ref=f42e134]
          - paragraph [ref=f42e135]: "Al finalizar esta sesión, el estudiante será capaz de:"
          - list [ref=f42e136]:
            - listitem [ref=f42e137]: Calcular el intervalo entre muestras y la duración de un bloque a partir de la tasa de muestreo y del número de muestras.
            - listitem [ref=f42e138]: Interpretar las componentes I/Q de una señal, calcular su magnitud y fase, y explicar la diferencia entre una senoide real y una senoide compleja.
            - listitem [ref=f42e139]: Relacionar las representaciones en tiempo y frecuencia, y predecir el espectro de un tono real, un tono complejo y una suma de tonos.
            - listitem [ref=f42e140]: Interpretar el eje de frecuencias de una FFT y explicar cómo el número de muestras y la ventana afectan el espectro observado.
            - listitem [ref=f42e141]: Distinguir aliasing y spectral leakage, y comprobar sus efectos con señales conocidas.
            - listitem [ref=f42e142]: Relacionar el eje de una captura con RF e interpretar bandas, líneas y cambios temporales mediante el promedio y el waterfall.
            - listitem [ref=f42e143]: Explicar cómo el giro entre muestras permite demodular FM y qué procesamiento adicional entrega audio mono.
          - heading "Teoría" [level=2] [ref=f42e144]
          - heading "1. De las muestras a una señal" [level=3] [ref=f42e145]
          - paragraph [ref=f42e146]: En la sesión 1, el receptor entregó una secuencia de muestras I/Q. Cada muestra corresponde a un instante de la señal. Para interpretar esa secuencia hace falta conocer sus valores, su orden y la tasa de muestreo con la que se obtuvo.
