              - strong [ref=f42e12923]: "Columna izquierda — muestras I:"
              - text: la curva original gris permanece fija. Al reducir el sample rate, los puntos quedan más separados en el tiempo.
            - listitem [ref=f42e12924]:
              - strong [ref=f42e12925]: "Fila superior — 12 kS/s:"
              - text: la referencia original y la del representante coinciden a la izquierda. A la derecha, el pico aparece en +3 kHz.
            - listitem [ref=f42e12926]:
              - strong [ref=f42e12927]: "Fila central — 8 kS/s:"
