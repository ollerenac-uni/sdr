          - paragraph [ref=f42e7160]: "Cada muestra de la suma contiene la contribución de ambos tonos. Su forma temporal cambia, pero el espectro permite reconocer las dos componentes:"
          - list [ref=f42e7161]:
            - listitem [ref=f42e7162]: Una componente en +1 kHz, de magnitud 1.
            - listitem [ref=f42e7163]: Una componente en −2 kHz, de magnitud 0.5.
          - paragraph [ref=f42e7164]: El espectro de una señal compleja no tiene que presentar la misma magnitud en frecuencias positivas y negativas. La simetría de magnitud que se observó en el coseno se debe a que esa señal es real.
          - paragraph [ref=f42e7165]:
            - strong [ref=f42e7166]: "Colab — Celda 3: sumar dos tonos y comprobar sus componentes."
