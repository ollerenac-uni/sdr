            - code [ref=f42e7171]: "z1 = z_pos z2 = 0.5 * np.exp(-1j * 2 * np.pi * 2000 * t) z_suma = z1 + z2 f, C1 = espectro(z1, fs) _, C2 = espectro(z2, fs) _, C_suma = espectro(z_suma, fs) print(\"Los coeficientes se suman:\", np.allclose(C_suma, C1 + C2)) fig, axes = plt.subplots(2, 2, figsize=(12, 7), layout=\"constrained\") axes[0, 0].plot(t[visible] * 1000, z1.real[visible], \"o-\", label=\"I del tono de +1 kHz\") axes[0, 0].plot(t[visible] * 1000, z2.real[visible], \"s-\", label=\"I del tono de -2 kHz\") axes[0, 0].set(title=\"Antes de sumar\", xlabel=\"Tiempo (ms)\", ylabel=\"Amplitud\") axes[0, 0].legend() axes[1, 0].plot(t[visible] * 1000, z_suma.real[visible], \"o-\", label=\"I de la suma\") axes[1, 0].plot(t[visible] * 1000, z_suma.imag[visible], \"s-\", label=\"Q de la suma\", markerfacecolor=\"white\") axes[1, 0].set(title=\"Una sola secuencia\", xlabel=\"Tiempo (ms)\", ylabel=\"Amplitud\") axes[1, 0].legend() axes[0, 1].stem(f / 1000, np.abs(C1), linefmt=\"C0-\", markerfmt=\"C0o\", basefmt=\" \", label=\"Tono de +1 kHz\") axes[0, 1].stem(f / 1000, np.abs(C2), linefmt=\"C1-\", markerfmt=\"C1s\", basefmt=\" \", label=\"Tono de -2 kHz\") axes[0, 1].legend() axes[1, 1].stem(f / 1000, np.abs(C_suma), basefmt=\" \") axes[1, 1].set_title(\"Espectro de la suma\") for ax in axes[:, 1]: ax.set(xlabel=\"Frecuencia (kHz)\", ylabel=\"Magnitud por componente\", xlim=(-3, 3), ylim=(-0.04, 1.15)) for ax in axes.flat: ax.grid(alpha=0.2) plt.show()"
