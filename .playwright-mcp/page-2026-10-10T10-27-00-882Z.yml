            - code [ref=f42e6921]: "import numpy as np import matplotlib.pyplot as plt fs = 8000 f0 = 1000 N = 64 t = np.arange(N) / fs theta = 2 * np.pi * f0 * t x_real = np.cos(theta) z_pos = np.exp(1j * theta) z_neg = np.exp(-1j * theta) visible = t < 0.002 # Primeros 2 ms para el gráfico temporal. def espectro(y, fs): frecuencias = np.fft.fftshift(np.fft.fftfreq(len(y), d=1 / fs)) coeficientes = np.fft.fftshift(np.fft.fft(y)) / len(y) return frecuencias, coeficientes print(f\"Duración del bloque: {1000 * N / fs:g} ms\")"
          - paragraph [ref=f42e6922]:
            - text: La función
            - code [ref=f42e6923]: espectro
            - text: devuelve las frecuencias en Hz y sus coeficientes complejos.
            - code [ref=f42e6924]: fftfreq
            - text: construye el eje usando el intervalo entre muestras;
            - code [ref=f42e6925]: fftshift
            - text: "ordena ambos arreglos para colocar las frecuencias negativas a la izquierda y las positivas a la derecha. La división entre el número de muestras fija la escala usada en estos ejemplos. Estas operaciones se documentan en NumPy:"
