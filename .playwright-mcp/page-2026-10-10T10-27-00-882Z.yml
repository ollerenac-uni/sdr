            - code [ref=f42e18718]: "from pathlib import Path import numpy as np import matplotlib.pyplot as plt ruta = Path(globals().get(\"ruta_captura\", \"fm_99p1MHz_2p4Msps_g30.cu8\")) fs, fc, N, por_fila = 2400000, 99100000, 4096, 10 if not ruta.is_file(): raise FileNotFoundError(f\"Falta la grabación: {ruta}\") if ruta.stat().st_size % 2: raise ValueError(\"El archivo CU8 debe contener pares completos I/Q\") filas = min(ruta.stat().st_size // (2 * N * por_fila), 585) if filas < 1: raise ValueError(\"Se necesitan diez bloques completos de 4096 muestras I/Q\") w = 0.5 - 0.5 * np.cos(2 * np.pi * np.arange(N) / N) potencia = np.empty((filas, N)) with ruta.open(\"rb\") as archivo: for fila in range(filas): raw = np.fromfile(archivo, dtype=np.uint8, count=2 * N * por_fila) v = (raw.astype(np.float32) - 127.5) / 127.5 z = (v[0::2] + 1j * v[1::2]).reshape(por_fila, N) P = np.abs(np.fft.fftshift(np.fft.fft(z * w, axis=1), axes=1)) ** 2 / w.sum() ** 2 potencia[fila] = P.mean(axis=0) referencia = max(potencia.mean(axis=0).max(), np.finfo(float).tiny) db = 10 * np.log10(np.maximum(potencia / referencia, 1e-12)) f_rf = (fc + np.fft.fftshift(np.fft.fftfreq(N, 1 / fs))) / 1e6 paso_f = fs / N / 1e6 tiempo_bordes = np.arange(filas + 1) * por_fila * N / fs frecuencia_bordes = np.r_[f_rf - paso_f / 2, f_rf[-1] + paso_f / 2] fig, ax = plt.subplots(figsize=(12, 6.5), layout=\"constrained\") imagen = ax.pcolormesh(frecuencia_bordes, tiempo_bordes, db, cmap=\"magma\", vmin=-50, vmax=5, shading=\"flat\", rasterized=True) ax.set(title=\"La misma captura observada a lo largo del tiempo\", xlabel=\"Frecuencia RF (MHz)\", ylabel=\"Tiempo desde el inicio (s)\", xlim=(97.9, 100.3), ylim=(tiempo_bordes[-1], 0)) for frecuencia in [98.1, 99.1, 100.1]: ax.text(frecuencia, tiempo_bordes[-1] * 0.12, \"A: banda\", color=\"white\", ha=\"center\", bbox={\"facecolor\": \"black\", \"alpha\": 0.65}) ax.annotate(\"B: línea estable\", xy=(99.36, tiempo_bordes[-1] * 0.5), xytext=(99.53, tiempo_bordes[-1] * 0.65), color=\"white\", arrowprops={\"arrowstyle\": \"->\", \"color\": \"white\"}) ax.annotate(\"C: borde\", xy=(97.93, tiempo_bordes[-1] * 0.7), xytext=(98.3, tiempo_bordes[-1] * 0.85), color=\"white\", arrowprops={\"arrowstyle\": \"->\", \"color\": \"white\"}) fig.colorbar(imagen, ax=ax, label=\"Potencia relativa (dB; referencia común a todas las filas)\") print(\"Filas:\", filas, \"; segundos mostrados:\", tiempo_bordes[-1]) plt.show()"
          - heading "6.4. ¿Cuánta banda necesita conservar el receptor?" [level=4] [ref=f42e18719]
          - list [ref=f42e18720]:
            - listitem [ref=f42e18721]: La Figura 26 muestra bandas, no tonos aislados. La marca de 200 kHz permite comparar tamaños, pero no mide automáticamente su ancho.
            - listitem [ref=f42e18722]: El ancho observado depende del contenido transmitido, el ruido y el criterio elegido para marcar sus límites.
            - listitem [ref=f42e18723]: El laboratorio filtra la banda central antes de reducir el sampling rate. Así evita superponer las otras bandas al canal deseado.
