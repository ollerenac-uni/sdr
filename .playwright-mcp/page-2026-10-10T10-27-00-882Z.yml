              - text: . Las ocho flechas quedan superpuestas hacia la derecha.
              - list [ref=f42e14973]:
                - listitem [ref=f42e14974]: En la muestra 0 se resta 0°. En la muestra 1 se resta 45°; en la muestra 2, 90°.
            - listitem [ref=f42e14975]:
              - strong [ref=f42e14976]: "C — Suma de la prueba de 1 kHz:"
              - text: cada flecha empieza donde termina la anterior. Ninguna cambia de longitud al trasladarla.
              - list [ref=f42e14977]:
                - listitem [ref=f42e14978]: La resultante roja une 0 con 8. Su longitud dividida entre ocho produce una barra de altura 1.
            - listitem [ref=f42e14979]:
              - strong [ref=f42e14980]: "D — Prueba de 2 kHz:"
              - text: ahora se resta
