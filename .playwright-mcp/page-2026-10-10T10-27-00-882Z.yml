                    - generic [ref=f42e19836]: j
                    - generic [ref=f42e19837]: Q
              - text: . Aparece una componente en +1 kHz, con magnitud 1.
            - listitem [ref=f42e19838]: El ejemplo está alineado con un bin y usa ventana rectangular. Un tono entre bins produciría leakage.
          - paragraph [ref=f42e19839]:
            - strong [ref=f42e19840]: "Panel D — FFT de solo I:"
          - list [ref=f42e19841]:
            - listitem [ref=f42e19842]: "La entrada es otra: solo I, un coseno real. Aparecen componentes en −1 y +1 kHz, con magnitud 0.5 cada una."
            - listitem [ref=f42e19843]: Omitir Q no equivale a cambiar el visor. Cambia la secuencia entregada a la FFT.
          - heading "Dos caminos desde las mismas muestras" [level=3] [ref=f42e19844]
          - paragraph [ref=f42e19845]: Las muestras permiten observar el espectro o recuperar audio. El demodulador no recibe la curva dibujada por la FFT.
          - code [ref=f42e19847]: "flowchart TD A[\"Archivo CU8: pares I/Q\"] --> B[\"Decodificar muestras complejas\"] B --> C[\"Bloques de N muestras\"] C --> D[\"Ventana y FFT\"] D --> E[\"Magnitud al cuadrado\"] E --> F[\"Promedio de potencia lineal y dB\"] F --> G[\"Espectro o waterfall\"] H[\"Metadatos: sampling rate y frecuencia central\"] -.-> C H -.-> G B --> I[\"Seleccionar canal: filtrar y reducir tasa\"] I --> J[\"Medir giro entre muestras\"] J --> K[\"Filtrar audio, decimar y aplicar de-emphasis\"] K --> L[\"Audio mono\"] M[\"S04: centrar primero si el canal no está en cero\"] -.-> I"
          - paragraph [ref=f42e19848]:
            - strong [ref=f42e19849]: Figura 31.
            - text: El análisis y la demodulación parten de las muestras I/Q; observar un espectro no equivale a recuperar audio.
          - list [ref=f42e19850]:
            - listitem [ref=f42e19851]:
              - strong [ref=f42e19852]: "Rama de análisis:"
              - text: los bloques producen estimaciones de potencia. Los metadatos permiten expresar sus ejes en tiempo y RF.
            - listitem [ref=f42e19853]:
              - strong [ref=f42e19854]: "Rama de audio:"
              - text: el receptor selecciona un canal antes de medir el giro. El procesamiento posterior entrega audio mono.
            - listitem [ref=f42e19855]:
              - strong [ref=f42e19856]: "Avance a S04:"
              - text: un canal fuera del centro necesita primero un desplazamiento. En este laboratorio se utiliza la banda central.
