            - code [ref=f42e5320]: "theta_giro = 2 * np.pi * 1000 * t z_pos = np.exp(1j * theta_giro) z_neg = np.exp(-1j * theta_giro) print(\"Las componentes I coinciden:\", np.allclose(z_pos.real, z_neg.real)) print(\"Las componentes Q son opuestas:\", np.allclose(z_pos.imag, -z_neg.imag)) fig, axes = plt.subplots(1, 2, figsize=(10, 5), layout=\"constrained\") circulo = np.exp(1j * np.linspace(0, 2 * np.pi, 200)) casos = [(z_pos, \"+1 kHz: giro antihorario\", \"tab:blue\"), (z_neg, \"-1 kHz: giro horario\", \"tab:red\")] for ax, (tono, titulo, color) in zip(axes, casos): ax.plot(circulo.real, circulo.imag, color=\"0.7\") ax.plot(tono[:8].real, tono[:8].imag, \"o\", color=color) for k in (0, 1, 2, 4, 6): ax.text(1.12 * tono[k].real, 1.12 * tono[k].imag, f\"n={k}\", ha=\"center\", va=\"center\") ax.annotate(\"\", xy=(tono[1].real, tono[1].imag), xytext=(tono[0].real, tono[0].imag), arrowprops={\"arrowstyle\": \"->\", \"color\": color, \"lw\": 2}) ax.axhline(0, color=\"0.7\") ax.axvline(0, color=\"0.7\") ax.set(xlabel=\"I\", ylabel=\"Q\", title=titulo, xlim=(-1.4, 1.4), ylim=(-1.4, 1.4)) ax.set_aspect(\"equal\") ax.grid(alpha=0.2) plt.show()"
