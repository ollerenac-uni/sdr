          - paragraph [ref=f42e6939]:
            - strong [ref=f42e6940]: Figura 6.
            - text: Representaciones temporal y frecuencial de un coseno real y de dos tonos complejos con sentidos de giro opuestos.
          - paragraph [ref=f42e6941]: La primera fila muestra un coseno con dos componentes de magnitud 0.5. Las otras filas tienen la misma componente I, pero Q cambia de signo y el pico aparece en un lado diferente del eje de frecuencias. Cada espectro utiliza las 64 muestras del bloque de 8 ms. Los gráficos temporales muestran solo las primeras 16 muestras, dentro de los primeros 2 ms; las líneas entre puntos guían la lectura y no son una reconstrucción de la señal.
          - paragraph [ref=f42e6942]: La magnitud se presenta en escala lineal, sin convertirla a potencia ni a dBm. Se muestra el espectro completo, con ambos signos de frecuencia; no se duplica la altura del pico positivo del coseno para formar un espectro de un solo lado.
