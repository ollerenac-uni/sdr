        - heading "1. Una muestra es un punto con dos coordenadas" [level=2] [ref=e233]
        - paragraph [ref=e235]:
          - img "Una muestra del tono en el plano I/Q antes y después de centrarlo; las proyecciones horizontales y verticales indican los valores I y Q" [ref=e236]
        - paragraph [ref=e237]:
          - strong [ref=e238]: Figura 1.
          - text: Una misma muestra del objetivo antes y después de la mezcla, con sus proyecciones sobre los ejes I y Q.
        - list [ref=e240]:
          - listitem [ref=e241]:
            - strong [ref=e242]: "Flecha izquierda:"
            - text: representa la muestra de entrada. Su posición horizontal es I y su posición vertical es Q.
          - listitem [ref=e243]:
            - strong [ref=e244]: "Flecha derecha:"
            - text: representa la muestra después de multiplicarla por el oscilador complejo.
          - listitem [ref=e245]:
            - strong [ref=e246]: "Caso estático:"
            - text: en n = 1, la entrada tiene fase 60°. La mezcla añade −60°, por lo que la salida tiene fase 0°.
          - listitem [ref=e247]:
            - strong [ref=e248]: "Longitud:"
            - text: vale 1 antes y después. No se aumenta la amplitud ni se elimina una rama.
        - heading "Comprobación" [level=3] [ref=e249]
        - list [ref=e250]:
          - listitem [ref=e251]:
            - text: Se selecciona
            - strong [ref=e252]: «3. Fase de 45°»
            - text: . ¿La flecha centrada queda sobre el eje I? ¿Q desaparece?
        - group [ref=e253]:
          - generic "Solución explicada" [ref=e254] [cursor=pointer]
          - text: e j π / 4 = c o s ( π / 4 ) + j s i n ( π / 4 ) e j π / 4 = c o s ( π / 4 ) + j s i n ( π / 4 )
        - heading "2. Las curvas I/Q son las coordenadas de esa flecha" [level=2] [ref=e255]
        - paragraph [ref=e257]:
          - img "Muestras temporales I y Q del tono de más 400 kHz antes de mezclar, y valores constantes I igual a uno y Q igual a cero después de centrarlo" [ref=e258]
        - paragraph [ref=e259]:
          - strong [ref=e260]: Figura 2.
          - text: Las componentes I y Q del objetivo durante 37 muestras; la línea vertical identifica la muestra del plano I/Q.
        - list [ref=e262]:
          - listitem [ref=e263]:
            - strong [ref=e264]: "Azul:"
            - text: valores I, es decir, las posiciones horizontales de la flecha.
          - listitem [ref=e265]:
            - strong [ref=e266]: "Naranja:"
            - text: valores Q, es decir, las posiciones verticales de la misma flecha.
          - listitem [ref=e267]:
            - strong [ref=e268]: "Antes:"
            - text: el tono gira y sus coordenadas cambian. No son dos señales de radio distintas.
          - listitem [ref=e269]:
            - strong [ref=e270]: "Después:"
            - text: para el tono puro con fase inicial cero, la flecha queda fija en (1, 0). Por eso las curvas son horizontales.
        - heading "Comprobación" [level=3] [ref=e271]
        - list [ref=e272]:
          - listitem [ref=e273]:
            - text: Se selecciona
            - strong [ref=e274]: «2. Centrar en 0 Hz»
            - text: ", se cambia la fase inicial a"
            - strong [ref=e275]: 90°
            - text: y se avanzan varias muestras. ¿Qué valores deberían mantenerse?
        - group [ref=e276]:
          - generic "Solución explicada" [ref=e277] [cursor=pointer]
          - text: y 0 [ n ] = e j ϕ y 0 [ n ] = e j ϕ ϕ = 9 0 ° = π / 2 ϕ = 9 0 ° = π / 2 c o s ( π / 2 ) = 0 c o s ( π / 2 ) = 0 s i n ( π / 2 ) = 1 s i n ( π / 2 ) = 1
        - heading "3. El espectro permite comprobar el desplazamiento" [level=2] [ref=e278]
        - paragraph [ref=e280]:
          - img "Espectro de los tres tonos de entrada y espectro de salida tras desplazarlos menos 400 kHz; el objetivo aparece en cero y los otros tonos permanecen" [ref=e281]
        - paragraph [ref=e282]:
          - strong [ref=e283]: Figura 3.
          - text: Espectros del bloque completo antes y después de la mezcla; centrar el objetivo no elimina las otras componentes.
        - list [ref=e285]:
          - listitem [ref=e286]:
            - strong [ref=e287]: "Objetivo:"
            - text: el tono original de +400 kHz se representa en morado.
          - listitem [ref=e288]:
            - strong [ref=e289]: "Otros tonos:"
            - text: aparecen en gris y también se desplazan −400 kHz. No desaparecen.
          - listitem [ref=e290]:
            - strong [ref=e291]: "Distinción importante:"
            - text: esta figura puede mostrar los tres tonos; las dos figuras anteriores muestran solamente el objetivo, aislado por construcción.
          - listitem [ref=e292]:
            - strong [ref=e293]: "Línea vertical:"
            - text: indica una frecuencia presente; no representa un pulso en el tiempo.
