          - heading "Curso de Pregrado · Acceso Abierto · CC BY 4.0" [level=3] [ref=e161]
          - paragraph [ref=e162]:
            - text: "Un curso práctico de radio definida por software (SDR): desde las muestras I/Q y el procesamiento digital hasta la construcción guiada de un receptor QPSK sencillo. El curso comprende 16 sesiones, con tiempo de integración y consolidación. No se requiere hardware SDR individual: se utilizan archivos de muestras"
            - code [ref=e163]: .cu8
            - text: y señales generadas en Python o GNU Radio.
